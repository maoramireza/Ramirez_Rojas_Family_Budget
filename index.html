<script>
/* ===== Budget sync: merge instead of overwrite (plain JS, tested separately) ===== */
(function (root) {
  "use strict";
  // Stable JSON: the database stores objects with its own key order, so compare by content, not text.
  function canon(v) {
    if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
    if (v && typeof v === "object") return "{" + Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
    return JSON.stringify(v === undefined ? null : v);
  }
  const same = (a, b) => canon(a) === canon(b);
  const isObj = (v) => v && typeof v === "object" && !Array.isArray(v);
  const hasIds = (arr) => Array.isArray(arr) && arr.length > 0 && arr.every((x) => isObj(x) && x.id != null);
  const isScalars = (arr) => Array.isArray(arr) && arr.every((x) => x === null || typeof x !== "object");

  // Three-way merge: base = what both sides last agreed on, ours = this device, theirs = what's saved now.
  // Whatever only one side changed is kept; additions from both sides are kept; a deletion by either side is honored
  // unless the other side edited that same thing. When both changed the same single value, this device's edit wins.
  function merge3(base, ours, theirs) {
    if (same(ours, theirs)) return ours;
    if (same(base, ours)) return theirs;
    if (same(base, theirs)) return ours;
    if (ours === undefined) return theirs;            // we removed it, they changed it: keep their change
    if (theirs === undefined) return ours;            // they removed it, we changed it: keep ours
    const arrs = [base, ours, theirs].filter((x) => x !== undefined);
    if (arrs.every(Array.isArray)) {
      const b = Array.isArray(base) ? base : [];
      if ([b, ours, theirs].every((a) => a.length === 0 || hasIds(a))) return mergeById(b, ours, theirs);
      if ([b, ours, theirs].every(isScalars)) return mergeList(b, ours, theirs);
      return ours;
    }
    if (isObj(ours) && isObj(theirs)) {
      const b = isObj(base) ? base : {};
      const out = {};
      new Set([...Object.keys(b), ...Object.keys(ours), ...Object.keys(theirs)]).forEach((k) => {
        const v = merge3(b[k], ours[k], theirs[k]);
        if (v !== undefined) out[k] = v;
      });
      return out;
    }
    return ours;
  }
  function mergeById(base, ours, theirs) {
    const map = (a) => new Map(a.map((x) => [String(x.id), x]));
    const B = map(base), O = map(ours), T = map(theirs);
    const out = [];
    const seen = new Set();
    theirs.forEach((x) => { const id = String(x.id); if (!O.has(id) && !B.has(id)) { out.push(x); seen.add(id); } });   // new from them
    ours.forEach((x) => {
      const id = String(x.id); if (seen.has(id)) return;
      const v = merge3(B.get(id), x, T.get(id));
      if (v !== undefined) out.push(v); seen.add(id);
    });
    theirs.forEach((x) => {                                          // theirs we never had but base did: we deleted it
      const id = String(x.id); if (seen.has(id)) return;
      const v = merge3(B.get(id), undefined, x);
      if (v !== undefined) out.push(v);
    });
    return out;
  }
  function mergeList(base, ours, theirs) {
    const inB = new Set(base.map(String)), inO = new Set(ours.map(String)), inT = new Set(theirs.map(String));
    const keep = (x) => { const k = String(x); return !(inB.has(k) && (!inO.has(k) || !inT.has(k))); };  // removed by either side
    const out = [];
    const add = (x) => { if (!out.some((y) => String(y) === String(x)) && keep(x)) out.push(x); };
    ours.forEach(add); theirs.forEach(add);
    return out;
  }

  // Categories never vanish while they're in use: anything a transaction or budget refers to is listed,
  // unless someone deliberately removed it (then it's recorded in hiddenCats).
  function healCategories(s) {
    if (!s || !s.categories) return s;
    let changed = false;
    const hidden = s.hiddenCats || {};
    const want = { Income: new Set(), Expenses: new Set(), Savings: new Set() };
    (s.entries || []).forEach((e) => { if (want[e.type] && e.category) want[e.type].add(e.category); });
    Object.keys(want).forEach((t) => Object.entries((s.plan || {})[t] || {}).forEach(([c, months]) => { if (months && Object.values(months).some((v) => v)) want[t].add(c); }));
    const next = { ...s.categories };
    Object.keys(want).forEach((t) => {
      const list = (next[t] || []).slice();
      want[t].forEach((c) => { if (!list.includes(c) && !(hidden[t] || []).includes(c)) { list.push(c); changed = true; } });
      next[t] = list;
    });
    return changed ? { ...s, categories: next } : s;
  }

  // A category only disappears when someone removed it on purpose (removing, renaming or resetting records it in
  // hiddenCats). A copy that simply never had it, like an older version of the app or a phone that was out of date,
  // can't make it vanish.
  function keepCategories(merged, ours, theirs) {
    if (!merged || !merged.categories) return merged;
    const hidden = merged.hiddenCats || {};
    const next = { ...merged.categories };
    let changed = false;
    [ours, theirs].forEach((src) => Object.entries((src && src.categories) || {}).forEach(([t, list]) => {
      (list || []).forEach((c) => {
        const cur = next[t] || [];
        if (!cur.includes(c) && !(hidden[t] || []).includes(c)) { next[t] = [...cur, c]; changed = true; }
      });
    }));
    return changed ? { ...merged, categories: next } : merged;
  }
  // Everything a save or an incoming change goes through.
  function mergeStates(base, ours, theirs) {
    if (!ours) return healCategories(theirs);
    if (!theirs) return ours;
    return healCategories(keepCategories(merge3(base || undefined, ours, theirs), ours, theirs));
  }

  // Undo/redo: revert (or re-apply) only what one step changed, keeping everything that happened since,
  // including the other phone's edits.
  const undoStep = (step, current) => healCategories(merge3(step.after, step.before, current));
  const redoStep = (step, current) => healCategories(merge3(step.before, step.after, current));

  // A short, plain description of what changed between two versions ("removed category Vacaciones").
  function describe(a, b) {
    if (!a || !b || same(a, b)) return null;
    const money = (n) => "$" + (Math.round((+n || 0) * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    for (const t of ["Income", "Expenses", "Savings"]) {
      const ca = (a.categories || {})[t] || [], cb = (b.categories || {})[t] || [];
      const add = cb.filter((c) => !ca.includes(c)), rem = ca.filter((c) => !cb.includes(c));
      if (add.length === 1 && rem.length === 1) return `renamed ${rem[0]} to ${add[0]}`;
      if (rem.length) return rem.length === 1 ? `removed category ${rem[0]}` : `removed ${rem.length} categories`;
      if (add.length) return add.length === 1 ? `added category ${add[0]}` : `added ${add.length} categories`;
    }
    const ea = new Map((a.entries || []).map((e) => [e.id, e])), eb = new Map((b.entries || []).map((e) => [e.id, e]));
    const added = [...eb.values()].filter((e) => !ea.has(e.id)), gone = [...ea.values()].filter((e) => !eb.has(e.id));
    const edited = [...eb.values()].filter((e) => ea.has(e.id) && !same(ea.get(e.id), e));
    const one = (e) => `${e.category || "uncategorized"} ${money(e.amount)}`;
    if (added.length && gone.length) return `added ${added.length} and removed ${gone.length} transactions`;
    if (added.length) return added.length === 1 ? `added ${one(added[0])}` : `added ${added.length} transactions`;
    if (gone.length) return gone.length === 1 ? `deleted ${one(gone[0])}` : `deleted ${gone.length} transactions`;
    if (edited.length) return edited.length === 1 ? `edited ${one(edited[0])}` : `edited ${edited.length} transactions`;
    const changedCats = (key) => {
      const out = new Set();
      ["Income", "Expenses", "Savings"].forEach((t) => {
        const pa = ((a[key] || {})[t]) || {}, pb = ((b[key] || {})[t]) || {};
        new Set([...Object.keys(pa), ...Object.keys(pb)]).forEach((c) => { if (!same(pa[c], pb[c])) out.add(c); });
      });
      return [...out];
    };
    const meta = changedCats("catMeta");
    if (meta.length) return meta.length === 1 ? `changed how ${meta[0]} is planned` : `changed how ${meta.length} categories are planned`;
    const plan = [...new Set([...changedCats("plan"), ...changedCats("planOverride")])];
    if (plan.length) return plan.length === 1 ? `budget for ${plan[0]}` : `budgets for ${plan.length} categories`;
    if (!same(a.planMonths, b.planMonths)) return "budget months";
    if (!same(a.buckets, b.buckets)) return "buckets";
    if (!same(a.split, b.split)) return "split";
    if (!same(a.settings, b.settings)) return "a setting";
    if (!same(a.importer, b.importer)) return "import settings";
    return "last change";
  }

  const api = { canon, same, merge3, healCategories, keepCategories, mergeStates, undoStep, redoStep, describe };
  root.BudgetSync = api;
  if (typeof module !== "undefined" && module.exports) module.exports = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
/* ===== Planning helpers: paydays, non-monthly costs, bill detection (plain JS, tested separately) ===== */
(function (root) {
  "use strict";
  const pad = (n) => String(n).padStart(2, "0");
  const lastDay = (key) => { const [y, m] = key.split("-").map(Number); return new Date(y, m, 0).getDate(); };
  const addMonths = (key, n) => { const [y, m] = key.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const toDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const toISO = (t) => `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
  const addDays = (iso, n) => { const t = toDate(iso); t.setDate(t.getDate() + n); return toISO(t); };
  const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
  const round2 = (v) => Math.round(v * 100) / 100;
  // Saturday or Sunday paydays are paid the Friday before.
  const beforeWeekend = (iso) => { const wd = toDate(iso).getDay(); return wd === 6 ? addDays(iso, -1) : wd === 0 ? addDays(iso, -2) : iso; };
  const dayIn = (key, d) => `${key}-${pad(Math.min(d, lastDay(key)))}`;

  // The dates that count toward month `key`: paychecks in the last `shift` days of a month count toward the next one.
  function payWindow(key, shift) {
    const n = shift || 0;
    const prev = addMonths(key, -1);
    return { from: n ? `${prev}-${pad(lastDay(prev) - n + 1)}` : `${key}-01`, to: `${key}-${pad(lastDay(key) - n)}` };
  }
  // pay = { freq: "biweekly" | "semimonthly" | "monthly", anchor: "YYYY-MM-DD" (biweekly), day: 1-31 (monthly), amount }
  function paydays(pay, key, shift) {
    if (!pay || !pay.freq) return [];
    const { from, to } = payWindow(key, shift);
    const out = [];
    if (pay.freq === "biweekly") {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(pay.anchor || "")) return [];
      let d = addDays(pay.anchor, Math.ceil(daysBetween(pay.anchor, from) / 14) * 14);
      for (; d <= to; d = addDays(d, 14)) if (d >= from) out.push(d);
      return out;
    }
    const cands = [];
    [addMonths(key, -1), key].forEach((k) => {
      if (pay.freq === "semimonthly") cands.push(beforeWeekend(dayIn(k, 15)), beforeWeekend(dayIn(k, 31)));
      if (pay.freq === "monthly") cands.push(beforeWeekend(dayIn(k, +pay.day || 1)));
    });
    return [...new Set(cands)].filter((d) => d >= from && d <= to).sort();
  }
  const payAmount = (pay, key, shift) => round2(paydays(pay, key, shift).length * (+pay.amount || 0));

  // Non-monthly: sched = { months: [1..12], amount, mode: "due" (budget it in the months it's due) | "spread" (set aside monthly) }
  function schedAmount(sched, key) {
    if (!sched || !(sched.months || []).length || !(+sched.amount > 0)) return 0;
    if (sched.mode === "spread") return round2((+sched.amount * sched.months.length) / 12);
    return sched.months.includes(+key.slice(5)) ? round2(+sched.amount) : 0;
  }
  // The most recent due month before `key` (so the set-aside fund restarts after each payment).
  function lastDueBefore(sched, key) {
    for (let i = 1; i <= 12; i++) { const k = addMonths(key, -i); if ((sched.months || []).includes(+k.slice(5))) return k; }
    return null;
  }

  // Guess a pay schedule from past deposits: [{date, amount}] (any order).
  function detectPay(rows, today) {
    const since = addDays(today, -200);
    const list = rows.filter((r) => r.date && r.date >= since && r.date <= today && r.amount > 0).sort((a, b) => a.date.localeCompare(b.date));
    // Same-day deposits (split paychecks) count as one payday.
    const days = [];
    list.forEach((r) => { const last = days[days.length - 1]; if (last && last.date === r.date) last.amount += r.amount; else days.push({ date: r.date, amount: r.amount }); });
    if (days.length < 3) return null;
    const gaps = days.slice(1).map((r, i) => daysBetween(days[i].date, r.date));
    const med = (a) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
    const g = med(gaps);
    const amount = round2(med(days.slice(-4).map((r) => r.amount)));
    const latest = days[days.length - 1].date;
    const recent = gaps.slice(-4);
    if (g >= 13 && g <= 15 && recent.every((x) => x >= 12 && x <= 16)) return { freq: "biweekly", anchor: latest, amount, count: days.length };
    if (g >= 12 && g <= 18 && recent.every((x) => x >= 10 && x <= 20)) return { freq: "semimonthly", amount, count: days.length, latest };
    if (g >= 26 && g <= 33 && recent.every((x) => x >= 25 && x <= 35)) return { freq: "monthly", day: med(days.slice(-4).map((r) => +r.date.slice(8))), amount, count: days.length, latest };
    return null;
  }

  // Bills come once or twice a month, in most recent months, with a steady total (utilities can move up to 25%).
  // months = [{ count, sum }] for the last few months that have any data (months with nothing for this category are {0,0}).
  function looksFixed(months) {
    const hit = months.filter((m) => m.count > 0);
    if (hit.length < 2 || hit.length < months.length - 1) return false;
    if (hit.some((m) => m.count > 2)) return false;
    const sums = hit.map((m) => m.sum).sort((a, b) => a - b);
    const mid = sums[Math.floor(sums.length / 2)];
    return mid > 0 && sums.every((s) => Math.abs(s - mid) <= Math.max(2, mid * 0.25));
  }

  const api = { payWindow, paydays, payAmount, schedAmount, lastDueBefore, detectPay, looksFixed, beforeWeekend };
  root.PlanKit = api;
  if (typeof module !== "undefined" && module.exports) module.exports = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
/* ===== Statement importer core (plain JS, tested separately) ===== */
/* =====================================================================
   Statement importer core — pure functions, no React, no DOM.
   Pipeline: PDF → lines → parse (per bank layout) → reconcile → classify → build entries.
   Money is handled in integer cents throughout to avoid floating-point drift.
   Amount sign convention on parsed rows: negative = money left the household account, positive = money came in.
   ===================================================================== */
(function (root) {
  "use strict";

  /* ---------------- money & dates ---------------- */
  const MONEY = "-?\\$?-?\\d[\\d,]*\\.\\d{2}";
  const MONTHS = { january:1, february:2, march:3, april:4, may:5, june:6, july:7, august:8, september:9, october:10, november:11, december:12 };

  function toCents(s) {
    if (s == null) return null;
    const t = String(s).replace(/[\u2212\u2013]/g, "-").replace(/[$,\s]/g, "");
    const m = t.match(/^(-?)(\d+)\.(\d{2})$/);
    if (!m) return null;
    const v = parseInt(m[2], 10) * 100 + parseInt(m[3], 10);
    return m[1] === "-" && v !== 0 ? -v : v;
  }
  const pad2 = (n) => String(n).padStart(2, "0");
  const iso = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
  const validMD = (m, d) => m >= 1 && m <= 12 && d >= 1 && d <= 31;

  function longDate(s) { // "August 8, 2026"
    const m = String(s).trim().match(/^([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})$/);
    if (!m || !MONTHS[m[1].toLowerCase()]) return null;
    return iso(+m[3], MONTHS[m[1].toLowerCase()], +m[2]);
  }
  function addDays(isoDate, n) {
    const d = new Date(isoDate + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function dayDiff(a, b) { return Math.round((new Date(a + "T12:00:00Z") - new Date(b + "T12:00:00Z")) / 86400000); }

  // Month/day with no year: choose the year that places the date on or just before the reference date.
  function inferYear(mm, dd, refIso, slackDays) {
    let y = +refIso.slice(0, 4);
    let d = iso(y, mm, dd);
    if (dayDiff(d, refIso) > (slackDays || 10)) d = iso(y - 1, mm, dd);
    return d;
  }

  /* ---------------- PDF → positioned lines ---------------- */
  // pages: array of arrays of {str, x, y, w}; y is measured from the page bottom (PDF.js convention).
  function itemsToLines(pages) {
    const Y_TOL = 2.5, GAP = 0.8, out = [];
    pages.forEach((items, page) => {
      const sorted = items.filter((it) => it.str && it.str.trim()).slice().sort((a, b) => (b.y - a.y) || (a.x - b.x));
      const rows = [];
      for (const it of sorted) {
        const row = rows[rows.length - 1];
        if (row && Math.abs(row.y - it.y) <= Y_TOL) row.items.push(it); else rows.push({ y: it.y, items: [it] });
      }
      for (const r of rows) {
        r.items.sort((a, b) => a.x - b.x);
        let text = "", end = null;
        for (const it of r.items) {
          if (end !== null && it.x - end > GAP && !text.endsWith(" ") && !it.str.startsWith(" ")) text += " ";
          text += it.str; end = it.x + (it.w || 0);
        }
        text = text.replace(/\s+/g, " ").trim();
        if (text) out.push({ text, page, y: r.y });
      }
    });
    return out;
  }

  const PDFJS_VERSION = "3.11.174";
  const PDFJS_BASE = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/`;
  let pdfjsPromise = null;
  function loadPdfJs() {
    if (root.pdfjsLib) return Promise.resolve(root.pdfjsLib);
    if (pdfjsPromise) return pdfjsPromise;
    pdfjsPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = PDFJS_BASE + "pdf.min.js";
      s.async = true;
      const timer = setTimeout(() => { reject(new Error("The PDF reader took too long to load. Check your connection and try again.")); }, 20000);
      s.onload = () => {
        clearTimeout(timer);
        if (!root.pdfjsLib) return reject(new Error("The PDF reader loaded but didn't start."));
        root.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
        resolve(root.pdfjsLib);
      };
      s.onerror = () => { clearTimeout(timer); reject(new Error("Couldn't load the PDF reader. Check your connection and try again.")); };
      document.head.appendChild(s);
    }).catch((e) => { pdfjsPromise = null; throw e; });
    return pdfjsPromise;
  }

  async function readPdfLines(file) {
    const lib = await loadPdfJs();
    const data = new Uint8Array(await file.arrayBuffer());
    // isEvalSupported:false is the official mitigation for CVE-2024-4367 in PDF.js 3.x.
    const doc = await lib.getDocument({ data, isEvalSupported: false, disableFontFace: true }).promise;
    const pages = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      pages.push(tc.items.filter((it) => typeof it.str === "string").map((it) => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width })));
    }
    await doc.destroy();
    if (!pages.some((items) => items.some((it) => it.str.trim()))) throw new Error("This PDF has no readable text. It may be a scanned image, which the importer can't read.");
    return itemsToLines(pages);
  }

  /* ---------------- shared parsing helpers ---------------- */
  const reMoney = (prefix) => new RegExp("^" + prefix + "\\s+(" + MONEY + ")");
  function firstMatch(lines, re, pageFilter) {
    for (const l of lines) { if (pageFilter != null && l.page !== pageFilter) continue; const m = l.text.match(re); if (m) return m; }
    return null;
  }
  function last4From(s) { const d = String(s).replace(/\D/g, ""); return d.length >= 4 ? d.slice(-4) : null; }
  const PAGE_HEADER = /^(.+?)\s+\S\s+Account\s*#\s*[\d ]+\s+\S\s+/;
  const NOISE = [/^Page \d+ of \d+$/i, /continued on the next page/i, /^Date (Transaction )?description Amount$/i, /Account\s*#\s*\d{4}/i];
  const isNoise = (t) => NOISE.some((re) => re.test(t));

  function detect(lines) {
    const has = (re) => lines.some((l) => re.test(l.text));
    if (!has(/Bank of America|bankofamerica\.com/i)) return null;
    if (has(/^Account Summary\/Payment Information/i) && has(/Statement Closing Date/i)) return "bofa-card";

/* ================= PERIOD: one date range drives every tab ================= */
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthStart = (key) => key + "-01";
const monthEnd = (key) => { const [y, m] = key.split("-").map(Number); return `${key}-${pad(new Date(y, m, 0).getDate())}`; };
const addMonths = (key, n) => { const [y, m] = key.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return mk(d.getFullYear(), d.getMonth() + 1); };
const monthsBetween = (a, b) => { const out = []; for (let k = a; k <= b && out.length < 600; k = addMonths(k, 1)) out.push(k); return out; };
const addDaysISO = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); const t = new Date(y, m - 1, d + n); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
const monthLabel = (key) => `${MLABEL[+key.slice(5) - 1]} ${key.slice(0, 4)}`;
const shiftYear = (iso, n) => { const y = +iso.slice(0, 4) + n; let d = iso.slice(5); if (d === "02-29" && !(y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0))) d = "02-28"; return `${y}-${d}`; };
const isWholeMonths = (r) => r.from === monthStart(r.from.slice(0, 7)) && r.to === monthEnd(r.to.slice(0, 7));

const PRESETS = {
  month: () => { const k = localToday().slice(0, 7); return { from: monthStart(k), to: monthEnd(k) }; },
  last: () => { const k = addMonths(localToday().slice(0, 7), -1); return { from: monthStart(k), to: monthEnd(k) }; },
  year: () => { const y = localToday().slice(0, 4); return { from: `${y}-01-01`, to: `${y}-12-31` }; },
};
function allTimeRange(state) {
  const today = localToday();
  const dates = state.entries.map((e) => e.date).filter(Boolean).sort();
  const bm = budgetedMonths(state);
  const first = [dates[0], bm[0] && monthStart(bm[0]), today].filter(Boolean).sort()[0];
  const last = [dates[dates.length - 1], today].filter(Boolean).sort().pop();
  return { from: monthStart(first.slice(0, 7)), to: monthEnd(last.slice(0, 7)) };
}
function describeRange(r) {
  const fk = r.from.slice(0, 7), tk = r.to.slice(0, 7);
  const ml = (k) => MLABEL[+k.slice(5) - 1];
  if (isWholeMonths(r)) {
    if (fk === tk) return monthLabel(fk);
    if (fk.slice(5) === "01" && tk.slice(5) === "12" && fk.slice(0, 4) === tk.slice(0, 4)) return fk.slice(0, 4);
    return fk.slice(0, 4) === tk.slice(0, 4) ? `${ml(fk)} – ${ml(tk)} ${tk.slice(0, 4)}` : `${monthLabel(fk)} – ${monthLabel(tk)}`;
  }
  const d = (iso) => `${ml(iso.slice(0, 7))} ${+iso.slice(8)}`;
  return r.from.slice(0, 4) === r.to.slice(0, 4) ? `${d(r.from)} – ${d(r.to)}, ${r.to.slice(0, 4)}` : `${d(r.from)}, ${r.from.slice(0, 4)} – ${d(r.to)}, ${r.to.slice(0, 4)}`;
}
function shiftRange(r, dir) {
  if (isWholeMonths(r)) {
    const fk = r.from.slice(0, 7), tk = r.to.slice(0, 7), n = monthsBetween(fk, tk).length * dir;
    return { from: monthStart(addMonths(fk, n)), to: monthEnd(addMonths(tk, n)) };
  }

}
function makePeriod(r) {
  const months = monthsBetween(r.from.slice(0, 7), r.to.slice(0, 7));
  const inRange = (d) => !!d && d >= r.from && d <= r.to;
  const today = localToday();
  return { ...r, months, inRange, label: describeRange(r), defaultDate: inRange(today) ? today : r.from };
}

/* ================= PAYCHECKS AT MONTH-END =================
   A paycheck landing in the last few days of a month pays next month's bills, so it counts toward next month.
   The entry keeps its real date; only budgeting uses the shifted one. A single entry can override: "same" or "next". */
const incomeShiftDays = (state) => { const n = state.settings && state.settings.incomeShiftDays; return Number.isInteger(n) ? n : 3; };
function countsDate(e, state) {
  if (!e.date) return e.date;
  const key = e.date.slice(0, 7);
  if (e.budgetMonth === "same") return e.date;
  if (e.budgetMonth === "next") return monthStart(addMonths(key, 1));
  if (e.type !== "Income") return e.date;
  const n = incomeShiftDays(state);
  if (!n) return e.date;
  return +e.date.slice(8) > +monthEnd(key).slice(8) - n ? monthStart(addMonths(key, 1)) : e.date;
}
const countsMonth = (e, state) => (countsDate(e, state) || "").slice(0, 7);

/* ================= DATA COMPLETENESS =================
   Once an account's statements are being imported, a month is complete only when that account's statements
   cover every day of it (up to today). Months before an account's first statement aren't judged. */
// A month either of you marked as finished (every statement you have is in) counts as complete.
const isClosed = (state, key) => (state.closedMonths || []).includes(key);
function statementGaps(state, key) {
  if (isClosed(state, key)) return [];
  const imp = state.importer;
  if (!imp || !imp.imports || !imp.imports.length) return [];
  const today = localToday();
  const ms = monthStart(key);
  if (ms > today) return [];
  const me = monthEnd(key) < today ? monthEnd(key) : today;
  const byAcct = {};
  imp.imports.forEach((i) => { if (i.kind !== "photo") (byAcct[i.acct] = byAcct[i.acct] || []).push(i); });
  const gaps = [];
  Object.entries(byAcct).forEach(([acct, raw]) => {
    const list = raw.slice().sort((a, b) => a.start.localeCompare(b.start));
    let cursor = ms > list[0].start ? ms : list[0].start;
    if (cursor > me) return;
    for (const i of list) {
      if (i.end < cursor) continue;
      if (i.start > me) break;
      if (i.start > cursor) gaps.push({ acct, from: cursor, to: addDaysISO(i.start, -1) });
      cursor = addDaysISO(i.end, 1);
      if (cursor > me) break;
    }
    if (cursor <= me) gaps.push({ acct, from: cursor, to: me });
  });

}
function gapLabel(state, g) {
  const reg = (state.importer && state.importer.accounts && state.importer.accounts[g.acct]) || {};
  const name = SI.acctLabel(g.acct, reg.kind, reg);
  return `${name}: ${g.from === g.to ? shortDate(g.from) : `${shortDate(g.from)} – ${shortDate(g.to)}`}`;
}


/* ================= BUDGETS REPEAT =================
   A month is "budgeted" once it has its own amounts (or was edited/copied into).
   A month without its own budget uses the most recent budgeted month before it.
   Budgeted months never change unless you edit them, so past plans stay exactly as they were. */
const monthCache = new WeakMap();
function budgetedMonths(state, fresh) {
  const plan = state.plan || {}, extra = state.planMonths || [];
  if (!fresh) { const hit = monthCache.get(plan); if (hit && hit.extra === extra) return hit.keys; }
  const set = new Set(extra);
  TYPES.forEach((t) => Object.values(plan[t] || {}).forEach((byMonth) => Object.entries(byMonth || {}).forEach(([k, v]) => { if (v) set.add(k); })));
  const keys = [...set].sort();

}
function budgetSource(state, key, fresh) {
  const keys = budgetedMonths(state, fresh);
  let lo = 0, hi = keys.length - 1, ans = null;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (keys[mid] <= key) { ans = keys[mid]; lo = mid + 1; } else hi = mid - 1; }
  return ans;
}
function planFor(state, type, cat, key, fresh) {
  const sc = scheduled(state, type, cat, key);
  if (sc) { const ov = overrideOf(state, type, cat, key); return ov != null ? ov : sc.auto; }
  const src = budgetSource(state, key, fresh); return src ? (state.plan[type]?.[cat]?.[src] || 0) : 0;
}
function planSum(state, type, cat, months) { return months.reduce((a, k) => a + planFor(state, type, cat, k), 0); }
// Give `key` its own copy of the budget it currently repeats, so editing it can't change other months.
function ownMonth(s, key) {
  const own = budgetedMonths(s, true);
  if (!own.includes(key)) {
    const src = budgetSource(s, key, true);
    if (src) TYPES.forEach((t) => (s.categories[t] || []).forEach((c) => {
      const v = s.plan[t]?.[c]?.[src];
      if (v) { s.plan[t] = s.plan[t] || {}; s.plan[t][c] = s.plan[t][c] || {}; s.plan[t][c][key] = v; }
    }));
  }
  if (!(s.planMonths || []).includes(key)) s.planMonths = [...(s.planMonths || []), key].sort();

/* ================= SCHEDULED CATEGORIES =================
   Some categories follow a schedule instead of repeating last month's number:
   - income with paydays (every 2 weeks, twice a month, once a month): planned = paychecks that count toward the month × amount
   - non-monthly costs (due in certain months): the amount in those months, or a monthly set-aside.
   A schedule applies from its start month on; earlier months keep the budget they had. Typing a different amount for one month
   is kept as that month's override. Stored in state.catMeta[type][cat] and state.planOverride[type][cat][month]. */
const metaOf = (state, type, cat) => (state.catMeta && state.catMeta[type] && state.catMeta[type][cat]) || null;
const overrideOf = (state, type, cat, key) => { const v = state.planOverride && state.planOverride[type] && state.planOverride[type][cat] && state.planOverride[type][cat][key]; return typeof v === "number" ? v : null; };
function scheduled(state, type, cat, key) {
  const m = metaOf(state, type, cat); if (!m) return null;
  if (type === "Income" && m.pay && m.pay.freq && key >= (m.pay.since || "")) {
    const days = PlanKit.paydays(m.pay, key, incomeShiftDays(state));
    return { kind: "pay", auto: Math.round(days.length * (+m.pay.amount || 0) * 100) / 100, days };
  }
  if (type === "Expenses" && m.kind === "nonmonthly" && m.sched && key >= (m.sched.since || "")) return { kind: "sched", auto: PlanKit.schedAmount(m.sched, key) };
  return null;
}
// Write one category's budget for `months`. One month: the amount repeats into later months. Several: only those months change.
function writePlan(s, type, cat, months, amt) {
  const v = amt && amt > 0 ? Math.round(amt * 100) / 100 : 0;
  const plain = [];
  months.forEach((k) => {
    const sc = scheduled(s, type, cat, k);
    if (!sc) { plain.push(k); return; }
    s.planOverride = { ...(s.planOverride || {}) }; s.planOverride[type] = { ...(s.planOverride[type] || {}) };
    const o = { ...(s.planOverride[type][cat] || {}) };
    if (v === sc.auto) delete o[k]; else o[k] = v;
    s.planOverride[type][cat] = o;
  });
  if (!plain.length) return;
  if (plain.length > 1) ownMonth(s, addMonths(plain[plain.length - 1], 1));
  plain.forEach((k) => {
    ownMonth(s, k);
    s.plan[type] = s.plan[type] || {}; s.plan[type][cat] = s.plan[type][cat] || {};
    if (v) s.plan[type][cat][k] = v; else delete s.plan[type][cat][k];
  });
}

/* Actual amounts per month (by the month they count toward), for suggestions. */
function actualsIndex(state) {
  const by = {}, any = new Set();
  (state.entries || []).forEach((e) => {
    if (!e.date || !e.category) return;
    const k = countsMonth(e, state); any.add(k);
    const t = (by[k] = by[k] || {}); const c = (t[e.type] = t[e.type] || {});
    c[e.category] = (c[e.category] || 0) + (+e.amount || 0);
  });
  const get = (type, cat, k) => (by[k] && by[k][type] && by[k][type][cat]) || 0;
  const done = {};
  const complete = (k) => (done[k] !== undefined ? done[k] : (done[k] = statementGaps(state, k).length === 0));
  // The last n months before `key` that have data, preferring months whose statements are fully imported.
  const recent = (key, n) => {
    const withData = []; for (let i = 1; i <= 12; i++) { const k = addMonths(key, -i); if (any.has(k)) withData.push(k); }
    const full = withData.filter(complete);
    return (full.length >= Math.min(n, withData.length) ? full : withData).slice(0, n);
  };
  // A month with no spending in this category counts as $0, so occasional costs aren't overstated.
  const avg = (type, cat, key, n) => { const ms = recent(key, n); return ms.length ? Math.round(ms.reduce((a, k) => a + get(type, cat, k), 0) / ms.length) : 0; };
  return { get, avg, recent, has: (k) => any.has(k) };
}

/* Bills vs everyday spending, guessed from the last 3 months with data; anyone can change it per category. */
const KIND_LABEL = { fixed: "Bill", flex: "Everyday", nonmonthly: "Non-monthly" };
function autoKinds(state, key, idx) {

const shortDay = (iso) => `${MLABEL[+iso.slice(5, 7) - 1]} ${+iso.slice(8)}`;

const schedText = (s) => s.mode === "spread"
  ? `${fmt(+s.amount)} due ${monthsText(s.months)} · ${fmt2(PlanKit.schedAmount(s, "2000-01"))}/mo set aside`
  : `${fmt(+s.amount)} in ${monthsText(s.months)}`;

/* ================= HEADER FILTER ================= */
function PeriodBar({ range, setRange, state }) {
  const presets = [["month", "This month", PRESETS.month], ["last", "Last month", PRESETS.last], ["year", "This year", PRESETS.year], ["all", "All time", () => allTimeRange(state)]];
  const same = (r) => r.from === range.from && r.to === range.to;
  const setFrom = (v) => { if (!v) return; setRange(v <= range.to ? { from: v, to: range.to } : { from: v, to: v }); };
  const setTo = (v) => { if (!v) return; setRange(v >= range.from ? { from: range.from, to: v } : { from: v, to: v }); };
  const [custom, setCustom] = useState(false);
  const isPreset = presets.some(([, , f]) => same(f()));
  return (
    <div className="ap-periodctl">
      <div className="ap-period">
        <button className="ap-arrow" onClick={() => setRange(shiftRange(range, -1))} aria-label="Previous period">‹</button>
        <button className="ap-periodlbl" onClick={() => setCustom(!custom)} aria-expanded={custom} title="Pick exact dates">{describeRange(range)}</button>
        <button className="ap-arrow" onClick={() => setRange(shiftRange(range, 1))} aria-label="Next period">›</button>
      </div>
      {custom && (
        <div className="ap-period ap-customdates">
          <input className="ap-date" type="date" value={range.from} onChange={(e) => setFrom(e.target.value)} aria-label="From date" />
          <span className="ap-dash">to</span>
          <input className="ap-date" type="date" value={range.to} onChange={(e) => setTo(e.target.value)} aria-label="To date" />
        </div>
      )}
      <div className="ap-presets">
        {presets.map(([k, l, f]) => { const r = f(); return <button key={k} className={same(r) ? "on" : ""} onClick={() => { setRange(r); setCustom(false); }}>{l}</button>; })}
        <button className={custom || !isPreset ? "on soft" : ""} onClick={() => setCustom(!custom)}>Custom</button>
      </div>
    </div>
  );
}

/* ================= DASHBOARD ================= */
function Dashboard({ state, period, addEntry, deleteEntry, goPlan, setMonthClosed }) {
  const dIdx = useMemo(() => actualsIndex(state), [state.entries, state.settings, state.importer]);
  const dAuto = useMemo(() => autoKinds(state, period.months[0], dIdx), [dIdx, state.categories, period.months[0]]);
  const [q, setQ] = useState("");
  const buckets = Object.keys(state.buckets || {});
  const planAmt = (type, cat) => planSum(state, type, cat, period.months);
  const monthEntries = state.entries.filter((e) => period.inRange(countsDate(e, state)));
  const spentBy = (type) => { const o = {}; monthEntries.filter((e) => e.type === type).forEach((e) => o[e.category] = (o[e.category] || 0) + e.amount); return o; };

  const expSpent = spentBy("Expenses");
  const [showUnbud, setShowUnbud] = useState(false);
  const envelopes = useMemo(() => {
    const cats = [...new Set([...state.categories.Expenses, ...Object.keys(expSpent)])];
    const one = period.months.length === 1 ? period.months[0] : null;
    const spentIn = (c, k) => state.entries.reduce((a, e) => a + (e.type === "Expenses" && e.category === c && e.date && countsMonth(e, state) === k ? e.amount : 0), 0);
    // A non-monthly cost set aside every month: what's available is everything set aside since it was last due, minus what was spent before this month.
    const fund = (c) => {
      const m = metaOf(state, "Expenses", c);
      if (!one || !m || m.kind !== "nonmonthly" || !m.sched || m.sched.mode !== "spread" || one < (m.sched.since || "")) return null;
      const lastDue = PlanKit.lastDueBefore(m.sched, one);
      let start = lastDue ? addMonths(lastDue, 1) : addMonths(one, -11);
      if (m.sched.since && start < m.sched.since) start = m.sched.since;
      const win = monthsBetween(start, one);
      const saved = win.reduce((a, k) => a + planFor(state, "Expenses", c, k), 0);
      const before = win.slice(0, -1).reduce((a, k) => a + spentIn(c, k), 0);
      return { budget: Math.round((saved - before) * 100) / 100, note: `Set aside since ${monthLabel(start)}: ${fmt(saved)}${before ? `, ${fmt(before)} already used` : ""} · ${fmt(+m.sched.amount)} due ${monthsText(m.sched.months)}` };
    };
    return cats.map((c) => { const f = fund(c); return { c, budget: f ? f.budget : planAmt("Expenses", c), spent: expSpent[c] || 0, note: f ? f.note : null }; })
      .filter((e) => e.budget > 0 || e.spent > 0)
      .map((e) => ({ ...e, remaining: e.budget - e.spent }))
      .sort((a, b) => b.budget - a.budget || b.spent - a.spent);
  }, [state, period]);

  const unbudgeted = state.categories.Expenses.filter((c) => !envelopes.some((e) => e.c === c));
  const incBudget = state.categories.Income.reduce((a, c) => a + planAmt("Income", c), 0);
  const expBudget = state.categories.Expenses.reduce((a, c) => a + planAmt("Expenses", c), 0);
  const savBudget = state.categories.Savings.reduce((a, c) => a + planAmt("Savings", c), 0);
  const spentTotal = monthEntries.filter((e) => e.type === "Expenses").reduce((a, e) => a + e.amount, 0);
  const usedPct = expBudget > 0 ? (spentTotal / expBudget) * 100 : (spentTotal > 0 ? 120 : 0);
  const remaining = expBudget - spentTotal;
  const n = period.months.length;
  const monthGaps = period.months.flatMap((k) => statementGaps(state, k));
  // spending pace: how much of the period has passed (only while today is inside it)
  const today = localToday();
  const elapsed = period.inRange(today) ? (daysBetween(period.from, today) + 1) / (daysBetween(period.from, period.to) + 1) : null;
  // "everyday" categories have frequent transactions; one-off bills like the mortgage would give false alarms
  const variableCats = useMemo(() => {
    const since = monthStart(addMonths(period.from.slice(0, 7), -3)), cnt = {};
    state.entries.forEach((e) => { if (e.type === "Expenses" && e.date >= since && e.date < period.from) cnt[e.category] = (cnt[e.category] || 0) + 1; });
    monthEntries.forEach((e) => { if (e.type === "Expenses") cnt[e.category] = (cnt[e.category] || 0) + 0.5; });
    return new Set(Object.keys(cnt).filter((c) => cnt[c] >= 6));
  }, [state, period]);
  const everyday = envelopes.filter((e) => variableCats.has(e.c) && e.budget > 0);
  const evBudget = everyday.reduce((a, e) => a + e.budget, 0), evSpent = everyday.reduce((a, e) => a + e.spent, 0);

  // ---- dots: red = over its budget, yellow = 85%+ used or running ahead of the calendar, green = fine,
  //      gray = money spent in a category that has no budget this month (a planning gap, not overspending)
  const light = (e) => {
    if (e.budget <= 0) return { s: e.spent > 0 ? "none" : "green" };
    if (Math.round(e.spent) > Math.round(e.budget)) return { s: "red" };
    const r = e.spent / e.budget;
    if (r >= 0.85) return { s: "yellow" };
    if (elapsed != null && variableCats.has(e.c) && r >= 0.25 && r > elapsed + 0.1) return { s: "yellow", pace: true };
    return { s: "green" };
  };
  const RANK = { red: 0, yellow: 1, green: 2, none: 3 };
  const match = (c) => !q || c.toLowerCase().includes(q.toLowerCase());
  const kindC = (c) => state.categories.Expenses.includes(c) ? kindOf(state, c, dAuto) : "flex";
  const itemsOf = (c) => monthEntries.filter((x) => x.type === "Expenses" && x.category === c);
  const everyRows = envelopes.filter((e) => kindC(e.c) === "flex" || e.budget <= 0).map((e) => ({ e, l: light(e) }))
    .sort((a, b) => RANK[a.l.s] - RANK[b.l.s] || (a.l.s === "none" ? b.e.spent - a.e.spent : (b.e.spent / (b.e.budget || 1)) - (a.e.spent / (a.e.budget || 1))));
  const counts = { red: 0, yellow: 0, green: 0, none: 0 }; everyRows.forEach((r) => counts[r.l.s]++);
  const pick = (s) => everyRows.filter((r) => r.l.s === s && match(r.e.c));
  const attention = [...pick("red"), ...pick("yellow")], fine = pick("green"), nobudget = pick("none");
  const noBudgetSpent = everyRows.filter((r) => r.l.s === "none").reduce((a, r) => a + r.e.spent, 0);
  const bills = envelopes.filter((e) => kindC(e.c) !== "flex" && e.budget > 0);
  const billsShown = bills.filter((e) => match(e.c));
  const paid = bills.filter((e) => e.spent >= e.budget * 0.95).length;
  const billsDue = bills.reduce((a, e) => a + Math.max(0, e.budget - e.spent), 0);
  const billsHigh = bills.filter((e) => Math.round(e.spent - e.budget) > Math.max(2, e.budget * 0.05)).length;
  const planned = everyRows.filter((r) => r.l.s !== "none");
  const evB = planned.reduce((a, r) => a + r.e.budget, 0), evS = planned.reduce((a, r) => a + Math.min(r.e.spent, r.e.budget), 0);
  const daysLeft = elapsed != null ? daysBetween(today, period.to) + 1 : null;
  const overall = remaining < 0 ? "red" : (usedPct >= 85 || counts.red > 0) ? "yellow" : "green";
  const savSpent = spentBy("Savings"), incSpent = spentBy("Income");
  const savDone = Object.values(savSpent).reduce((a, v) => a + v, 0), incDone = Object.values(incSpent).reduce((a, v) => a + v, 0);
  const [open, setOpen] = useState({});
  const tog = (k) => setOpen((o) => ({ ...o, [k]: !o[k] }));
  const [logOpen, setLogOpen] = useState(false);
  const dotRow = ({ e, l }) => <DotRow key={e.c} env={e} light={l} items={itemsOf(e.c)} defDate={period.defaultDate} addEntry={addEntry} onDelete={deleteEntry} />;
  // A plain function, not a component, so rows inside keep their state (open, typing) when the page updates.
  const group = ({ k, dot, label, value, rows, children }) => (
    <>
      <button className="ap-dgroup" onClick={() => tog(k)} aria-expanded={!!(open[k] || q)}>
        <i className={"ap-dot " + dot} aria-hidden="true" /><span className="nm">{label}</span><span className="amt">{value}</span>
        <span className="chev" aria-hidden="true">{open[k] || q ? "Hide" : "Show"}</span>
      </button>
      {(open[k] || q) && <div className="ap-dgrid">{rows.map(dotRow)}{children}</div>}
    </>
  );
  const month = n === 1 ? MLABEL[+period.months[0].slice(5) - 1] : period.label;

  return (
    <>
      <section className={"ap-hero s-" + overall}>
        <div className="ap-hero-lbl">{remaining < 0 ? "Over budget" : "Left to spend"}{n === 1 ? ` in ${month}` : ""}</div>
        <div className="ap-hero-row">
          <div className="ap-hero-val">{fmt(Math.abs(remaining))}</div>
          <div className="ap-hero-side">{fmt(spentTotal)} spent of {fmt(expBudget)}</div>
        </div>
        <div className="ap-track ap-paced"><div className="ap-fill" style={{ width: Math.min(usedPct, 100) + "%" }} />
          {elapsed != null && <i className="ap-today" style={{ left: Math.min(99.5, elapsed * 100) + "%" }} title="Today" />}</div>
        <div className="ap-hero-notes">
          {noBudgetSpent > 0 && <div>{fmt(noBudgetSpent)} of it went to {counts.none} {counts.none === 1 ? "category" : "categories"} with no budget this month.</div>}
          {daysLeft > 1 && evB - evS > 0 && <div>Everyday budgets have {fmt(evB - evS)} left, about {fmt((evB - evS) / daysLeft)} a day for {daysLeft} days.</div>}
        </div>
      </section>
      {(n > 1 || !isWholeMonths(period)) && (
        <p className="ap-rangenote">Showing <b>{period.label}</b>. Budgets count whole months ({n === 1 ? monthLabel(period.months[0]) : `${n} months, ${monthLabel(period.months[0])} to ${monthLabel(period.months[n - 1])}`}); spending counts only the dates in the range.</p>
      )}
      {monthGaps.length > 0 && (
        <div className="ap-partialnote">
          <b>{period.label} isn't complete yet.</b> Not imported: {monthGaps.slice(0, 3).map((g) => gapLabel(state, g)).join("; ")}{monthGaps.length > 3 ? `; and ${monthGaps.length - 3} more` : ""}.
          {n === 1 && setMonthClosed && <div className="ap-closebar">
            <span>Uploaded every statement you have for {MLABEL[+period.months[0].slice(5) - 1]}?</span>
            <button className="ap-imp-secondary" onClick={() => setMonthClosed(period.months[0], true)}>Mark {MLABEL[+period.months[0].slice(5) - 1]} as finished</button></div>}
        </div>
      )}
      {n === 1 && isClosed(state, period.months[0]) && setMonthClosed && (
        <div className="ap-closednote"><span>✓ {period.label} is marked as finished.</span>
          <button className="ap-linkbtn" onClick={() => setMonthClosed(period.months[0], false)}>Reopen</button></div>
      )}

      <div className="ap-dashbar">
        <button className="ap-logbtn" onClick={() => setLogOpen(true)}>+ Log</button>
        <div className="ap-envsearch">
          <input type="text" placeholder="Find a category…" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Find a category" />
          {q && <button onClick={() => setQ("")} aria-label="Clear">×</button>}
        </div>
      </div>

      <div className="ap-dcard">
        {attention.length > 0 && <div className="ap-dgrid">{attention.map(dotRow)}</div>}
        {!q && attention.length === 0 && planned.length > 0 && <div className="ap-dall"><i className="ap-dot green" aria-hidden="true" />Every budgeted category is on track.</div>}
        {fine.length > 0 && group({ k: "fine", dot: "green", label: "On track", value: `${fine.length}`, rows: fine })}
        {nobudget.length > 0 && group({ k: "none", dot: "none", label: "Spent without a budget", value: `${nobudget.length} · ${fmt(nobudget.reduce((a, r) => a + r.e.spent, 0))}`, rows: nobudget,
          children: goPlan && <div className="ap-dhint">Give them a budget in Planning, or move the transactions to a category you already budget.
            <button className="ap-linkbtn" onClick={goPlan}>Open Planning</button></div> })}
        {billsShown.length > 0 && group({ k: "bills", dot: billsHigh ? "red" : paid === bills.length ? "green" : "bill", label: "Bills",
          value: `${paid} of ${bills.length} paid${billsDue > 0 ? ` · ${fmt(billsDue)} due` : ""}`,
          rows: billsShown.map((e) => ({ e, l: { s: e.spent >= e.budget * 0.95 ? (Math.round(e.spent - e.budget) > Math.max(2, e.budget * 0.05) ? "red" : "green") : "bill", bill: true } })) })}
        {envelopes.length === 0 && <p className="ap-empty">No expense budget or spending for {period.label}. Set one in Planning.</p>}
        {q && unbudgeted.some(match) && <div className="ap-dhint">No budget or spending this month: {unbudgeted.filter(match).join(" · ")}</div>}
        {q && !attention.length && !fine.length && !nobudget.length && !billsShown.length && !unbudgeted.some(match) && <p className="ap-empty">No category matches "{q}".</p>}
      </div>

      {!q && <div className="ap-dcard">
        <button className="ap-dgroup" onClick={() => tog("sav")} aria-expanded={!!open.sav}>
          <i className="ap-dot teal" aria-hidden="true" /><span className="nm">Savings</span><span className="amt">{fmt(savDone)} of {fmt(savBudget)}</span><span className="chev" aria-hidden="true">{open.sav ? "Hide" : "Show"}</span></button>
        {open.sav && <MiniPanel title="" rows={state.categories.Savings} planAmt={(c) => planAmt("Savings", c)} spent={savSpent} accent="teal" verb="saved" />}
        <button className="ap-dgroup" onClick={() => tog("inc")} aria-expanded={!!open.inc}>
          <i className="ap-dot inc" aria-hidden="true" /><span className="nm">Income</span><span className="amt">{fmt(incDone)} of {fmt(incBudget)}</span><span className="chev" aria-hidden="true">{open.inc ? "Hide" : "Show"}</span></button>
        {open.inc && <MiniPanel title="" rows={state.categories.Income} planAmt={(c) => planAmt("Income", c)} spent={incSpent} accent="emerald" verb="received" />}
        {unbudgeted.length > 0 && <>
          <button className="ap-dgroup" onClick={() => tog("idle")} aria-expanded={!!open.idle}>
            <i className="ap-dot idle" aria-hidden="true" /><span className="nm">Not used this month</span><span className="amt">{unbudgeted.length}</span><span className="chev" aria-hidden="true">{open.idle ? "Hide" : "Show"}</span></button>
          {open.idle && <div className="ap-dhint">{unbudgeted.join(" · ")}</div>}
        </>}
      </div>}

      {logOpen && (
        <Sheet title="Log a transaction" label="Log a transaction" onClose={() => setLogOpen(false)}>
          <AddBar state={state} defDate={period.defaultDate} addEntry={addEntry} onDone={() => setLogOpen(false)} />
        </Sheet>
      )}
    </>
  );
}

// One category: a dot, the name and what's left. Tap it for the details, its transactions and a quick log.
function DotRow({ env, light, items, defDate, addEntry, onDelete }) {
  const [open, setOpen] = useState(false);
  const [amt, setAmt] = useState("");
  const [note, setNote] = useState("");
  const submit = () => {
    const a = parseMoney(amt); if (!a) return;
    addEntry({ id: uid(), date: defDate, type: "Expenses", category: env.c, amount: a, note: note.trim() });
    setAmt(""); setNote("");
  };
  const diff = env.budget - env.spent, s = light.s;
  const right = s === "none" ? fmt(env.spent)
    : s === "bill" ? (env.spent > 0 ? `${fmt(env.spent)} of ${fmt(env.budget)}` : `${fmt(env.budget)} due`)
    : Math.round(diff) < 0 ? `${fmt(-diff)} over` : light.bill && s === "green" ? "Paid" : `${fmt(diff)} left`;
  const pct = env.budget > 0 ? Math.min(100, (env.spent / env.budget) * 100) : 100;
  return (
    <div className={"ap-drow s-" + s + (open ? " open" : "")}>
      <button className="ap-drow-main" onClick={() => setOpen(!open)} aria-expanded={open}>
        <i className={"ap-dot " + s} aria-hidden="true" />
        <span className="nm">{env.c}</span>
        <span className="amt">{right}</span>
      </button>
      {open && (
        <div className="ap-drow-more">
          <div className="ap-drow-fact">
            {env.budget > 0 ? <>{fmt2(env.spent)} of {fmt(env.budget)} · {Math.round(pct)}%{light.pace ? " · spending ahead of the calendar" : ""}</> : <>{fmt2(env.spent)} spent · no budget this month</>}
          </div>
          {env.budget > 0 && <div className="ap-lbar"><i style={{ width: pct + "%" }} /></div>}
          {env.note && <div className="ap-envnote">{env.note}</div>}
          <div className="ap-envform">
            <span className="cur">$</span>
            <input className="amt" type="text" inputMode="decimal" enterKeyHint="done" onFocus={selectAll} placeholder="0.00" value={amt}
              onChange={(e) => setAmt(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} aria-label={`Amount for ${env.c}`} />
            <input className="note" type="text" placeholder="note (optional)" value={note} onChange={(e) => setNote(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} />
            <button className="ap-envgo" onClick={submit}>Log</button>
          </div>
          {items.length > 0 && (
            <ul className="ap-env-items">
              {items.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 30).map((x) => (
                <li key={x.id}><span className="d">{niceDate(x.date).replace(/^\w+, /, "")}</span><span className="n">{x.note || x.name || ""}</span>
                  <span className="a mono">{fmt2(x.amount)}</span><button className="x" onClick={() => onDelete(x.id)} title="Delete (you can Undo)" aria-label="Delete">×</button></li>
              ))}
              {items.length > 30 && <li className="more">and {items.length - 30} more in Tracking</li>}
            </ul>
          )}
        </div>
      )}
    </div>
  );
}


function Stat({ label, val, color, hero }) {
  return (
    <div className={"ap-stat"+(hero?" hero":"")}>
      <span className="lbl">{label}</span>
      <span className="val" style={color&&!hero?{color}:undefined}>{fmt(val)}</span>
    </div>
  );
}

function Envelope({ env, items, defDate, addEntry, onDelete, buckets, elapsed, everyday, periodLabel, compact }) {
  const [open, setOpen] = useState(false);
  const [adding, setAdding] = useState(false);
  const [amt, setAmt] = useState("");
  const [note, setNote] = useState("");
  const [bucket, setBucket] = useState("");
  const pct = env.budget>0 ? (env.spent/env.budget)*100 : (env.spent>0?120:0);
  const over = env.budget>0 && Math.round(env.spent) > Math.round(env.budget);
  const color = over ? "var(--clay)" : pct>85 ? "var(--navy)" : "var(--emerald)";
  const submit = () => {
    const a = parseFloat(amt); if (!a || a<=0) return;
    addEntry({ id: uid(), date: defDate, type:"Expenses", category: env.c, amount: Math.round(a*100)/100, note: note.trim(), bucket: bucket||undefined });
    setAmt(""); setNote(""); setBucket(""); setAdding(false);
  };
  const paid = env.budget > 0 && env.spent >= env.budget * 0.95;
  if (compact) return (
    <div className={"ap-env ap-bill" + (over && Math.round(env.spent - env.budget) > Math.max(2, env.budget * 0.05) ? " over" : "")}>
      <div className="ap-bill-row">
        <span className="ap-env-name" onClick={()=>items.length&&setOpen(!open)} style={{cursor:items.length?"pointer":"default"}}>{env.c}{items.length>0 && <em className="ap-cnt">{items.length}</em>}</span>
        <span className={"ap-bill-st" + (paid ? " paid" : "")}>
          {paid ? (Math.round(env.spent - env.budget) > Math.max(2, env.budget * 0.05) ? `Paid · ${fmt(env.spent - env.budget)} over` : "✓ Paid")
            : env.spent > 0 ? `${fmt(env.spent)} of ${fmt(env.budget)}` : env.budget > 0 ? `${fmt(env.budget)} due` : `${fmt(env.spent)} · no budget`}</span>
        <button className="ap-envadd" onClick={()=>setAdding(!adding)} aria-label={`Add to ${env.c}`}>{adding?"Cancel":"+ Add"}</button>
      </div>
      {env.note && <div className="ap-envnote">{env.note}</div>}
      {adding && (
        <div className="ap-envform">
          <span className="cur">$</span>
          <input className="amt" type="text" inputMode="decimal" enterKeyHint="done" autoFocus onFocus={selectAll} placeholder="0.00" value={amt}
            onChange={(e)=>setAmt(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&submit()}/>
          <input className="note" type="text" placeholder="note (optional)" value={note} onChange={(e)=>setNote(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&submit()}/>
          <button className="ap-envgo" onClick={submit}>Log</button>
        </div>
      )}
      {open && (
        <ul className="ap-env-items">
          {items.map((x)=>(
            <li key={x.id}><span className="d">{x.date.slice(8)}</span><span className="n">{x.note||x.name||"—"}</span>
              <span className="a mono">{fmt2(x.amount)}</span><button className="x" onClick={()=>onDelete(x.id)} title="Delete" aria-label="Delete">×</button></li>
          ))}
        </ul>
      )}
    </div>
  );
  return (
    <div className={"ap-env"+(over?" over":"")}>
      <div className="ap-env-top">
        <span className="ap-env-name" onClick={()=>items.length&&setOpen(!open)} style={{cursor:items.length?"pointer":"default"}}>
          {env.c}{items.length>0 && <em className="ap-cnt">{items.length}</em>}</span>
        <span className="ap-env-rem" style={{color: over?"var(--clay)":"var(--ink-soft)"}}>
          {env.budget>0 ? (over?fmt(Math.abs(env.remaining))+" over":fmt(env.remaining)+" left") : "unbudgeted"}
        </span>
      </div>
      <div className="ap-track ap-paced"><div className="ap-fill" style={{width:Math.min(pct,100)+"%",background:color}}/>
        {elapsed!==null && elapsed!==undefined && env.budget>0 && <i className="ap-today" style={{left:(elapsed*100)+"%"}} title="Today"/>}</div>
      {everyday && elapsed && env.budget>0 && !over && env.spent/env.budget > elapsed+0.1 && env.spent/elapsed > env.budget && (
        <div className="ap-pace">At this pace about {fmt(env.spent/elapsed)} by the end of {periodLabel}, {fmt(env.spent/elapsed-env.budget)} over.</div>
      )}
      {env.note && <div className="ap-envnote">{env.note}</div>}
      <div className="ap-env-foot">
        <span className="mono">{fmt(env.spent)} <span className="dim">{env.budget>0?"of "+fmt(env.budget):"no budget"}</span></span>
        <button className="ap-envadd" onClick={()=>setAdding(!adding)}>{adding?"Cancel":"+ Add"}</button>
      </div>
      {adding && (
        <div className="ap-envform">
          <span className="cur">$</span>
          <input className="amt" type="text" inputMode="decimal" enterKeyHint="done" autoFocus onFocus={selectAll} placeholder="0.00" value={amt}
            onChange={(e)=>setAmt(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&submit()}/>
          <input className="note" type="text" placeholder="note (optional)" value={note}
            onChange={(e)=>setNote(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&submit()}/>
          {buckets && buckets.length>0 && (
            <select className="bkt" value={bucket} onChange={(e)=>setBucket(e.target.value)}>
              <option value="">No bucket</option>
              {buckets.map((b)=>(<option key={b} value={b}>{b}</option>))}
            </select>
          )}
          <button className="ap-envgo" onClick={submit}>Log</button>
        </div>
      )}
      {open && (
        <ul className="ap-env-items">
          {items.map((x)=>(
            <li key={x.id}><span className="d">{x.date.slice(8)}</span>
              <span className="n">{x.note||x.name||"—"}{x.bucket && <em className="ap-cnt" style={{marginLeft:6}}>{x.bucket}</em>}</span>
              <span className="a mono">{fmt2(x.amount)}</span>
              <button className="x" onClick={()=>onDelete(x.id)} title="Delete">×</button></li>
          ))}
        </ul>
      )}
    </div>
  );
}

function MiniPanel({ title, rows, planAmt, spent, accent, verb }) {
  const list = [...new Set([...rows, ...Object.keys(spent)])].filter((c)=> planAmt(c)>0 || (spent[c]||0)>0);
  if (list.length===0) return null;
  return (
    <section className="ap-mini">
      {title && <h3 className="ap-mini-t">{title}</h3>}
      <div className="ap-mini-rows">
        {list.map((c)=>{
          const target = planAmt(c), got = spent[c]||0;
          const pct = target>0 ? Math.min((got/target)*100,100) : (got>0?100:0);
          return (<div key={c} className="ap-mini-row">
            <span className="nm">{c}</span>
            <div className="ap-track ap-track-sm"><div className="ap-fill" style={{width:pct+"%",background:`var(--${accent})`}}/></div>
            <span className="mono vl">{fmt(got)} <span className="dim">{target>0?"/ "+fmt(target):verb}</span></span>
          </div>);
        })}
      </div>
    </section>
  );
}

const topUsed = (state, type, n = 6) => {
  const cnt = {};
  state.entries.forEach((e) => { if (e.type === type && e.category) cnt[e.category] = (cnt[e.category] || 0) + 1; });
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, n).map(([c]) => c);
};
function Combo({ value, onChange, options, placeholder, top }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const lead = !q && top ? top.filter((o) => options.includes(o)) : [];
  const filtered = options.filter((o) => o.toLowerCase().includes(q.toLowerCase()) && !lead.includes(o));
  return (
    <div className="ap-combo">
      <input type="text" value={open ? q : value} placeholder={placeholder}
        onFocus={()=>{ setOpen(true); setQ(""); }}
        onChange={(e)=>{ setQ(e.target.value); setOpen(true); }}
        onBlur={()=>setTimeout(()=>setOpen(false), 150)}
        onKeyDown={(e)=>{ if(e.key==="Enter" && filtered[0]){ onChange(filtered[0]); setOpen(false); e.target.blur(); } if(e.key==="Escape"){ setOpen(false); e.target.blur(); } }}/>
      {open && (
        <ul className="ap-combo-list">
          {lead.length>0 && <li className="hd">Most used</li>}
          {lead.map((o)=>(<li key={"top-"+o} onMouseDown={(e)=>{ e.preventDefault(); onChange(o); setOpen(false); }}>{o}</li>))}
          {lead.length>0 && filtered.length>0 && <li className="hd">All categories</li>}
          {filtered.map((o)=>(<li key={o} onMouseDown={(e)=>{ e.preventDefault(); onChange(o); setOpen(false); }}>{o}</li>))}
          {filtered.length===0 && lead.length===0 && <li className="none">No match</li>}
        </ul>
      )}
    </div>
  );
}

function AddBar({ state, defDate, addEntry, onDone }) {
  const [type, setType] = useState("Expenses");
  // Start on the category logged most often, not whatever happens to be first in the list.
  const [category, setCategory] = useState((topUsed(state, "Expenses") || [])[0] || state.categories.Expenses[0] || "");
  const dflt = () => defDate;
  const [date, setDate] = useState(dflt());
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const [bucket, setBucket] = useState("");
  useEffect(()=>{ setDate(dflt()); }, [defDate]);
  const cats = state.categories[type] || [];
  const buckets = Object.keys(state.buckets || {});
  useEffect(()=>{ if (!cats.includes(category)) setCategory((topUsed(state, type) || [])[0] || cats[0] || ""); }, [type]);

  const add = () => {
    const amt = parseFloat(amount); if (!amt || amt<=0 || !category) return;
    addEntry({ id: uid(), date, type, category, amount: Math.round(amt*100)/100, note: note.trim(), bucket: (type==="Expenses"&&bucket&&bucket!=="No bucket")?bucket:undefined });
    setAmount(""); setNote(""); setBucket("");
    if (onDone) onDone();
  };
  return (
    <div className="ap-addbar">
      <span className="ap-add-lbl">Log</span>
      <select value={type} onChange={(e)=>setType(e.target.value)}>
        {TYPES.map((t)=>(<option key={t}>{t}</option>))}
      </select>
      <div className="wide"><Combo value={category} onChange={setCategory} options={cats} top={topUsed(state, type)} placeholder="Search category…"/></div>
      {type==="Expenses" && buckets.length>0 && (
        <div className="bktwrap"><Combo value={bucket} onChange={(v)=>setBucket(v==="No bucket"?"":v)} options={["No bucket", ...buckets]} placeholder="Bucket…"/></div>
      )}
      <input type="date" value={date} onChange={(e)=>setDate(e.target.value)}/>
      <input className="amt" type="text" inputMode="decimal" enterKeyHint="done" onFocus={selectAll} placeholder="0.00" value={amount}
        onChange={(e)=>setAmount(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&add()}/>
      <input className="note" type="text" placeholder="note (optional)" value={note}
        onChange={(e)=>setNote(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&add()}/>
      <button className="ap-addbtn" onClick={add}>Add</button>
    </div>
  );
}

/* ================= PLANNING ================= */
/* ================= PLANNING ================= */
function Planning({ state, period, setSetting, setPlanAmt, clearOverride, setCatMeta, applyPlan, addCat, removeCat, renameCat, resetPlan, addBucket, renameBucket, deleteBucket }) {
  const months = period.months;
  const single = months.length === 1;
  const first = months[0], last = months[months.length - 1];
  const idx = useMemo(() => actualsIndex(state), [state.entries, state.settings, state.importer]);
  const auto = useMemo(() => autoKinds(state, first, idx), [idx, state.categories, first]);
  const perMonth = (type, c) => { const vals = months.map((k) => planFor(state, type, c, k)); return vals.every((v) => v === vals[0]) ? vals[0] : null; };
  const total = (type, cats) => (cats || state.categories[type]).reduce((a, c) => a + planSum(state, type, c, months), 0);
  const toAllocate = Math.round((total("Income") - total("Expenses") - total("Savings")) * 100) / 100;
  const prevKey = addMonths(first, -1);
  const src = single ? budgetSource(state, first) : null;
  const inherited = !!(single && src && src !== first);
  const [sheet, setSheet] = useState(null);           // { mode: "start" } | { mode: "cat", type, cat }
  const [msg, setMsg] = useState(null);
  const [showBuckets, setShowBuckets] = useState(false);
  useEffect(() => setMsg(null), [first, last]);

  // ---- leftover: one tap puts it into (or takes it from) a category
  const everydayBiggest = () => state.categories.Expenses.filter((c) => kindOf(state, c, auto) === "flex").sort((a, b) => planFor(state, "Expenses", b, first) - planFor(state, "Expenses", a, first))[0];
  const defaultTarget = toAllocate > 0 ? (state.categories.Savings[0] ? ["Savings", state.categories.Savings[0]] : null) : (everydayBiggest() ? ["Expenses", everydayBiggest()] : null);
  const [balTo, setBalTo] = useState("");
  const target = balTo ? JSON.parse(balTo) : defaultTarget;
  const balance = () => {
    if (!target) return;
    const [t, c] = target, cur = planFor(state, t, c, first);
    const next = Math.max(0, Math.round((cur + toAllocate) * 100) / 100);
    setPlanAmt(t, c, months, next);
    const moved = Math.abs(next - cur), left = Math.round((Math.abs(toAllocate) - moved) * 100) / 100;
    setMsg({ ok: left === 0, text: toAllocate > 0 ? `Added ${fmt2(moved)} to ${c}. Everything is assigned.`
      : left > 0 ? `Took ${fmt2(moved)} from ${c} (all it had). Still over by ${fmt2(left)}. Pick another category.` : `Took ${fmt2(moved)} from ${c}. The plan balances now.` });
    setBalTo("");
  };

  const rowProps = (type, c) => {
    const m = metaOf(state, type, c);
    const sc = single ? scheduled(state, type, c, first) : null;
    let tag = null, sub = null;
    if (type === "Income") {
      tag = m && m.pay && m.pay.freq ? PAY_LABEL[m.pay.freq] : "Set paydays";
      if (m && m.pay && m.pay.freq) sub = sc ? `${sc.days.length} payday${sc.days.length === 1 ? "" : "s"} × ${fmt2(+m.pay.amount || 0)}${sc.days.length ? ` · ${sc.days.map(shortDay).join(", ")}` : ""}` : `Paydays start ${monthLabel(m.pay.since)}`;
    } else if (type === "Expenses") {
      const kd = kindOf(state, c, auto);
      tag = KIND_LABEL[kd] + (m && m.kind ? "" : " (auto)");
      if (kd === "nonmonthly") sub = m && m.sched ? schedText(m.sched) : "Tap “Non-monthly” to set when it's due";
    }
    const over = !!(sc && overrideOf(state, type, c, first) != null);
    return {
      name: c, amount: perMonth(type, c), actual: idx.get(type, c, prevKey), avg: idx.avg(type, c, first, 3) || null,
      inherited: inherited && !sc, tag, sub, over,
      resetLabel: type === "Income" ? `use paydays (${fmt(sc ? sc.auto : 0)})` : `use schedule (${fmt(sc ? sc.auto : 0)})`,
      onTag: type === "Savings" ? null : () => setSheet({ mode: "cat", type, cat: c }),
      onReset: () => clearOverride(type, c, months),
      onAmount: (v) => setPlanAmt(type, c, months, v), onRename: (n) => renameCat(type, c, n), onRemove: () => removeCat(type, c),
    };
  };
  const inGroup = (k) => state.categories.Expenses.filter((c) => kindOf(state, c, auto) === k);
  // "Needs a budget": spent last month or this month with nothing planned. Taken once per month shown, so a row
  // doesn't jump away while you type its amount.
  const needsRef = useRef({ key: null, list: [] });
  if (needsRef.current.key !== first) {
    needsRef.current = { key: first, list: state.categories.Expenses.map((c) => ({ c, spent: Math.max(idx.get("Expenses", c, prevKey), idx.get("Expenses", c, first)) }))
      .filter((r) => r.spent > 0 && !(planFor(state, "Expenses", r.c, first) > 0)).sort((a, b) => b.spent - a.spent) };
  }
  const needs = needsRef.current.list;
  const [open, setOpen] = useState({});
  const tog = (k) => setOpen((o) => ({ ...o, [k]: !o[k] }));
  const [newCat, setNewCat] = useState("");
  const [newType, setNewType] = useState("Expenses");
  const addNew = () => { const n = newCat.trim(); if (!n) return; addCat(newType, n); setNewCat("");
    if (newType === "Expenses") setOpen((o) => ({ ...o, flex: true })); else setOpen((o) => ({ ...o, [newType]: true })); };
  const GROUPS = [
    ["Income", "Income", "inc", state.categories.Income, "Income"],
    ["fixed", "Bills", "bill", inGroup("fixed"), "Expenses"],
    ["flex", "Everyday", "flex", inGroup("flex"), "Expenses"],
    ["nonmonthly", "Non-monthly", "nm", inGroup("nonmonthly"), "Expenses"],
    ["Savings", "Savings", "sav", state.categories.Savings, "Savings"],
  ];
  const mlabel = MLABEL[+first.slice(5) - 1];

  return (
    <section className="ap-plan">
      <section className="ap-hero ap-planhero">
        <div className="ap-planhero-top">
          <div>
            <div className="ap-hero-lbl">{single ? `To allocate in ${mlabel}` : `To allocate, ${months.length} months`}</div>
            <div className={"ap-hero-val" + (Math.round(toAllocate) === 0 ? " ok" : toAllocate < 0 ? " neg" : "")}>{fmt(toAllocate)}</div>
          </div>
          <button className="ap-logbtn" onClick={() => setSheet({ mode: "start" })}>Plan {single ? mlabel : "these months"} from…</button>
        </div>
        <div className="ap-plantot"><span>Income <b>{fmt(total("Income"))}</b></span><span>Spend <b>{fmt(total("Expenses"))}</b></span><span>Save <b>{fmt(total("Savings"))}</b></span></div>
        {single && Math.round(toAllocate) !== 0 && target && (
          <div className={"ap-balance" + (toAllocate < 0 ? " neg" : "")}>
            <span>{toAllocate > 0 ? <>Put the {fmt2(toAllocate)} in</> : <>Take the {fmt2(-toAllocate)} from</>}</span>
            <select value={JSON.stringify(target)} onChange={(e) => setBalTo(e.target.value)} aria-label="Category">
              <optgroup label="Savings">{state.categories.Savings.map((c) => <option key={c} value={JSON.stringify(["Savings", c])}>{c}</option>)}</optgroup>
              <optgroup label="Expenses">{state.categories.Expenses.map((c) => <option key={c} value={JSON.stringify(["Expenses", c])}>{c}{toAllocate < 0 ? ` (${fmt(planFor(state, "Expenses", c, first))})` : ""}</option>)}</optgroup>
            </select>
            <button onClick={balance}>{toAllocate > 0 ? "Add it" : "Take it"}</button>
          </div>
        )}
        {inherited && <div className="ap-hero-notes">{mlabel} is repeating {monthLabel(src)}'s budget. Change any amount and it gets its own.</div>}
        {!single && <div className="ap-hero-notes">An amount you type applies to each of these {months.length} months only.</div>}
      </section>
      {msg && <div className={"ap-planmsg" + (msg.ok ? "" : " err")}>{msg.text}</div>}

      <div className="ap-dcard">
        {needs.length > 0 && <>
          <FoldRow dot="none" label="Needs a budget" value={`${needs.length} · spent ${fmt(needs.reduce((a, r) => a + r.spent, 0))}`} open={!!open.needs} onToggle={() => tog("needs")} />
          {open.needs && <div className="ap-planrows">
            <p className="ap-dhint">Spent in {MLABEL[+prevKey.slice(5) - 1]} or {mlabel} with nothing planned. Give each one a budget, or tap “use” to budget what was spent.</p>
            {needs.map((r) => <PlanRow key={"n-" + r.c} {...rowProps("Expenses", r.c)} suggest={{ label: `use ${fmt(r.spent)}`, v: Math.round(r.spent) }} />)}
          </div>}
        </>}
        {GROUPS.map(([k, label, dot, cats, type]) => (
          <React.Fragment key={k}>
            <FoldRow dot={dot} label={label} value={`${cats.length} · ${fmt(total(type, cats))}`} open={!!open[k]} onToggle={() => tog(k)} />
            {open[k] && <div className="ap-planrows">
              {cats.map((c) => <PlanRow key={c} {...rowProps(type, c)} />)}
              {cats.length === 0 && <p className="ap-dhint">{k === "nonmonthly" ? "Costs due a few times a year, like insurance. Open a category and set it to Non-monthly." : "None yet."}</p>}
              {k === "Income" && <label className="ap-paysetting ap-dhint">
                Paychecks in the last
                <select value={incomeShiftDays(state)} onChange={(e) => setSetting("incomeShiftDays", +e.target.value)} aria-label="Days before month-end">
                  {[0, 1, 2, 3, 4, 5].map((n) => <option key={n} value={n}>{n === 0 ? "0 days (off)" : n === 1 ? "1 day" : n + " days"}</option>)}
                </select>
                of a month count toward the next month.
              </label>}
            </div>}
          </React.Fragment>
        ))}
        <div className="ap-addcat ap-addrow">
          <select value={newType} onChange={(e) => setNewType(e.target.value)} aria-label="New category type">
            <option value="Expenses">Expense</option><option value="Income">Income</option><option value="Savings">Savings</option></select>
          <input type="text" placeholder={"+ add " + (newType === "Expenses" ? "expense" : newType === "Income" ? "income" : "savings") + " category"} value={newCat}
            onChange={(e) => setNewCat(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addNew(); }} />
          <button onClick={addNew}>Add</button>
        </div>
      </div>

      <div className="ap-dcard">
        <FoldRow dot="idle" label="Buckets" value={`${Object.keys(state.buckets || {}).length}`} open={showBuckets} onToggle={() => setShowBuckets(!showBuckets)} />
        {showBuckets && <div style={{ padding: "0 12px 4px" }}><BucketManager state={state} addBucket={addBucket} renameBucket={renameBucket} deleteBucket={deleteBucket} /></div>}
      </div>
      <div className="ap-plan-danger">
        <button className="ap-imp-secondary" onClick={resetPlan}>Reset to original plan…</button>
        <span>Transactions are kept, and you can Undo.</span>
      </div>

      {sheet && sheet.mode === "start" && <StartFromSheet state={state} period={period} idx={idx} auto={auto} applyPlan={applyPlan}
        onClose={() => setSheet(null)} onDone={(text) => { setSheet(null); setMsg({ ok: true, text }); }} />}
      {sheet && sheet.mode === "cat" && <CatSheet state={state} type={sheet.type} cat={sheet.cat} first={first} auto={auto} setCatMeta={setCatMeta}
        onClose={() => setSheet(null)} onDone={(text) => { setSheet(null); setMsg({ ok: true, text }); }} />}
    </section>
  );
}

function BucketManager({ state, addBucket, renameBucket, deleteBucket }) {
  const [newB, setNewB] = useState("");
  const buckets = Object.keys(state.buckets || {});
  const count = (b) => (state.entries||[]).filter((e)=>e.bucket===b).length;
  const add = () => { const v=newB.trim(); if(v && !state.buckets?.[v]){ addBucket(v); setNewB(""); } };
  return (
    <div className="ap-plansec">
      <div className="ap-plansec-head">
        <h3 style={{color:"var(--navy)"}}>Buckets</h3>
        <span className="mono total">{buckets.length}</span>
      </div>
      <p className="ap-plan-hint" style={{margin:"2px 0 10px"}}>Optional groups for transactions (e.g. "Subscriptions" for Netflix, Disney+…). Assign them in Tracking.</p>
      <div className="ap-planrows">
        {buckets.map((b)=>(
          <div key={b} className="ap-planrow">
            <BucketName name={b} onRename={(n)=>renameBucket(b,n)}/>
            <span className="mono dim" style={{fontSize:12}}>{count(b)} items</span>
            <button className="ap-del" onClick={()=>{ if(confirm(`Delete bucket "${b}"? Transactions stay, they just lose this tag.`)) deleteBucket(b); }} title="Remove bucket">×</button>
          </div>
        ))}
        {buckets.length===0 && <p className="ap-empty">No buckets yet.</p>}
      </div>
      <div className="ap-addcat">
        <input type="text" placeholder="+ add bucket" value={newB}
          onChange={(e)=>setNewB(e.target.value)} onKeyDown={(e)=>{ if(e.key==="Enter") add(); }}/>
        <button onClick={add}>Add</button>
      </div>
    </div>
  );
}

function BucketName({ name, onRename }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(name);
  useEffect(()=>setDraft(name),[name]);
  return editing ? (
    <input className="ap-renamein" value={draft} autoFocus
      onChange={(e)=>setDraft(e.target.value)}
      onBlur={()=>{ onRename(draft); setEditing(false); }}
      onKeyDown={(e)=>{ if(e.key==="Enter"){ onRename(draft); setEditing(false);} if(e.key==="Escape"){ setDraft(name); setEditing(false);} }}/>
  ) : (
    <span className="ap-planrow-name" onClick={()=>setEditing(true)} title="Click to rename">{name}</span>
  );
}

// A folded group's header line: dot, name, count and total, Show/Hide.
function FoldRow({ dot, label, value, open, onToggle }) {
  return (
    <button className="ap-dgroup" onClick={onToggle} aria-expanded={!!open}>
      <i className={"ap-dot " + dot} aria-hidden="true" /><span className="nm">{label}</span><span className="amt">{value}</span>
      <span className="chev" aria-hidden="true">{open ? "Hide" : "Show"}</span>
    </button>
  );
}

// One category in Planning: name and its budget box. Tap the name for last month, the average, its kind, rename and remove.
function PlanRow({ name, amount, actual, avg, inherited, tag, sub, over, resetLabel, onTag, onReset, onAmount, onRename, onRemove, suggest }) {
  const [open, setOpen] = useState(false);
  const [draft, setDraft] = useState(name);
  const [amtFocus, setAmtFocus] = useState(false);
  useEffect(() => setDraft(name), [name]);
  const varies = amount === null;
  const rename = () => { if (draft.trim() && draft.trim() !== name) onRename(draft.trim()); };
  return (
    <div className={"ap-planrow" + (amount === 0 && !amtFocus ? " zero" : "") + (open ? " open" : "")}>
      <div className="ap-planrow-line">
        <button className="ap-planrow-main" onClick={() => setOpen(!open)} aria-expanded={open}>
          <span className="ap-planrow-name">{name}</span>
          {(sub || over || suggest) && <span className="ap-planrow-sub">{over ? "changed for this month" : sub || (suggest ? "no budget yet" : "")}</span>}
        </button>
        {suggest && !(amount > 0) && <button className="ap-avg ap-use" onClick={() => onAmount(suggest.v)}>{suggest.label}</button>}
        <div className={"ap-amtwrap" + (inherited && !amtFocus ? " inherited" : "")}>
          <span className="cur">$</span>
          <span onFocus={() => setAmtFocus(true)} onBlur={() => setAmtFocus(false)} style={{ display: "contents" }}>
            <MoneyInput value={varies ? null : amount} onValue={onAmount} placeholder={varies ? "varies" : "0"} ariaLabel={`Budget for ${name}`} /></span>
        </div>
      </div>
      {open && (
        <div className="ap-planrow-more">
          <div className="ap-planrow-facts">
            <span>Last month <b>{actual ? fmt(actual) : "—"}</b></span>
            {avg != null && <span>3-month average <b>{fmt(avg)}</b> {avg !== amount && <button className="ap-linkbtn" onClick={() => onAmount(avg)}>use it</button>}</span>}
          </div>
          {sub && <div className="ap-planrow-facts"><span>{sub}</span></div>}
          {over && <div className="ap-planrow-facts"><span>Changed for this month.</span><button className="ap-linkbtn" onClick={onReset}>↺ {resetLabel}</button></div>}
          <div className="ap-planrow-tools">
            {tag && onTag && <button className="ap-kind" onClick={onTag}>{tag}</button>}
