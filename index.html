}

function PlanRow({ name, amount, actual, avg, actualLabel, inherited, onAmount, onRename, onRemove }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(name);
  const [amtFocus, setAmtFocus] = useState(false);
  useEffect(() => setDraft(name), [name]);
  const varies = amount === null;
  const shownAmt = varies ? "" : amtFocus ? (amount || "") : (amount ? amount.toLocaleString("en-US") : "");
  return (
    <div className="ap-planrow">
      {editing ? (
        <input className="ap-renamein" value={draft} autoFocus
          onChange={(e) => setDraft(e.target.value)}
          onBlur={() => { onRename(draft); setEditing(false); }}
          onKeyDown={(e) => { if (e.key === "Enter") { onRename(draft); setEditing(false); } if (e.key === "Escape") { setDraft(name); setEditing(false); } }} />
      ) : (
        <span className="ap-planrow-name" onClick={() => setEditing(true)} title="Click to rename">{name}</span>
      )}
      <span className="ap-actual mono">
        <span title={`Actually spent or received in ${actualLabel}`}>{actual ? fmt(actual) : "—"}</span>
        {avg != null && avg !== amount && <button className="ap-avg" onClick={() => onAmount(avg)} title="Use the 3-month average as this budget">avg {fmt(avg)}</button>}
      </span>
      <div className={"ap-amtwrap" + (inherited && !amtFocus ? " inherited" : "")}>
        <span className="cur">$</span>
        <input type="text" inputMode="decimal" value={shownAmt} placeholder={varies ? "varies" : "0"} aria-label={`Budget for ${name}`}
          onFocus={() => setAmtFocus(true)} onBlur={() => setAmtFocus(false)}
          onChange={(e) => onAmount(parseFloat(e.target.value.replace(/[^0-9.]/g, "")) || 0)} />
      </div>
      <button className="ap-del" onClick={onRemove} title="Remove category">×</button>
    </div>
  );
}


/* ================= TRANSACTIONS ================= */
function Transactions({ state, period, editEntry, deleteEntry, importTxns, setBucketForEntry, openImport }) {
  const [q, setQ] = useState("");
  const [ftype, setFtype] = useState("All");
  const [fcat, setFcat] = useState("All");
  const [fsrc, setFsrc] = useState("all");   // all | typed | imported | <account last 4>
  const [editId, setEditId] = useState(null);
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);
  const buckets = Object.keys(state.buckets || {});

  const norm = (s)=> (s==null?"":String(s)).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const catOptions = useMemo(()=>{
    const base = ftype==="All"
      ? [...state.categories.Income, ...state.categories.Expenses, ...state.categories.Savings]
      : [...(state.categories[ftype]||[])];
    const fromEntries = state.entries.filter((e)=> ftype==="All"||e.type===ftype).map((e)=>e.category);
    return [...new Set([...base, ...fromEntries])].sort((a,b)=>a.localeCompare(b));
  }, [state, ftype]);

  const nq = norm(q);
  const accounts = (state.importer && state.importer.accounts) || {};
  const acctIds = [...new Set(state.entries.map((e)=>e.src?.acct).filter(Boolean))].sort();
  const srcOk = (x) => fsrc==="all" ? true : fsrc==="typed" ? !x.importId : fsrc==="imported" ? !!x.importId : x.src?.acct===fsrc;
  const list = state.entries
    .filter((x)=> period.inRange(x.date))
    .filter(srcOk)
    .filter((x)=> ftype==="All" ? true : x.type===ftype)
    .filter((x)=> fcat==="All" ? true : x.category===fcat)
    .filter((x)=> nq==="" ? true : (norm(x.category).includes(nq) || norm(x.note).includes(nq) || norm(x.name).includes(nq)))
    .slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);

  const net = list.reduce((a,b)=> b.type==="Income"?a+b.amount:b.type==="Expenses"?a-b.amount:a, 0);
  const allCats = (t) => state.categories[t] || [];

  const exportCsv = () => {
    const rows = state.entries.slice().sort((a,b)=> a.date<b.date?1:-1)
      .map((e)=>({ Date:e.date, Type:e.type, Category:e.category, Amount:e.amount, Note:e.note||e.name||"", Bucket:e.bucket||"" }));
    const csv = Papa.unparse(rows.length?rows:[{Date:"",Type:"",Category:"",Amount:"",Note:"",Bucket:""}]);
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "budget-transactions.csv"; a.click();
  };

  const onFile = (ev) => {
    const f = ev.target.files?.[0]; if (!f) return;
    Papa.parse(f, { header:true, skipEmptyLines:true, complete:(res)=>{
      const valid = []; let skipped = 0;
      res.data.forEach((row)=>{
        const get = (k)=>{ const kk = Object.keys(row).find((x)=>x.toLowerCase().trim()===k); return kk ? String(row[kk]).trim() : ""; };
        const date = get("date"); let type = get("type"); const category = get("category");
        const amount = parseFloat(String(get("amount")).replace(/[$,]/g,"")); const note = get("note"); const bucket = get("bucket");
        type = TYPES.find((t)=>t.toLowerCase()===type.toLowerCase());
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !type || !category || !amount || (amount<0 && type!=="Savings")) { skipped++; return; }
        valid.push({ id: uid(), date, type, category, amount: Math.round(amount*100)/100, note, bucket: bucket||undefined });
      });
      if (valid.length) importTxns(valid);
      setMsg(`Imported ${valid.length} record${valid.length===1?"":"s"}${skipped?`, skipped ${skipped} invalid`:""}.`);
      setTimeout(()=>setMsg(""), 5000);
      ev.target.value = "";
    }});
  };

  return (
    <section className="ap-card">
      <div className="ap-filtbar">
        <input className="ap-search" type="text" placeholder="Search category or note…" value={q} onChange={(e)=>setQ(e.target.value)}/>
        <select value={ftype} onChange={(e)=>{ setFtype(e.target.value); setFcat("All"); }}>
          {["All",...TYPES].map((t)=>(<option key={t}>{t}</option>))}
        </select>
        <select value={fcat} onChange={(e)=>setFcat(e.target.value)}>
          <option value="All">All categories</option>
          {catOptions.map((c)=>(<option key={c} value={c}>{c}</option>))}
        </select>
        <select value={fsrc} onChange={(e)=>setFsrc(e.target.value)} aria-label="Source">
          <option value="all">All sources</option>
          <option value="typed">Typed by hand</option>
          <option value="imported">From statements</option>
          {acctIds.map((id)=>(<option key={id} value={id}>{SI.acctLabel(id, accounts[id]?.kind, accounts[id])}</option>))}
        </select>
        <button className="ap-iobtn strong" onClick={openImport}>Import statement</button>
        <button className="ap-iobtn" onClick={exportCsv}>Export CSV</button>
        <button className="ap-iobtn" onClick={()=>fileRef.current?.click()}>Import CSV</button>
        <input ref={fileRef} type="file" accept=".csv,text/csv" style={{display:"none"}} onChange={onFile}/>
        <div className="ap-count">{list.length} records in {period.label} · net <b style={{color:net>=0?"var(--emerald)":"var(--clay)"}}>{fmt(net)}</b></div>
      </div>
      {msg && <div className="ap-importmsg">{msg}</div>}
      <div className="ap-txnscroll">
        <table className="ap-txntable">
          <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Note</th><th>Bucket</th><th className="r">Amount</th><th></th></tr></thead>
          <tbody>
            {list.map((x)=> editId===x.id ? (
              <tr key={x.id} className="editing">
                <td><input type="date" value={x.date} onChange={(e)=>editEntry(x.id,{date:e.target.value})}/></td>
                <td><select value={x.type} onChange={(e)=>{const t=e.target.value; editEntry(x.id,{type:t, category: allCats(t).includes(x.category)?x.category:(allCats(t)[0]||x.category)});}}>
                  {TYPES.map((t)=>(<option key={t}>{t}</option>))}</select></td>
                <td><select value={x.category} onChange={(e)=>editEntry(x.id,{category:e.target.value})}>
                  {[...new Set([...allCats(x.type), x.category])].map((c)=>(<option key={c}>{c}</option>))}</select></td>
                <td><input type="text" value={x.note||x.name||""} onChange={(e)=>editEntry(x.id,{note:e.target.value})}/>
                  {x.type==="Income" && x.date && (
                    <select className="ap-countsel" value={x.budgetMonth||"auto"} onChange={(e)=>editEntry(x.id,{budgetMonth: e.target.value==="auto"?undefined:e.target.value})} aria-label="Budget month">
                      <option value="auto">Counts toward: automatic</option>
                      <option value="same">Counts toward {monthLabel(x.date.slice(0,7))}</option>
                      <option value="next">Counts toward {monthLabel(addMonths(x.date.slice(0,7),1))}</option>
                    </select>)}</td>
                <td><select value={x.bucket||""} onChange={(e)=>setBucketForEntry(x.id, e.target.value||undefined)}>
                  <option value="">—</option>
                  {buckets.map((b)=>(<option key={b} value={b}>{b}</option>))}</select></td>
                <td className="r"><input className="amt" type="number" value={x.amount} onChange={(e)=>editEntry(x.id,{amount:Math.round((parseFloat(e.target.value)||0)*100)/100})}/></td>
                <td><button className="ap-rowbtn done" onClick={()=>setEditId(null)}>Done</button></td>
              </tr>
            ) : (
              <tr key={x.id}>
                <td className="mono nowrap">{x.date}</td>
                <td><span className={"chip chip-"+x.type.toLowerCase()}>{x.type}</span></td>
                <td className="cat">{x.category}</td>
                <td className="det">{x.note||x.name||<span className="dim">—</span>}{x.importId && <span className="ap-srcpdf" title="Imported from a bank statement">PDF</span>}{x.src && x.src.raw && <span className="ap-rawline" title={x.src.raw}>{x.src.raw}</span>}{x.date && countsMonth(x, state) !== x.date.slice(0,7) && <span className="ap-countsin" title="Counts toward this month's budget">counts in {MLABEL[+countsMonth(x, state).slice(5)-1]}</span>}</td>
                <td>{x.bucket ? <span className="bchip">{x.bucket}</span> : <span className="dim">—</span>}</td>
                <td className="r mono" style={{color:x.type==="Income"?"var(--emerald)":x.type==="Savings"?"var(--teal)":"var(--ink)"}}>
                  {(x.type==="Income") !== (x.amount<0) ? "+" : "−"}{fmt2(Math.abs(x.amount))}</td>
                <td className="rowacts">
                  <button className="ap-rowbtn" onClick={()=>setEditId(x.id)}>Edit</button>
                  <button className="ap-rowbtn del" onClick={()=>deleteEntry(x.id)}>×</button>
                </td>
              </tr>
            ))}
            {list.length===0 && <tr><td colSpan={7} className="ap-empty">{state.entries.length ? `No transactions in ${period.label} match these filters. Try All time in the date filter at the top.` : "No transactions yet — log some from the Dashboard."}</td></tr>}
          </tbody>
        </table>
      </div>
    </section>
  );
}

/* ================= YEAR ================= */
const axisMoney = (v) => { const a = Math.abs(v), sign = v < 0 ? "-" : ""; return sign + "$" + (a >= 1000 ? (+(a / 1000).toFixed(1)) + "k" : Math.round(a)); };
function YearChart({ data }) {
  const W = 720, H = 240, padL = 46, padR = 12, padT = 14, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const top = Math.max(1, ...data.map((d) => Math.max(d.Income, d.Expenses, d.Net, d.partial ? (d.PlanInc || 0) : 0)));
  const bottom = Math.min(0, ...data.map((d) => d.Net));
  const range = (top - bottom) || 1;
  const y = (v) => padT + innerH * (1 - (v - bottom) / range);
  const groupW = innerW / data.length;
  const barW = Math.min(12, groupW * 0.3);
  const grid = Array.from({ length: 5 }, (_, i) => bottom + range * i / 4);
  const zero = y(0);
  const pts = data.map((d, i) => [padL + groupW * (i + 0.5), y(d.Net)]);
  return (
    <svg viewBox={"0 0 " + W + " " + H} width="100%" height="240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Income, expenses and net by month">
      {grid.map((gv, i) => (
        <g key={i}>
          <line x1={padL} x2={W - padR} y1={y(gv)} y2={y(gv)} stroke="var(--line)" strokeWidth="1" />
          <text x={padL - 7} y={y(gv) + 3} textAnchor="end" fontSize="9" fontFamily="JetBrains Mono" fill="var(--ink-soft)">{axisMoney(gv)}</text>
        </g>
      ))}
      {data.map((d, i) => {
        const cx = padL + groupW * (i + 0.5);
        return (
          <g key={d.name}>
            {d.partial && d.PlanInc > d.Income && (
              <rect x={cx - barW - 1} y={y(d.PlanInc)} width={barW} height={Math.max(0, zero - y(d.PlanInc))} fill="none" stroke="var(--emerald)" strokeWidth="1.2" strokeDasharray="3 2" rx="2" />
            )}
            <rect x={cx - barW - 1} y={Math.min(y(d.Income), zero)} width={barW} height={Math.abs(zero - y(d.Income))} fill="var(--emerald)" rx="2" />
            <rect x={cx + 1} y={Math.min(y(d.Expenses), zero)} width={barW} height={Math.abs(zero - y(d.Expenses))} fill="var(--clay)" rx="2" />
            {(data.length <= 13 || i % Math.ceil(data.length / 12) === 0) && (
              <text x={cx} y={H - 9} textAnchor="middle" fontSize="10" fontFamily="Archivo" fill={d.partial ? "#8A5A00" : "var(--ink-soft)"}>{d.name}{d.partial ? " ◐" : ""}</text>
            )}
          </g>
        );
      })}
      {pts.slice(1).map((p, i) => {
        const dim = data[i].partial || data[i + 1].partial;
        return <line key={"s" + i} x1={pts[i][0]} y1={pts[i][1]} x2={p[0]} y2={p[1]} stroke={dim ? "var(--ink-soft)" : "var(--navy)"} strokeWidth="2" strokeDasharray={dim ? "4 3" : undefined} opacity={dim ? 0.55 : 1} />;
      })}
      {pts.map((p, i) => (
        <circle key={"c" + i} cx={p[0]} cy={p[1]} r="3.5" fill={data[i].partial ? "var(--paper2)" : "var(--navy)"} stroke={data[i].partial ? "var(--ink-soft)" : "var(--navy)"} strokeWidth="1.5" />
      ))}
    </svg>
  );
}


function Year({ state, period, goMonth }) {
  const ms = period.months;
  const multiYear = ms[0].slice(0, 4) !== ms[ms.length - 1].slice(0, 4);
  const inR = useMemo(() => state.entries.filter((e) => period.inRange(countsDate(e, state))), [state, period]);
  const rows = useMemo(() => ms.map((key) => {
    const ent = inR.filter((e) => countsMonth(e, state) === key);
    const sum = (t) => ent.filter((e) => e.type === t).reduce((a, e) => a + e.amount, 0);
    const inc = sum("Income"), exp = sum("Expenses"), sav = sum("Savings");
    const budget = state.categories.Expenses.reduce((a, c) => a + planFor(state, "Expenses", c, key), 0);
    const planInc = state.categories.Income.reduce((a, c) => a + planFor(state, "Income", c, key), 0);
    const gaps = statementGaps(state, key);
    return { key, label: MLABEL[+key.slice(5) - 1] + (multiYear ? " ’" + key.slice(2, 4) : ""), inc, exp, sav, budget, planInc, gaps, partial: gaps.length > 0, net: inc - exp, count: ent.length };
  }), [state, period, inR]);

  const tot = rows.reduce((a, r) => ({ inc: a.inc + r.inc, exp: a.exp + r.exp, sav: a.sav + r.sav, budget: a.budget + r.budget }), { inc: 0, exp: 0, sav: 0, budget: 0 });

  const catMap = {};
  inR.filter((e) => e.type === "Expenses").forEach((e) => { catMap[e.category] = (catMap[e.category] || 0) + e.amount; });
  const topCats = Object.entries(catMap).map(([c, v]) => ({ c, v })).sort((a, b) => b.v - a.v).slice(0, 10);
  const maxCat = topCats[0]?.v || 1;

  const bucketMap = {};
  inR.filter((e) => e.type === "Expenses").forEach((e) => { const b = e.bucket || "Untagged"; bucketMap[b] = (bucketMap[b] || 0) + e.amount; });
  const topBuckets = Object.entries(bucketMap).map(([c, v]) => ({ c, v })).sort((a, b) => b.v - a.v);
  const maxBucket = topBuckets[0]?.v || 1;
  const hasBucketSpend = topBuckets.some((b) => b.c !== "Untagged");

  const chartData = rows.map((r) => ({ name: r.label, Income: Math.round(r.inc), Expenses: Math.round(r.exp), Net: Math.round(r.net), partial: r.partial, PlanInc: Math.round(r.planInc) }));
  const partialRows = rows.filter((r) => r.partial);
  const hasData = tot.inc > 0 || tot.exp > 0;

  return (
    <>
      <section className="ap-summary">
        <Stat label="Income" val={tot.inc} color="var(--emerald)" />
        <Stat label="Expenses" val={tot.exp} color="var(--clay)" />
        <Stat label="Saved" val={tot.sav} color="var(--teal)" />
        <Stat label="Net" val={tot.inc - tot.exp} color={(tot.inc - tot.exp) < 0 ? "var(--clay)" : "var(--ink)"} hero />
      </section>

      <div className="ap-card" style={{ marginBottom: 16 }}>
        <h3 className="ap-mini-t" style={{ marginBottom: 6 }}>Monthly flow · {period.label}</h3>
        {hasData ? <YearChart data={chartData} /> : <p className="ap-empty">No transactions logged in {period.label}.</p>}
        <div className="ap-legend"><span><i style={{ background: "var(--emerald)" }} />Income</span>
          <span><i style={{ background: "var(--clay)" }} />Expenses</span><span><i style={{ background: "var(--navy)" }} />Net</span>
          {partialRows.length > 0 && <span><i className="ap-dashkey" />Planned income, not imported yet</span>}</div>
        <p className="ap-chartnote">The <b>Net</b> line is income minus expenses each month. Above $0 you came out ahead; below $0 you spent more than came in.</p>
      </div>

      <div className="ap-yeargrid">
        <div className="ap-card">
          <h3 className="ap-mini-t">By month</h3>
          <table className="ap-yeartable">
            <thead><tr><th>Month</th><th className="r">Budget</th><th className="r">Spent</th><th className="r">Δ</th><th className="r">Net</th></tr></thead>
            <tbody>
              {rows.map((r) => {
                const d = r.budget - r.exp;
                return (
                  <tr key={r.key} onClick={() => goMonth(r.key)} title="Open this month">
                    <td className="mlbl">{r.label}{r.count > 0 && <em className="ap-cnt">{r.count}</em>}{r.partial && <span className="ap-partial">partial</span>}</td>
                    <td className="r mono dim">{r.budget ? fmt(r.budget) : "—"}</td>
                    <td className="r mono">{r.exp ? fmt(r.exp) : "—"}</td>
                    <td className="r mono" style={{ color: r.budget ? (d >= 0 ? "var(--emerald)" : "var(--clay)") : "var(--ink-soft)" }}>{r.budget ? ((d >= 0 ? "+" : "") + fmt(d)) : "—"}</td>
                    <td className="r mono" style={{ color: r.partial ? "var(--ink-soft)" : r.net >= 0 ? "var(--emerald)" : "var(--clay)" }}>{(r.inc || r.exp) ? fmt(r.net) : "—"}</td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot><tr><td>Total</td><td className="r mono dim">{fmt(tot.budget)}</td><td className="r mono">{fmt(tot.exp)}</td>
              <td className="r mono" style={{ color: (tot.budget - tot.exp) >= 0 ? "var(--emerald)" : "var(--clay)" }}>{((tot.budget - tot.exp) >= 0 ? "+" : "") + fmt(tot.budget - tot.exp)}</td>
              <td className="r mono" style={{ color: (tot.inc - tot.exp) >= 0 ? "var(--emerald)" : "var(--clay)" }}>{fmt(tot.inc - tot.exp)}</td></tr></tfoot>
          </table>
          {partialRows.length > 0 && (
            <div className="ap-gaplist">
              <b>Partial months</b> have statements that aren't imported yet, so their income, spending and net are incomplete:
              <ul>{partialRows.map((r) => <li key={r.key}><b>{r.label}</b> · missing {r.gaps.map((g) => gapLabel(state, g)).join("; ")}</li>)}</ul>
            </div>
          )}
        </div>

        <div className="ap-card">
          <h3 className="ap-mini-t">Top categories · {period.label}</h3>
          {topCats.length ? (
            <ul className="ap-catbars">
              {topCats.map((t) => (
                <li key={t.c}>
                  <div className="row"><span className="nm">{t.c}</span><span className="mono vl">{fmt(t.v)}</span></div>
                  <div className="ap-track ap-track-sm"><div className="ap-fill" style={{ width: (t.v / maxCat * 100) + "%", background: "var(--clay)" }} /></div>
                </li>
              ))}
            </ul>
          ) : <p className="ap-empty">Nothing spent in {period.label}.</p>}
        </div>
      </div>

      <div className="ap-card" style={{ marginTop: 14 }}>
        <h3 className="ap-mini-t">Top buckets · {period.label}</h3>
        {hasBucketSpend ? (
          <ul className="ap-catbars">
            {topBuckets.map((t) => (
              <li key={t.c}>
                <div className="row"><span className="nm">{t.c === "Untagged" ? <span className="dim">Untagged</span> : t.c}</span><span className="mono vl">{fmt(t.v)}</span></div>
                <div className="ap-track ap-track-sm"><div className="ap-fill" style={{ width: (t.v / maxBucket * 100) + "%", background: t.c === "Untagged" ? "var(--line)" : "var(--navy)" }} /></div>
              </li>
            ))}
          </ul>
        ) : <p className="ap-empty">No bucketed spending in {period.label}. Tag expenses with a bucket when you log them, and they'll group here.</p>}
      </div>
    </>
  );
}


/* ================= TRENDS ================= */
function Trends({ state, archives, period, currentYear, endYear, restoreYear }) {
  const [selectedCats, setSelectedCats] = useState(["Groceries"]);
  const tooLong = daysBetween(period.from, period.to) > 366;
  const allEntries = useMemo(() => {
    const seen = new Set(state.entries.map((e) => e.id));
    const extra = [];
    (archives || []).forEach((a) => (a.state?.entries || []).forEach((e) => { if (!seen.has(e.id)) { seen.add(e.id); extra.push(e); } }));
    return [...state.entries, ...extra];
  }, [state, archives]);
  const baseYear = +period.to.slice(0, 4);
  const years = useMemo(() => {
    const ys = new Set(allEntries.map((e) => +String(e.date).slice(0, 4)).filter((y) => y > 1900));
    ys.add(baseYear);
    return [...ys].sort((a, b) => a - b);
  }, [allEntries, baseYear]);
  const windowFor = (yr) => ({ from: shiftYear(period.from, yr - baseYear), to: shiftYear(period.to, yr - baseYear) });
  const trendData = useMemo(() => {
    const result = {};
    selectedCats.forEach((cat) => {
      result[cat] = {};
      years.forEach((yr) => {
        const w = windowFor(yr);
        result[cat][yr] = allEntries.filter((e) => e.type === "Expenses" && e.category === cat && e.date >= w.from && e.date <= w.to).reduce((a, e) => a + e.amount, 0);
      });
    });
    return result;
  }, [selectedCats, allEntries, years, period]);

  const expenseCategories = state.categories.Expenses || [];
  const colors = ["var(--clay)", "var(--teal)", "var(--navy)", "var(--emerald)"];
  const maxV = Math.max(1, ...selectedCats.flatMap((c) => years.map((y) => trendData[c]?.[y] || 0)));
  const p10 = Math.pow(10, Math.floor(Math.log10(maxV)));
  const top = Math.ceil(maxV / p10) * p10;
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * top);
  const yPos = (v) => 250 - (v / top) * 200;
  const tickLbl = (v) => v >= 1000 ? `$${+(v / 1000).toFixed(1)}k` : `$${Math.round(v)}`;
  const W = 50 + years.length * 80;

  return (
    <section className="ap-trends">
      <div className="ap-trends-head">
        <h2 className="ap-mini-t" style={{ fontSize: 24, margin: "0 0 6px" }}>Spending trends</h2>
        <p className="ap-chartnote" style={{ margin: "0 0 12px" }}>Spending in <b>{period.label}</b>, compared with the same dates in other years.</p>
        <div className="ap-trend-opts">
          <label>Compare categories:</label>
          <select multiple value={selectedCats} onChange={(e) => { const opts = Array.from(e.target.selectedOptions, (o) => o.value); setSelectedCats(opts.length > 0 ? opts : ["Groceries"]); }} className="ap-multiselect">
            {expenseCategories.map((c) => (<option key={c} value={c}>{c}</option>))}
          </select>
        </div>
      </div>

      {tooLong ? (
        <div className="ap-card"><p className="ap-empty">Pick a range of a year or less (for example This year, or Jul 1 to Sep 30) to compare it across years.</p></div>
      ) : years.length > 1 ? (
        <>
          <div className="ap-card" style={{ marginBottom: 16 }}>
            <svg viewBox={`0 0 ${W} 300`} width="100%" height="280" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Spending by year">
              {ticks.map((val) => (
                <g key={`g-${val}`}>
                  <line x1="40" y1={yPos(val)} x2={W - 10} y2={yPos(val)} stroke="var(--line)" strokeWidth="0.5" />
                  <text x="35" y={yPos(val) + 4} fontSize="10" fill="var(--ink-soft)" textAnchor="end" fontFamily="JetBrains Mono">{tickLbl(val)}</text>
                </g>))}
              {selectedCats.map((cat, ci) => {
                const points = years.map((yr, i) => `${50 + i * 80},${yPos(trendData[cat]?.[yr] || 0)}`).join(" ");
                return (<g key={`l-${cat}`}>
                  <polyline points={points} fill="none" stroke={colors[ci % colors.length]} strokeWidth="2.5" vectorEffect="non-scaling-stroke" />
                  {years.map((yr, i) => <circle key={`d-${cat}-${yr}`} cx={50 + i * 80} cy={yPos(trendData[cat]?.[yr] || 0)} r="3" fill={colors[ci % colors.length]} />)}
                </g>);
              })}
              <line x1="40" y1="250" x2={W - 10} y2="250" stroke="var(--line)" strokeWidth="1.5" />
              {years.map((yr, i) => (<text key={`y-${yr}`} x={50 + i * 80} y="275" fontSize="12" fill="var(--ink-soft)" textAnchor="middle" fontFamily="JetBrains Mono">{yr}</text>))}
            </svg>
            <div className="ap-legend">{selectedCats.map((cat, i) => (<span key={cat}><i style={{ background: colors[i % colors.length] }} />{cat}</span>))}</div>
          </div>

          <div className="ap-card">
            <table className="ap-yeartable">
              <thead><tr><th>Category</th>{years.map((yr) => (<th key={yr} className="r">{yr}</th>))}<th className="r">Change</th><th className="r">%</th></tr></thead>
              <tbody>
                {selectedCats.map((cat) => {
                  const vals = years.map((yr) => trendData[cat]?.[yr] || 0);
                  const lastV = vals[vals.length - 1], prev = vals[vals.length - 2] || 0;
                  const change = lastV - prev, pct = prev > 0 ? ((change / prev) * 100) : 0;
                  return (<tr key={cat}>
                    <td className="mlbl">{cat}</td>
                    {vals.map((v, i) => (<td key={years[i]} className="r mono">{fmt(v)}</td>))}
                    <td className="r mono" style={{ color: change >= 0 ? "var(--clay)" : "var(--emerald)" }}>{(change >= 0 ? "+" : "") + fmt(change)}</td>
                    <td className="r mono" style={{ color: pct >= 0 ? "var(--clay)" : "var(--emerald)" }}>{(pct >= 0 ? "+" : "") + pct.toFixed(0)}%</td>
                  </tr>);
                })}
              </tbody>
            </table>
          </div>
        </>
      ) : (
        <div className="ap-card"><p className="ap-empty">Only {baseYear} has transactions so far. Once there's another year of spending, it's compared here.</p></div>
      )}

      <div className="ap-card ap-manageyears">
        <h3 className="ap-mini-t">Manage years</h3>
        <p className="ap-chartnote" style={{ margin: "0 0 14px" }}>Archiving snapshots the current year and clears the plan so you can start fresh. It's <b>reversible</b>: your transactions are never deleted, and you can restore any year below.</p>
        <button className="ap-archivebtn" onClick={endYear}>Archive {currentYear} &amp; start {currentYear + 1}</button>
        {(archives && archives.length > 0) && (
          <div className="ap-archlist">
            <div className="ap-archlbl">Archived years</div>
            {archives.slice().sort((a, b) => b.year - a.year).map((a) => (
              <div key={a.year} className="ap-archrow">
                <span className="yr">{a.year}</span>
                <button className="ap-restorebtn" onClick={() => restoreYear(a.year)}>Restore</button>
              </div>
            ))}
          </div>
        )}
      </div>
    </section>
  );
}

/* ================= SPLIT ================= */
function Split({ state, period, setSplit }) {
  const planAmt = (c) => planSum(state, "Expenses", c, period.months);
  const cats = state.categories.Expenses.filter((c)=>planAmt(c)>0).sort((a,b)=>planAmt(b)-planAmt(a));
  const split = state.split || {};
  // Mao's percent share (0-100). Backward compatible with old "mao"/"ingrid"/"split" values.
  const pctOf = (c) => { const v=split[c];
    if (v===undefined || v==="split") return 50;
    if (v==="mao") return 100; if (v==="ingrid") return 0;
    const n=Number(v); return isNaN(n)?50:Math.max(0,Math.min(100,Math.round(n))); };

  let mao = 0, ingrid = 0;
  cats.forEach((c)=>{ const a=planAmt(c); const p=pctOf(c); mao += a*p/100; ingrid += a*(100-p)/100; });
  const total = mao + ingrid;
  const half = total/2;
  const diff = mao - half;
  const maoPct = total>0 ? Math.round(mao/total*100) : 50;
  const ingridPct = 100 - maoPct;

  return (
    <section className="ap-split">
      <p className="ap-plan-hint" style={{marginBottom:14}}>Set who pays each budgeted expense for <b>{period.label}</b>. Use the presets, or tap <b>Custom</b> to split a bill any way — like a 60/40 mortgage or a shared car payment. Totals update live.</p>

      <section className="ap-summary" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
        <Stat label="Mao covers" val={mao} color="var(--navy)"/>
        <Stat label="Ingrid covers" val={ingrid} color="var(--teal)"/>
        <Stat label="Total" val={total} hero/>
      </section>

      {total>0 && (
        <div className="ap-splitsummary">
          <div className="ap-splitbar">
            <div className="m" style={{width:maoPct+"%"}}/>
            <div className="i" style={{width:ingridPct+"%"}}/>
          </div>
          <div className="ap-splitpct">
            <span><i style={{background:"var(--navy)"}}/>Mao {maoPct}%</span>
            <span><i style={{background:"var(--teal)"}}/>Ingrid {ingridPct}%</span>
          </div>
          <p className="ap-chartnote" style={{marginTop:10}}>
            {Math.abs(diff) < 0.5
              ? "Right now you're splitting this evenly."
              : <>An even split would be <b>{fmt(half)}</b> each. {diff>0?"Mao":"Ingrid"} is covering {fmt(Math.abs(diff))} more than half — if you wanted to even it out, {diff>0?"Ingrid":"Mao"} would chip in that much. Entirely your call.</>}
          </p>
        </div>
      )}

      <div className="ap-splitlist">
        {cats.map((c)=>(
          <SplitRow key={c} cat={c} amount={planAmt(c)} pct={pctOf(c)} onSet={(p)=>setSplit(c,p)}/>
        ))}
        {cats.length===0 && <p className="ap-empty">No budgeted expenses for {period.label}. Set budgets in Planning first.</p>}
      </div>
    </section>
  );
}

function SplitRow({ cat, amount, pct, onSet }) {
  const isPreset = pct===0 || pct===50 || pct===100;
  const [showCustom, setShowCustom] = useState(!isPreset);
  const maoAmt = Math.round(amount*pct/100);
  const ingridAmt = Math.round(amount) - maoAmt;
  const preset = (val, label) => (
    <button className={(!showCustom && pct===val)?"on":""} onClick={()=>{ onSet(val); setShowCustom(false); }}>{label}</button>
  );
  return (
    <div className="ap-splitrowwrap">
      <div className="ap-splitrow">
        <div className="ap-splitcat"><span className="nm">{cat}</span><span className="mono amt">{fmt(amount)}</span></div>
        <div className="ap-seg">
          {preset(100,"Mao")}
          {preset(50,"50/50")}
          {preset(0,"Ingrid")}
          <button className={showCustom?"on":""} onClick={()=>setShowCustom(true)}>Custom</button>
        </div>
      </div>
      {showCustom && (
        <div className="ap-customsplit">
          <input className="ap-splitrange" type="range" min="0" max="100" step="1" value={pct} onChange={(e)=>onSet(Number(e.target.value))}/>
          <div className="ap-customvals">
            <span><i style={{background:"var(--navy)"}}/>Mao <b className="mono">{fmt(maoAmt)}</b>
              <input className="ap-pctin" type="number" min="0" max="100" value={pct} onChange={(e)=>onSet(Math.max(0,Math.min(100,Number(e.target.value)||0)))}/>%</span>
            <span><i style={{background:"var(--teal)"}}/>Ingrid <b className="mono">{fmt(ingridAmt)}</b> ({100-pct}%)</span>
          </div>
        </div>
      )}
    </div>
  );
}


/* ================= STATEMENT IMPORT ================= */
const SI = window.StmtImport;
const EMPTY_IMPORTER = { accounts: {}, rules: {}, keywords: {}, holders: [], people: {}, imports: [] };
const importerOf = (state) => ({ ...EMPTY_IMPORTER, ...(state.importer || {}) });
const shortDate = (d) => { const [, m, dd] = d.split("-"); return `${MLABEL[+m - 1]} ${+dd}`; };
const fmtRange = (a, b) => `${shortDate(a)} – ${shortDate(b)}, ${b.slice(0, 4)}`;
const centsFmt = (c) => fmt2(Math.abs(c) / 100);
const GROUP_ORDER = ["needs-account", "needs-savings", "needs-category", "duplicate", "ready", "skipped"];

function ImportSheet({ state, userName, commitImport, undoImport, updateImporter, onClose }) {
  const [view, setView] = useState("pick");          // pick | reading | error | review | done | history | rules
  const [errors, setErrors] = useState([]);
  const [stmt, setStmt] = useState(null);
  const [answers, setAnswers] = useState({ accounts: {}, people: {} });
  const [overrides, setOverrides] = useState({});
  const [extraCats, setExtraCats] = useState({ Expenses: [], Income: [], Savings: [] });
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);
  const [showReady, setShowReady] = useState(false);
  const [showSkipped, setShowSkipped] = useState(false);
  const fileRef = useRef(null);
  const imp = importerOf(state);
  const frequent = useMemo(() => ({ Expenses: topUsed(state, "Expenses"), Income: topUsed(state, "Income") }), [state]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape" && !busy) onClose(); };
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    document.addEventListener("keydown", onKey);
    return () => { document.body.style.overflow = prev; document.removeEventListener("keydown", onKey); };
  }, [busy, onClose]);

  const reset = () => {
    setStmt(null); setErrors([]); setAnswers({ accounts: {}, people: {} }); setOverrides({});
    setExtraCats({ Expenses: [], Income: [], Savings: [] }); setResult(null); setShowReady(false); setShowSkipped(false);
  };

  const onFile = async (ev) => {
    const f = ev.target.files?.[0]; ev.target.value = ""; if (!f) return;
    reset(); setView("reading");
    try {
      if (!/\.pdf$/i.test(f.name) && f.type !== "application/pdf") throw new Error("That file isn't a PDF. Choose the statement PDF you downloaded from the bank.");
      const lines = await SI.readPdfLines(f);
      const res = SI.parseStatement(lines);
      if (!res.ok) { setErrors(res.errors); setView("error"); return; }
      const prior = imp.imports.find((i) => i.fp === res.statement.fingerprint);
      if (prior) { setErrors([`This statement was already imported on ${prior.at.slice(0, 10)} by ${prior.by}. To import it again, undo that import first under History.`]); setView("error"); return; }
      setStmt(res.statement); setView("review");
    } catch (e) { setErrors([e?.message || String(e)]); setView("error"); }
  };

  /* ---- context the classifier sees: saved settings plus this session's answers ---- */
  const ctx = useMemo(() => {
    if (!stmt) return null;
    const cats = (t) => [...(state.categories[t] || []), ...extraCats[t]];
    const self = { ...(imp.accounts[stmt.last4] || {}), ...(answers.accounts[stmt.last4] || {}), kind: stmt.kind, label: stmt.label, ours: true, statements: true };
    return {
      categories: { Income: cats("Income"), Expenses: cats("Expenses"), Savings: cats("Savings") },
      entries: state.entries,
      importer: { ...imp, accounts: { ...imp.accounts, ...answers.accounts, [stmt.last4]: self }, people: { ...imp.people, ...answers.people } },
    };
  }, [stmt, state, answers, extraCats]);

  const cands = useMemo(() => {
    if (!ctx) return [];
    return SI.classify(stmt, ctx).map((c) => {
      const o = overrides[c.id]; if (!o) return c;
      const x = { ...c };
      if (o.userSkip) { x.userSkip = true; x.rememberSkip = !!o.rememberSkip; }
      if (o.category && (x.kind === "expense" || x.kind === "income")) { x.type = o.type; x.category = o.category; x.source = "user"; }
      if (o.dupDecision) x.dupDecision = o.dupDecision;
      if (o.savingsCat) { x.savingsCat = o.savingsCat; x.savingsSource = "user"; }
      if (o.keepRefunded) x.removeRefunded = false;
      return x;
    });
  }, [ctx, overrides]);

  const groups = useMemo(() => {
    const g = Object.fromEntries(GROUP_ORDER.map((k) => [k, []]));
    cands.forEach((c) => g[SI.statusOf(c, ctx)].push(c));
    return g;
  }, [cands, ctx]);

  const setOv = (id, patch) => setOverrides((o) => ({ ...o, [id]: patch === null ? undefined : { ...(o[id] || {}), ...patch } }));
  const pickFor = (c, patch) => setOverrides((o) => {
    const next = { ...o, [c.id]: { ...(o[c.id] || {}), ...patch } };
    if (c.key) cands.forEach((x) => {
      const own = o[x.id];
      if (x.id !== c.id && x.key === c.key && x.dir === c.dir && (x.kind === "expense" || x.kind === "income") && !(own && (own.category || own.userSkip)))
        next[x.id] = { ...(own || {}), ...patch };
    });
    return next;
  });
  const answerAccount = (id, patch) => setAnswers((a) => ({ ...a, accounts: { ...a.accounts, [id]: { ...(imp.accounts[id] || {}), ...(a.accounts[id] || {}), ...patch } } }));
  const markBetween = (person) => setAnswers((a) => ({ ...a, people: { ...a.people, [person]: "household" } }));
  const addCategory = (type) => {
    const name = (window.prompt(`New ${type === "Income" ? "income" : "expense"} category name`) || "").trim();
    if (!name) return null;
    if (!ctx.categories[type].includes(name)) setExtraCats((e) => ({ ...e, [type]: [...e[type], name] }));
    return name;
  };

  const pendingAccounts = useMemo(() => {
    const m = new Map();
    groups["needs-account"].forEach((c) => { const p = c.pendingAccount; m.set(p.id, { ...p, count: (m.get(p.id)?.count || 0) + 1 }); });
    return [...m.values()];
  }, [groups]);
  const savingsAccountsNeedingCat = useMemo(() => [...new Set(groups["needs-savings"].map((c) => c.savingsAcct))], [groups]);

  const ready = groups.ready;
  const totals = ready.reduce((t, c) => {
    if (c.kind === "expense") t.exp += -c.amount;
    if (c.kind === "income") t.inc += c.amount;
    if (c.savingsDelta) t.sav += c.savingsDelta;
    t.entries += (c.kind === "expense" || c.kind === "income" ? 1 : 0) + (c.savingsDelta ? 1 : 0);
    return t;
  }, { exp: 0, inc: 0, sav: 0, entries: 0 });
  const remaining = groups["needs-account"].length + groups["needs-savings"].length + groups["needs-category"].length + groups.duplicate.length;

  const doImport = async () => {
    if (remaining > 0 || busy) return;
    setBusy(true);
    try {
      const importId = uid();
      const built = SI.buildEntries(cands, stmt, ctx, importId, uid);
      const res = await commitImport({ stmt, importId, built, answers, extraCats, by: userName });
      if (res.aborted) { setErrors(["This statement was imported from another device while you were reviewing it. Nothing was added twice."]); setView("error"); return; }
      setResult({ importId, count: built.entries.length, removed: built.removed.length, synced: res.ok, label: `${stmt.label} ····${stmt.last4}`, range: fmtRange(stmt.start, stmt.end) });
      setView("done");
    } finally { setBusy(false); }
  };

  const title = view === "history" ? "Import history" : view === "rules" ? "Import rules" : "Import a bank statement";

  return (
    <div className="ap-imp-overlay" role="dialog" aria-modal="true" aria-label={title}>
      <div className="ap-imp-sheet">
        <header className="ap-imp-head">
          <div>
            <h2 className="ap-imp-title">{title}</h2>
            {view === "review" && stmt && <p className="ap-imp-sub">{SI.acctLabel(stmt.last4, stmt.kind, imp.accounts[stmt.last4] || { label: stmt.label })} · {fmtRange(stmt.start, stmt.end)} · <span className="ok">totals match the statement</span></p>}
          </div>
          <div className="ap-imp-headbtns">
            {(view === "pick" || view === "history" || view === "rules" || view === "done" || view === "error") && (
              <nav className="ap-imp-nav">
                <button className={view !== "history" && view !== "rules" ? "on" : ""} onClick={() => { reset(); setView("pick"); }}>Import</button>
                <button className={view === "history" ? "on" : ""} onClick={() => setView("history")}>History</button>
                <button className={view === "rules" ? "on" : ""} onClick={() => setView("rules")}>Rules</button>
              </nav>
            )}
            <button className="ap-imp-close" onClick={onClose} aria-label="Close">×</button>
          </div>
        </header>

        <input ref={fileRef} type="file" accept="application/pdf,.pdf" style={{ display: "none" }} onChange={onFile} />

        {view === "pick" && (
          <div className="ap-imp-body ap-imp-pick">
            <p>Choose a Bank of America checking, savings or credit card statement PDF. It's read on this device; only the transactions you approve are saved.</p>
            <p className="ap-imp-fine">Picking a category for one transaction fills in the others from the same merchant on that statement, and it's remembered for next time.</p>
            <button className="ap-imp-primary" onClick={() => fileRef.current?.click()}>Choose statement PDF</button>
            <p className="ap-imp-fine">Nothing is added until you review it. Each statement can be imported once, and any import can be undone from History.</p>
            <StatementCoverage imp={imp} updateImporter={updateImporter} />
          </div>
        )}

        {view === "reading" && <div className="ap-imp-body ap-imp-pick"><p>Reading the statement…</p></div>}

        {view === "error" && (
          <div className="ap-imp-body">
            <div className="ap-imp-error">
              <b>Nothing was imported.</b>
              <ul>{errors.map((e, i) => <li key={i}>{e}</li>)}</ul>
              <p className="ap-imp-fine">If the numbers don't add up, the statement layout may have changed. Send that statement over so the reader can be updated.</p>
            </div>
            <button className="ap-imp-secondary" onClick={() => fileRef.current?.click()}>Choose another PDF</button>
          </div>
        )}

        {view === "review" && ctx && (
          <>
            <div className="ap-imp-body">
              {pendingAccounts.length > 0 && (
                <section className="ap-imp-group">
                  <h3>Accounts to confirm</h3>
                  <p className="ap-imp-hint">Answer once per account. The answer is remembered for future statements.</p>
                  {pendingAccounts.map((a) => <AccountPrompt key={a.id} acct={a}
                    onAnswer={(patch) => answerAccount(a.id, { kind: a.kind, label: a.id.match(/^\d{4}$/) ? undefined : a.label, ...patch })} />)}
                </section>
              )}

              {savingsAccountsNeedingCat.length > 0 && (
                <section className="ap-imp-group">
                  <h3>Savings category</h3>
                  {savingsAccountsNeedingCat.map((id) => (
                    <label key={id} className="ap-imp-savcat">
                      <span>Count money moving in and out of <b>{SI.acctLabel(id, "savings", ctx.importer.accounts[id])}</b> as</span>
                      <select value="" onChange={(e) => e.target.value && answerAccount(id, { savingsCategory: e.target.value })}>
                        <option value="">Choose…</option>
                        {ctx.categories.Savings.map((s) => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </label>
                  ))}
                  <p className="ap-imp-hint">You can still change it on individual transfers below.</p>
                </section>
              )}

              {groups["needs-category"].length > 0 && (
                <section className="ap-imp-group">
                  <h3>Needs a category <span className="n">{groups["needs-category"].length}</span></h3>
                  {groups["needs-category"].map((c) => <ReviewRow key={c.id} c={c} ctx={ctx} frequent={frequent} setOv={setOv} pickFor={pickFor} markBetween={markBetween} addCategory={addCategory} />)}
                </section>
              )}

              {groups.duplicate.length > 0 && (
                <section className="ap-imp-group">
                  <h3>Possible duplicates <span className="n">{groups.duplicate.length}</span></h3>
                  <p className="ap-imp-hint">These match something already logged: same amount, within 3 days.</p>
                  {groups.duplicate.map((c) => <ReviewRow key={c.id} c={c} ctx={ctx} frequent={frequent} setOv={setOv} pickFor={pickFor} markBetween={markBetween} addCategory={addCategory} />)}
                </section>
              )}

              <section className="ap-imp-group">
                <button className="ap-imp-toggle" onClick={() => setShowReady((v) => !v)} aria-expanded={showReady}>
                  <span>Ready to import <span className="n">{ready.length}</span></span><span className="chev">{showReady ? "Hide" : "Review"}</span>
                </button>
                {showReady && ready.map((c) => <ReviewRow key={c.id} c={c} ctx={ctx} frequent={frequent} setOv={setOv} pickFor={pickFor} markBetween={markBetween} addCategory={addCategory} />)}
              </section>

              <section className="ap-imp-group">
                <button className="ap-imp-toggle" onClick={() => setShowSkipped((v) => !v)} aria-expanded={showSkipped}>
                  <span>Not imported <span className="n">{groups.skipped.length}</span></span><span className="chev">{showSkipped ? "Hide" : "Show why"}</span>
                </button>
                {showSkipped && groups.skipped.map((c) => (
                  <div key={c.id} className="ap-imp-row skipped">
                    <div className="ap-imp-rowmain">
                      <span className="d mono">{shortDate(c.date)}</span>
                      <span className="m">{c.merchant}</span>
                      <span className={"a mono " + (c.amount < 0 ? "out" : "in")}>{c.amount < 0 ? "−" : "+"}{centsFmt(c.amount)}</span>
                    </div>
                    <div className="ap-imp-why">
                      {c.userSkip ? "You chose not to import this" : c.dupDecision === "skip" ? "Skipped as a duplicate" : c.skipReason}
                      {c.removeRefunded && c.refundOf && <> · also removes the earlier {fmt2(c.refundOf.amount)} purchase <button className="ap-imp-link" onClick={() => setOv(c.id, { keepRefunded: true })}>Keep it</button></>}
                      {(c.userSkip || c.dupDecision === "skip") && <button className="ap-imp-link" onClick={() => setOv(c.id, { userSkip: false, rememberSkip: false, dupDecision: null })}>Undo</button>}
                    </div>
                  </div>
                ))}
              </section>
            </div>

            <footer className="ap-imp-foot">
              <div className="ap-imp-sum">
                <span>Spending <b className="mono">{fmt2(totals.exp / 100)}</b></span>
                <span>Income <b className="mono">{fmt2(totals.inc / 100)}</b></span>
                <span>Savings <b className="mono">{totals.sav < 0 ? "−" : "+"}{fmt2(Math.abs(totals.sav) / 100)}</b></span>
              </div>
              <div className="ap-imp-footbtns">
                <button className="ap-imp-secondary" onClick={() => { reset(); setView("pick"); }}>Cancel</button>
                <button className="ap-imp-primary" disabled={remaining > 0 || busy || totals.entries === 0} onClick={doImport}>
                  {busy ? "Importing…" : remaining > 0 ? `${remaining} left to review` : totals.entries === 0 ? "Nothing to import" : `Import ${totals.entries} entries`}
                </button>
              </div>
            </footer>
          </>
        )}

        {view === "done" && result && (
          <div className="ap-imp-body ap-imp-pick">
            <p><b>Imported {result.count} entries</b> from {result.label} ({result.range}).{result.removed ? ` Removed ${result.removed} earlier purchase${result.removed > 1 ? "s" : ""} that were refunded.` : ""}</p>
            {!result.synced && <p className="ap-imp-warn">Saved on this device, but syncing to your shared budget failed. The save indicator at the top of the app will retry.</p>}
            <div className="ap-imp-footbtns">
              <button className="ap-imp-secondary" onClick={async () => { if (confirm("Undo this import? Its entries are removed from the budget.")) { await undoImport(result.importId); reset(); setView("history"); } }}>Undo import</button>
              <button className="ap-imp-primary" onClick={() => { reset(); fileRef.current?.click(); }}>Import another</button>
            </div>
          </div>
        )}

        {view === "history" && <ImportHistory imports={imp.imports} undoImport={undoImport} />}
        {view === "rules" && <ImportRules imp={imp} categories={state.categories} updateImporter={updateImporter} />}
      </div>
    </div>
  );
}

function StatementCoverage({ imp, updateImporter }) {
  const byAcct = {};
  imp.imports.forEach((i) => { (byAcct[i.acct] = byAcct[i.acct] || []).push(i); });
  const ids = [...new Set([...Object.keys(byAcct), ...Object.entries(imp.accounts).filter(([, a]) => a.ours && a.statements).map(([id]) => id)])];
  if (!ids.length) return null;
  const today = localToday();
  const kindName = { card: "Credit card", savings: "Savings", checking: "Checking" };
  return (
    <section className="ap-imp-cover">
      <h3>Your statements</h3>
      {ids.map((id) => {
        const a = imp.accounts[id] || {};
        const list = (byAcct[id] || []).slice().sort((x, y) => x.start.localeCompare(y.start));
        const gaps = [];
        for (let k = 1; k < list.length; k++) { const after = addDaysISO(list[k - 1].end, 1); if (list[k].start > after) gaps.push({ from: after, to: addDaysISO(list[k].start, -1) }); }
        const last = list[list.length - 1];
        const stale = last && daysBetween(last.end, today) > 35;
        return (
          <div key={id} className="ap-imp-cov">
            <div className="top">
              <b>{SI.acctLabel(id, a.kind, a)}</b>
              {kindName[a.kind] && <span className="kind">{kindName[a.kind]}</span>}
              <button className="ap-imp-link" onClick={() => {
                const n = window.prompt("Nickname for this account (for example: Shared debit)", a.nickname || "");
                if (n !== null) updateImporter((m) => { m.accounts[id] = { ...(m.accounts[id] || {}), nickname: n.trim() || undefined }; });
              }}>Rename</button>
            </div>
            {list.length ? (
              <div className="chips">
                {list.map((i) => <span key={i.id} className="chip">{fmtRange(i.start, i.end)}</span>)}
                {gaps.map((g) => <span key={g.from} className="chip gap">Missing {fmtRange(g.from, g.to)}</span>)}
              </div>
            ) : <p className="ap-imp-fine">No statements imported yet.</p>}
            {last && <p className={"ap-imp-fine" + (stale ? " warn" : "")}>{stale ? `Latest ends ${shortDate(last.end)}, ${last.end.slice(0, 4)}. A newer statement is probably ready.` : `Up to date through ${shortDate(last.end)}, ${last.end.slice(0, 4)}.`}</p>}
          </div>
        );
      })}
    </section>
  );
}

function AccountPrompt({ acct, onAnswer }) {
  const multi = acct.kind === "card" || acct.kind === "savings";
  return (
    <div className="ap-imp-ask">
      <p><b>{acct.label}</b> shows up in {acct.count} transaction{acct.count > 1 ? "s" : ""}. Does it belong to your household?</p>
      <div className="ap-imp-askbtns">
        {multi ? (
          <>
            <button onClick={() => onAnswer({ ours: true, statements: true })}>Ours, we upload its statements</button>
            <button onClick={() => onAnswer({ ours: true, statements: false })}>Ours, no statements</button>
          </>
        ) : <button onClick={() => onAnswer({ ours: true })}>Yes, it's ours</button>}
        <button onClick={() => onAnswer({ ours: false })}>Not ours</button>
      </div>
      {acct.kind === "card" && <p className="ap-imp-fine">With statements, payments to this card are skipped and its purchases come from its own statement. Without, each payment is logged as the expense.</p>}
      {acct.kind === "savings" && <p className="ap-imp-fine">With statements, transfers are counted from that savings statement. Without, they're counted from this one.</p>}
    </div>
  );
}

function CatPicker({ valueLabel, options, frequent, extras, onPick, ariaLabel }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const ql = q.trim().toLowerCase();
  const rank = (o) => { const i = frequent.indexOf(o); return i < 0 ? 99 : i; };
  const top = ql ? [] : frequent.filter((o) => options.includes(o));
  const rest = options.filter((o) => (ql ? o.toLowerCase().includes(ql) : !top.includes(o)));
  if (ql) rest.sort((a, b) => rank(a) - rank(b));
  const pick = (v) => { onPick(v); setOpen(false); setQ(""); };
  const item = (v, label, cls) => <li key={cls + v} className={cls} onMouseDown={(e) => { e.preventDefault(); pick(v); }}>{label}</li>;
  return (
    <div className="ap-combo ap-catpick">
      <input type="text" className={valueLabel ? "" : "empty"} value={open ? q : valueLabel} placeholder="Type to find a category…" aria-label={ariaLabel}
        onFocus={() => { setOpen(true); setQ(""); }} onChange={(e) => { setQ(e.target.value); setOpen(true); }}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
        onKeyDown={(e) => { if (e.key === "Enter" && ql && rest[0]) { pick(rest[0]); e.target.blur(); } if (e.key === "Escape") { setOpen(false); e.target.blur(); } }} />
      {open && (
        <ul className="ap-combo-list">
          {top.length > 0 && <li className="hd">Most used</li>}
          {top.map((o) => item(o, o, "t"))}
          {top.length > 0 && rest.length > 0 && <li className="hd">All categories</li>}
          {rest.map((o) => item(o, o, ""))}
          {ql && rest.length === 0 && <li className="none">No category matches “{q}”</li>}
          <li className="hd">Other</li>
          {extras.map(([v, l]) => item(v, l, "x"))}
        </ul>
      )}
    </div>
  );
}

function ReviewRow({ c, ctx, setOv, pickFor, markBetween, addCategory, frequent }) {
  const isMain = c.kind === "expense" || c.kind === "income";
  const type = c.dir === "out" ? "Expenses" : "Income";
  const value = c.userSkip ? (c.rememberSkip ? "__skipall" : "__skip") : c.category ? `${c.type}::${c.category}` : "";
  const onPick = (v) => {
    if (!v) return;
    if (v === "__skip") return setOv(c.id, { userSkip: true, rememberSkip: false });
    if (v === "__skipall") return pickFor(c, { userSkip: true, rememberSkip: true });
    if (v === "__between") return markBetween(c.person);
    if (v === "__new") { const name = addCategory(type); if (name) pickFor(c, { type, category: name, userSkip: false, rememberSkip: false }); return; }
    const [t, cat] = v.split("::");
    pickFor(c, { type: t, category: cat, userSkip: false, rememberSkip: false });
  };
  const tag = c.source === "learned" ? "remembered" : c.source === "keyword" ? "matched by name" : c.source === "user" ? "your pick" : null;
  const savCat = SI.rowSavingsCategory(c, ctx);

  return (
    <div className={"ap-imp-row" + (c.dupOf ? " dup" : "")}>
      <div className="ap-imp-rowmain">
        <span className="d mono">{shortDate(c.date)}</span>
        <span className="m" title={c.desc}>{c.merchant}{c.memo && <span className="memo"> “{c.memo}”</span>}</span>
        <span className={"a mono " + (c.amount < 0 ? "out" : "in")}>{c.amount < 0 ? "−" : "+"}{centsFmt(c.amount)}</span>
      </div>
      <div className="ap-imp-raw" title={c.desc}>{c.desc}</div>
      {(c.fx || c.feeMerged > 0) && <div className="ap-imp-why">{c.fx}{c.fx && c.feeMerged ? " · " : ""}{c.feeMerged > 0 && `includes ${fmt2(c.feeMerged / 100)} foreign fee`}</div>}

      {isMain && (
        <div className="ap-imp-pickrow">
          <CatPicker ariaLabel={`Category for ${c.merchant}`}
            valueLabel={c.userSkip ? (c.rememberSkip ? "Don't import (always)" : "Don't import") : (value ? c.category : "")}
            options={ctx.categories[type]} frequent={(frequent && frequent[type]) || []}
            extras={[["__new", "New category…"], ...(c.person ? [["__between", "Money between us (skip)"]] : []), ["__skip", "Don't import"], ...(c.key && !c.person ? [["__skipall", "Don't import, always skip this"]] : [])]}
            onPick={(v) => onPick(v.startsWith("__") ? v : `${type}::${v}`)} />
          {tag && <span className="ap-imp-tag">{tag}</span>}
        </div>
      )}

      {c.savingsDelta !== 0 && (
        <div className="ap-imp-pickrow">
          <span className="ap-imp-savnote">{c.savingsDelta < 0 ? "Out of savings" : "Into savings"} {fmt2(Math.abs(c.savingsDelta) / 100)} as</span>
          <select className={savCat ? "" : "empty"} value={savCat || ""} onChange={(e) => e.target.value && setOv(c.id, { savingsCat: e.target.value })} aria-label="Savings category">
            <option value="">Choose…</option>
            {ctx.categories.Savings.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
          {c.kind === "savings-only" && c.person == null && (
            <select className="ap-imp-mini" value="" onChange={(e) => { if (e.target.value === "__skip") setOv(c.id, { userSkip: true }); }} aria-label="More options">
              <option value="">More</option><option value="__skip">Don't import</option>
            </select>
          )}
        </div>
      )}

      {c.dupOf && !c.userSkip && (
        <div className="ap-imp-dupbox">
          <span>Already logged: {c.dupOf.category} {fmt2(Math.abs(c.dupOf.amount))} on {shortDate(c.dupOf.date)}{c.dupOf.note ? ` (${c.dupOf.note})` : ""}</span>
          <div className="ap-imp-askbtns">
            <button className={c.dupDecision === "keep" ? "on" : ""} onClick={() => setOv(c.id, { dupDecision: "keep" })}>Import anyway</button>
            <button onClick={() => setOv(c.id, { dupDecision: "skip" })}>Skip it</button>
          </div>
        </div>
      )}
    </div>
  );
}

function ImportHistory({ imports, undoImport }) {
  if (!imports.length) return <div className="ap-imp-body"><p className="ap-empty">No statements imported yet.</p></div>;
  return (
    <div className="ap-imp-body">
      {imports.map((i) => (
        <div key={i.id} className="ap-imp-hist">
          <div>
            <b>{i.label} ····{i.acct}</b>
            <div className="ap-imp-fine">{fmtRange(i.start, i.end)} · {i.count} entries · imported {i.at.slice(0, 10)} by {i.by}</div>
          </div>
          <button className="ap-imp-secondary" onClick={() => { if (confirm(`Undo the ${i.label} ····${i.acct} import? Its ${i.count} entries are removed, including any edits made to them since.`)) undoImport(i.id); }}>Undo</button>
        </div>
      ))}
    </div>
  );
}

function ImportRules({ imp, categories, updateImporter }) {
  const rules = Object.entries(imp.rules).sort((a, b) => a[0].localeCompare(b[0]));
  const accounts = Object.entries(imp.accounts);
  const people = Object.entries(imp.people);
  const describe = (r) => r.action === "skip" ? "Always skipped" : `${r.category} (${r.type === "Expenses" ? "expense" : r.type === "Income" ? "income" : "savings"})`;
  const kwKey = (t, c) => `${t}::${c}`;
  return (
    <div className="ap-imp-body">
      <section className="ap-imp-group">
        <h3>Category keywords</h3>
        <p className="ap-imp-hint">Words that point to a category when a merchant is new, separated by commas. Example for Gas: marathon, shell, exxon.</p>
        {["Expenses", "Income"].map((t) => (categories[t] || []).map((c) => (
          <label key={kwKey(t, c)} className="ap-imp-kw">
            <span>{c}</span>
            <input type="text" defaultValue={(imp.keywords[kwKey(t, c)] || []).join(", ")} placeholder="keywords"
              onBlur={(e) => { const list = e.target.value.split(",").map((x) => x.trim()).filter(Boolean);
                updateImporter((m) => { if (list.length) m.keywords[kwKey(t, c)] = list; else delete m.keywords[kwKey(t, c)]; }); }} />
          </label>
        )))}
      </section>

      <section className="ap-imp-group">
        <h3>Remembered merchants <span className="n">{rules.length}</span></h3>
        {rules.length === 0 && <p className="ap-empty">Merchants you categorize during an import appear here.</p>}
        {rules.map(([k, r]) => (
          <div key={k} className="ap-imp-rule">
            <span className="k mono">{k}</span><span className="v">{describe(r)}</span>
            <button className="ap-rowbtn del" aria-label={`Forget ${k}`} onClick={() => updateImporter((m) => { delete m.rules[k]; })}>×</button>
          </div>
        ))}
      </section>

      <section className="ap-imp-group">
        <h3>Known accounts</h3>
        {accounts.length === 0 && <p className="ap-empty">Accounts appear here after your first import.</p>}
        {accounts.map(([id, a]) => (
          <div key={id} className="ap-imp-rule">
            <span className="k">{SI.acctLabel(id, a.kind, a)}</span>
            <span className="v">{!a.ours ? "Not ours" : a.statements ? "Ours, statements uploaded" : a.kind === "checking" ? "Ours" : "Ours, no statements"}{a.savingsCategory ? ` · ${a.savingsCategory}` : ""}</span>
            <button className="ap-rowbtn del" aria-label={`Forget ${id}`} onClick={() => { if (confirm("Forget this account? You'll be asked about it again on the next import.")) updateImporter((m) => { delete m.accounts[id]; }); }}>×</button>
          </div>
        ))}
      </section>

      {people.length > 0 && (
        <section className="ap-imp-group">
          <h3>People in the household</h3>
          {people.map(([n]) => (
            <div key={n} className="ap-imp-rule">
              <span className="k">{n}</span><span className="v">Zelle with them is skipped</span>
              <button className="ap-rowbtn del" aria-label={`Forget ${n}`} onClick={() => updateImporter((m) => { delete m.people[n]; })}>×</button>
            </div>
          ))}
        </section>
      )}
    </div>
  );
}


/* ================= BACKUPS ================= */
function BackupsSheet({ listBackups, saveNow, restoreBackup, downloadCopy, onClose }) {
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const load = async () => { setErr(""); try { setRows(await listBackups()); } catch (e) { setErr("Couldn't load backups. Check your connection."); setRows([]); } };
  useEffect(() => { load(); }, []);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape" && !busy) onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [busy, onClose]);
  const when = (iso) => { const d = new Date(iso); return d.toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }); };
  return (
    <div className="ap-imp-overlay" role="dialog" aria-modal="true" aria-label="Backups">
      <div className="ap-imp-sheet">
        <header className="ap-imp-head">
          <div>
            <h2 className="ap-imp-title">Backups</h2>
            <p className="ap-imp-sub">A copy of the whole budget is saved once a day and before every import, undo, reset or restore.</p>
          </div>
          <div className="ap-imp-headbtns"><button className="ap-imp-close" onClick={onClose} aria-label="Close">×</button></div>
        </header>
        <div className="ap-imp-body">
          <div className="ap-imp-footbtns" style={{ marginBottom: 14 }}>
            <button className="ap-imp-primary" disabled={busy} onClick={async () => { setBusy(true); await saveNow(); await load(); setBusy(false); }}>Save a copy now</button>
            <button className="ap-imp-secondary" onClick={downloadCopy}>Download a copy</button>
          </div>
          {err && <div className="ap-imp-warn">{err}</div>}
          {rows === null && <p className="ap-imp-fine">Loading…</p>}
          {rows && rows.length === 0 && !err && <p className="ap-empty">No backups yet. The first one is saved the next time the app opens.</p>}
          {rows && rows.map((r) => (
            <div key={r.id} className="ap-imp-hist">
              <div>
                <b>{when(r.at)}</b>
                <div className="ap-imp-fine">{r.label}{r.by ? ` · ${r.by}` : ""}{r.entries != null ? ` · ${r.entries} records` : ""}</div>
              </div>
              <button className="ap-imp-secondary" disabled={busy} onClick={async () => {
                if (!confirm(`Restore the budget to how it was on ${when(r.at)}? The current version is backed up first, so you can undo this.`)) return;
                setBusy(true); const ok = await restoreBackup(r.id); setBusy(false);
                if (ok) onClose(); else setErr("Couldn't restore that backup.");
              }}>Restore</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ================= AUTH ================= */
function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const submit = async () => {
    setErr("");
    if (!email || !pw) { setErr("Enter your email and password."); return; }
    if (mode==="signup" && pw.length<6) { setErr("Password must be at least 6 characters."); return; }
    setBusy(true);
    try {
      if (mode==="signup") {
        const { error } = await sb.auth.signUp({ email: email.trim(), password: pw });
        if (error) throw error;
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (error) throw error;
      }
    } catch (e) { setErr((e && e.message) || "Something went wrong."); }
    finally { setBusy(false); }
  };
  return (
    <>
      <Styles/>
      <div className="ap-auth-wrap">
        <div className="ap-auth">
          <div className="ap-auth-k">Family Budget</div>
          <h1>Ramirez Rojas <span className="ap-heart">♥</span> 💵</h1>
          <p className="sub">{mode==="signup" ? "Create your account to start budgeting together." : "Sign in to your family budget."}</p>
          {err && <div className="err">{err}</div>}
          <label>Email</label>
          <input type="email" placeholder="you@email.com" value={email} autoComplete="email"
            onChange={(e)=>setEmail(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&submit()}/>
          <label>Password</label>
          <input type="password" placeholder="••••••••" value={pw} autoComplete={mode==="signup"?"new-password":"current-password"}
            onChange={(e)=>setPw(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&submit()}/>
          <button className="go" onClick={submit} disabled={busy}>{busy ? "Please wait…" : (mode==="signup"?"Create account":"Sign in")}</button>
          <div className="toggle">
            {mode==="signup" ? "Already have an account? " : "New here? "}
            <button onClick={()=>{ setMode(mode==="signup"?"signin":"signup"); setErr(""); }}>{mode==="signup"?"Sign in":"Create one"}</button>
          </div>
        </div>
      </div>
    </>
  );
}

function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => { try { sub.subscription.unsubscribe(); } catch (e) {} };
  }, []);
  if (session === undefined) return <div className="ap-root"><Styles/><p className="ap-loading">Loading…</p></div>;
  if (!session) return <AuthScreen/>;
  const email = (session.user.email||"").toLowerCase();
  if (!ALLOWED.includes(email)) {
    return (
      <>
        <Styles/>
        <div className="ap-auth-wrap"><div className="ap-auth" style={{textAlign:"center"}}>
          <h1 style={{fontSize:24}}>Access restricted</h1>
          <p className="sub">This account isn't authorized for the Ramirez Rojas budget.</p>
          <button className="go" onClick={()=>sb.auth.signOut()}>Sign out</button>
        </div></div>
      </>
    );
  }
  return <App session={session} onSignOut={async ()=>{ await sb.auth.signOut(); setSession(null); }}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

</script>
