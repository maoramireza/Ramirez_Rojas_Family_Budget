              <button className="ap-imp-secondary" onClick={async () => { if (confirm("Undo this import? Its entries are removed from the budget.")) { await undoImport(result.importId); reset(); setView("history"); } }}>Undo import</button>
              <button className="ap-imp-primary" onClick={() => { reset(); fileRef.current?.click(); }}>Import another</button>
            </div>
          </div>
        )}

        {view === "history" && <ImportHistory imports={imp.imports} undoImport={undoImport} />}
        {view === "rules" && <ImportRules imp={imp} categories={state.categories} updateImporter={updateImporter} />}
      </div>
    </div>
  );
}

function StatementCoverage({ imp, updateImporter }) {
  const byAcct = {};
  imp.imports.forEach((i) => { if (i.kind !== "photo") (byAcct[i.acct] = byAcct[i.acct] || []).push(i); });
  const ids = [...new Set([...Object.keys(byAcct), ...Object.entries(imp.accounts).filter(([, a]) => a.ours && a.statements).map(([id]) => id)])];
  if (!ids.length) return null;
  const today = localToday();
  const kindName = { card: "Credit card", savings: "Savings", checking: "Checking" };
  return (
    <section className="ap-imp-cover">
      <h3>Your statements</h3>
      {ids.map((id) => {
        const a = imp.accounts[id] || {};
        const list = (byAcct[id] || []).slice().sort((x, y) => x.start.localeCompare(y.start));
        const gaps = [];
        for (let k = 1; k < list.length; k++) { const after = addDaysISO(list[k - 1].end, 1); if (list[k].start > after) gaps.push({ from: after, to: addDaysISO(list[k].start, -1) }); }
        const last = list[list.length - 1];
        const stale = last && daysBetween(last.end, today) > 35;
        return (
          <div key={id} className="ap-imp-cov">
            <div className="top">
              <b>{SI.acctLabel(id, a.kind, a)}</b>
              {kindName[a.kind] && <span className="kind">{kindName[a.kind]}</span>}
              <button className="ap-imp-link" onClick={() => {
                const n = window.prompt("Nickname for this account (for example: Shared debit)", a.nickname || "");
                if (n !== null) updateImporter((m) => { m.accounts[id] = { ...(m.accounts[id] || {}), nickname: n.trim() || undefined }; });
              }}>Rename</button>
            </div>
            {list.length ? (
              <div className="chips">
                {list.map((i) => <span key={i.id} className="chip">{fmtRange(i.start, i.end)}</span>)}
                {gaps.map((g) => <span key={g.from} className="chip gap">Missing {fmtRange(g.from, g.to)}</span>)}
              </div>
            ) : <p className="ap-imp-fine">No statements imported yet.</p>}
            {last && <p className={"ap-imp-fine" + (stale ? " warn" : "")}>{stale ? `Latest ends ${shortDate(last.end)}, ${last.end.slice(0, 4)}. A newer statement is probably ready.` : `Up to date through ${shortDate(last.end)}, ${last.end.slice(0, 4)}.`}</p>}
          </div>
        );
      })}
    </section>
  );
}

function AccountPrompt({ acct, onAnswer }) {
  const multi = acct.kind === "card" || acct.kind === "savings";
  return (
    <div className="ap-imp-ask">
      <p><b>{acct.label}</b> shows up in {acct.count} transaction{acct.count > 1 ? "s" : ""}. Does it belong to your household?</p>
      <div className="ap-imp-askbtns">
        {multi ? (
          <>
            <button onClick={() => onAnswer({ ours: true, statements: true })}>Ours, we upload its statements</button>
            <button onClick={() => onAnswer({ ours: true, statements: false })}>Ours, no statements</button>
          </>
        ) : <button onClick={() => onAnswer({ ours: true })}>Yes, it's ours</button>}
        <button onClick={() => onAnswer({ ours: false })}>Not ours</button>
      </div>
      {acct.kind === "card" && <p className="ap-imp-fine">With statements, payments to this card are skipped and its purchases come from its own statement. Without, each payment is logged as the expense.</p>}
      {acct.kind === "savings" && <p className="ap-imp-fine">With statements, transfers are counted from that savings statement. Without, they're counted from this one.</p>}
    </div>
  );
}

function CatPicker({ valueLabel, options, frequent, extras, onPick, ariaLabel, other }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const ql = q.trim().toLowerCase();
  const rank = (o) => { const i = frequent.indexOf(o); return i < 0 ? 99 : i; };
  const top = ql ? [] : frequent.filter((o) => options.includes(o));
  const rest = options.filter((o) => (ql ? o.toLowerCase().includes(ql) : !top.includes(o)));
  if (ql) rest.sort((a, b) => rank(a) - rank(b));
  // other = { type, label, options }: the opposite direction's categories, shown underneath and in search results
  const otherMatches = other ? other.options.filter((o) => (ql ? o.toLowerCase().includes(ql) : true)) : [];
  const pick = (v) => { onPick(v); setOpen(false); setQ(""); };
  const item = (v, label, cls) => <li key={cls + v} className={cls} onMouseDown={(e) => { e.preventDefault(); pick(v); }}>{label}</li>;
  return (
    <div className="ap-combo ap-catpick">
      <input type="text" className={valueLabel ? "" : "empty"} value={open ? q : valueLabel} placeholder="Type to find a category…" aria-label={ariaLabel}
        onFocus={() => { setOpen(true); setQ(""); }} onChange={(e) => { setQ(e.target.value); setOpen(true); }}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
        onKeyDown={(e) => { if (e.key === "Enter" && ql && (rest[0] || otherMatches[0])) { pick(rest[0] || `${other.type}::${otherMatches[0]}`); e.target.blur(); } if (e.key === "Escape") { setOpen(false); e.target.blur(); } }} />
      {open && (
        <ul className="ap-combo-list">
          {top.length > 0 && <li className="hd">Most used</li>}
          {top.map((o) => item(o, o, "t"))}
          {top.length > 0 && rest.length > 0 && <li className="hd">All categories</li>}
          {rest.map((o) => item(o, o, ""))}
          {otherMatches.length > 0 && <li className="hd">{other.label}</li>}
          {otherMatches.map((o) => item(`${other.type}::${o}`, o, "o"))}
          {ql && rest.length === 0 && otherMatches.length === 0 && <li className="none">No category matches “{q}”</li>}
          <li className="hd">Other</li>
          {extras.map(([v, l]) => item(v, l, "x"))}
        </ul>
      )}
    </div>
  );
}

function PhotoEdit({ c, editRow }) {
  const shown = c.needsAmount ? "" : (Math.abs(c.amount) / 100).toFixed(2);
  const [amt, setAmt] = useState(shown);
  useEffect(() => { setAmt(shown); }, [c.amount, c.needsAmount]);
  // read what's in the box right now (not React state), so Return right after typing always counts
  const commitAmt = (raw) => { const v = Math.round(parseFloat(String(raw).replace(/[^0-9.]/g, "")) * 100); if (v > 0) editRow(c.id, { abs: v }); else setAmt(shown); };
  return (
    <div className="ap-imp-photoedit">
      <input type="text" value={c.desc} onChange={(e) => editRow(c.id, { desc: e.target.value })} aria-label="Store or description" />
      <input type="date" value={c.date} onChange={(e) => e.target.value && editRow(c.id, { date: e.target.value })} aria-label="Date" />
      <input type="text" inputMode="decimal" onFocus={selectAll} value={amt} placeholder="amount" className={c.needsAmount ? "missing" : ""} onChange={(e) => setAmt(e.target.value)} onBlur={(e) => commitAmt(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }} aria-label="Amount" />
      <button className="ap-imp-dir" onClick={() => editRow(c.id, { dir: c.dir === "out" ? "in" : "out" })} title="Switch between money out and money in">{c.dir === "out" ? "Money out ⇄" : "Money in ⇄"}</button>
    </div>
  );
}

function ReviewRow({ c, ctx, setOv, pickFor, markBetween, addCategory, frequent, editRow }) {
  const isMain = c.kind === "expense" || c.kind === "income";
  const type = c.dir === "out" ? "Expenses" : "Income";
  const value = c.userSkip ? (c.rememberSkip ? "__skipall" : "__skip") : c.category ? `${c.type}::${c.category}` : "";
  const onPick = (v) => {
    if (!v) return;
    if (v === "__skip") return setOv(c.id, { userSkip: true, rememberSkip: false });   // same as the Remove button
    if (v === "__skipall") return pickFor(c, { userSkip: true, rememberSkip: true });
    if (v === "__between") return markBetween(c.person);
    if (v === "__new") { const name = addCategory(type); if (name) pickFor(c, { type, category: name, userSkip: false, rememberSkip: false }); return; }
    const [t, cat] = v.split("::");
    pickFor(c, { type: t, category: cat, userSkip: false, rememberSkip: false });
  };
  const tag = c.source === "learned" ? "remembered" : c.source === "keyword" ? "matched by name" : c.source === "user" ? "your pick" : null;
  const savCat = SI.rowSavingsCategory(c, ctx);

  return (
    <div className={"ap-imp-row" + (c.dupOf ? " dup" : "")}>
      <div className="ap-imp-rowmain">
        <span className="d mono">{shortDate(c.date)}</span>
        <span className="m" title={c.desc}>{c.merchant}{c.memo && <span className="memo"> “{c.memo}”</span>}</span>
        <span className={"a mono " + (c.amount < 0 ? "out" : "in")}>{c.needsAmount ? "?" : (c.amount < 0 ? "−" : "+") + centsFmt(c.amount)}</span>
        <button className="ap-imp-remove" onClick={() => setOv(c.id, { userSkip: true, rememberSkip: false })}
          aria-label={`Remove ${c.merchant}`} title={c.fromPhoto ? "Not a real transaction? Remove it" : "Don't import this one"}>Remove</button>
      </div>
      {c.fromPhoto ? <PhotoEdit c={c} editRow={editRow} /> : <div className="ap-imp-raw" title={c.desc}>{c.desc}</div>}
      {c.amountHint && <div className="ap-imp-check">{Math.abs(c.amountHint) === Math.abs(c.amount)
        ? `The balances on the screenshot say this was money ${c.amountHint < 0 ? "out" : "in"}.`
        : `The balances on the screenshot say this should be ${fmt2(Math.abs(c.amountHint) / 100)}.`} <button className="ap-imp-link" onClick={() => editRow(c.id, { abs: Math.abs(c.amountHint), dir: c.amountHint < 0 ? "out" : "in" })}>{Math.abs(c.amountHint) === Math.abs(c.amount) ? `Make it money ${c.amountHint < 0 ? "out" : "in"}` : `Use ${fmt2(Math.abs(c.amountHint) / 100)}`}</button></div>}
      {c.fromBalance && <div className="ap-imp-why">Amount worked out from the running balances on the screenshot.</div>}
      {c.signGuess && <div className="ap-imp-why">The + / − sign wasn't readable, so this is assumed to be money {c.dir === "out" ? "out" : "in"}. Tap the direction button if that's wrong.</div>}
      {(c.fx || c.feeMerged > 0) && <div className="ap-imp-why">{c.fx}{c.fx && c.feeMerged ? " · " : ""}{c.feeMerged > 0 && `includes ${fmt2(c.feeMerged / 100)} foreign fee`}</div>}

      {isMain && (
        <div className="ap-imp-pickrow">
          <CatPicker ariaLabel={`Category for ${c.merchant}`}
            valueLabel={c.userSkip ? (c.rememberSkip ? "Don't import (always)" : "Don't import") : (value ? c.category : "")}
            options={ctx.categories[type]} frequent={(frequent && frequent[type]) || []}
            extras={[["__new", "New category…"], ...(c.person ? [["__between", "Money between us (skip)"]] : []), ["__skip", "Don't import"], ...(c.key && !c.person ? [["__skipall", "Don't import, always skip this"]] : [])]}
            other={c.fromPhoto ? { type: type === "Expenses" ? "Income" : "Expenses", label: type === "Expenses" ? "Income categories (makes it money in)" : "Expense categories (makes it money out)", options: ctx.categories[type === "Expenses" ? "Income" : "Expenses"] } : null}
            onPick={(v) => onPick(v.startsWith("__") || v.includes("::") ? v : `${type}::${v}`)} />
          {tag && <span className="ap-imp-tag">{tag}</span>}
        </div>
      )}

      {c.savingsDelta !== 0 && (
        <div className="ap-imp-pickrow">
          <span className="ap-imp-savnote">{c.savingsDelta < 0 ? "Out of savings" : "Into savings"} {fmt2(Math.abs(c.savingsDelta) / 100)} as</span>
          <select className={savCat ? "" : "empty"} value={savCat || ""} onChange={(e) => e.target.value && setOv(c.id, { savingsCat: e.target.value })} aria-label="Savings category">
            <option value="">Choose…</option>
            {ctx.categories.Savings.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
          {c.kind === "savings-only" && c.person == null && (
            <select className="ap-imp-mini" value="" onChange={(e) => { if (e.target.value === "__skip") setOv(c.id, { userSkip: true }); }} aria-label="More options">
              <option value="">More</option><option value="__skip">Don't import</option>
            </select>
          )}
        </div>
      )}

      {c.dupOf && !c.userSkip && (
        <div className="ap-imp-dupbox">
          <span>Already logged: {c.dupOf.category} {fmt2(Math.abs(c.dupOf.amount))} on {shortDate(c.dupOf.date)}{c.dupOf.note ? ` (${c.dupOf.note})` : ""}</span>
          <div className="ap-imp-askbtns">
            <button className={c.dupDecision === "keep" ? "on" : ""} onClick={() => setOv(c.id, { dupDecision: "keep" })}>Import anyway</button>
            <button onClick={() => setOv(c.id, { dupDecision: "skip" })}>Skip it</button>
          </div>
        </div>
      )}
    </div>
  );
}

function ImportHistory({ imports, undoImport }) {
  if (!imports.length) return <div className="ap-imp-body"><p className="ap-empty">No statements imported yet.</p></div>;
  return (
    <div className="ap-imp-body">
      {imports.map((i) => (
        <div key={i.id} className="ap-imp-hist">
          <div>
            <b>{i.kind === "photo" ? `${i.label} (read from photos)` : `${i.label} ····${i.acct}`}</b>
            <div className="ap-imp-fine">{fmtRange(i.start, i.end)} · {i.count} entries · imported {i.at.slice(0, 10)} by {i.by}</div>
          </div>
          <button className="ap-imp-secondary" onClick={() => { if (confirm(`Undo the ${i.label} ····${i.acct} import? Its ${i.count} entries are removed, including any edits made to them since.`)) undoImport(i.id); }}>Undo</button>
        </div>
      ))}
    </div>
  );
}

function ImportRules({ imp, categories, updateImporter }) {
  const rules = Object.entries(imp.rules).sort((a, b) => a[0].localeCompare(b[0]));
  const accounts = Object.entries(imp.accounts);
  const people = Object.entries(imp.people);
  const describe = (r) => r.action === "skip" ? "Always skipped" : `${r.category} (${r.type === "Expenses" ? "expense" : r.type === "Income" ? "income" : "savings"})`;
  const kwKey = (t, c) => `${t}::${c}`;
  return (
    <div className="ap-imp-body">
      <section className="ap-imp-group">
        <h3>Category keywords</h3>
        <p className="ap-imp-hint">Words that point to a category when a merchant is new, separated by commas. Example for Gas: marathon, shell, exxon.</p>
        {["Expenses", "Income"].map((t) => (categories[t] || []).map((c) => (
          <label key={kwKey(t, c)} className="ap-imp-kw">
            <span>{c}</span>
            <input type="text" defaultValue={(imp.keywords[kwKey(t, c)] || []).join(", ")} placeholder="keywords"
              onBlur={(e) => { const list = e.target.value.split(",").map((x) => x.trim()).filter(Boolean);
                updateImporter((m) => { if (list.length) m.keywords[kwKey(t, c)] = list; else delete m.keywords[kwKey(t, c)]; }); }} />
          </label>
        )))}
      </section>

      <section className="ap-imp-group">
        <h3>Remembered merchants <span className="n">{rules.length}</span></h3>
        {rules.length === 0 && <p className="ap-empty">Merchants you categorize during an import appear here.</p>}
        {rules.map(([k, r]) => (
          <div key={k} className="ap-imp-rule">
            <span className="k mono">{k}</span><span className="v">{describe(r)}</span>
            <button className="ap-rowbtn del" aria-label={`Forget ${k}`} onClick={() => updateImporter((m) => { delete m.rules[k]; })}>×</button>
          </div>
        ))}
      </section>

      <section className="ap-imp-group">
        <h3>Known accounts</h3>
        {accounts.length === 0 && <p className="ap-empty">Accounts appear here after your first import.</p>}
        {accounts.map(([id, a]) => (
          <div key={id} className="ap-imp-rule">
            <span className="k">{SI.acctLabel(id, a.kind, a)}</span>
            <span className="v">{!a.ours ? "Not ours" : a.statements ? "Ours, statements uploaded" : a.kind === "checking" ? "Ours" : "Ours, no statements"}{a.savingsCategory ? ` · ${a.savingsCategory}` : ""}</span>
            <button className="ap-rowbtn del" aria-label={`Forget ${id}`} onClick={() => { if (confirm("Forget this account? You'll be asked about it again on the next import.")) updateImporter((m) => { delete m.accounts[id]; }); }}>×</button>
          </div>
        ))}
      </section>

      {people.length > 0 && (
        <section className="ap-imp-group">
          <h3>People in the household</h3>
          {people.map(([n]) => (
            <div key={n} className="ap-imp-rule">
              <span className="k">{n}</span><span className="v">Zelle with them is skipped</span>
              <button className="ap-rowbtn del" aria-label={`Forget ${n}`} onClick={() => updateImporter((m) => { delete m.people[n]; })}>×</button>
            </div>
          ))}
        </section>
      )}
    </div>
  );
}


/* ================= BACKUPS ================= */
function BackupsSheet({ listBackups, saveNow, restoreBackup, downloadCopy, onClose }) {
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const load = async () => { setErr(""); try { setRows(await listBackups()); } catch (e) { setErr("Couldn't load backups. Check your connection."); setRows([]); } };
  useEffect(() => { load(); }, []);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape" && !busy) onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [busy, onClose]);
  const when = (iso) => { const d = new Date(iso); return d.toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }); };
  return (
    <div className="ap-imp-overlay" role="dialog" aria-modal="true" aria-label="Backups">
      <div className="ap-imp-sheet">
        <header className="ap-imp-head">
          <div>
            <h2 className="ap-imp-title">Backups</h2>
            <p className="ap-imp-sub">A copy of the whole budget is saved once a day and before every import, undo, reset or restore.</p>
          </div>
          <div className="ap-imp-headbtns"><button className="ap-imp-close" onClick={onClose} aria-label="Close">×</button></div>
        </header>
        <div className="ap-imp-body">
          <div className="ap-imp-footbtns" style={{ marginBottom: 14 }}>
            <button className="ap-imp-primary" disabled={busy} onClick={async () => { setBusy(true); await saveNow(); await load(); setBusy(false); }}>Save a copy now</button>
            <button className="ap-imp-secondary" onClick={downloadCopy}>Download a copy</button>
          </div>
          {err && <div className="ap-imp-warn">{err}</div>}
          {rows === null && <p className="ap-imp-fine">Loading…</p>}
          {rows && rows.length === 0 && !err && <p className="ap-empty">No backups yet. The first one is saved the next time the app opens.</p>}
          {rows && rows.map((r) => (
            <div key={r.id} className="ap-imp-hist">
              <div>
                <b>{when(r.at)}</b>
                <div className="ap-imp-fine">{r.label}{r.by ? ` · ${r.by}` : ""}{r.entries != null ? ` · ${r.entries} records` : ""}</div>
              </div>
              <button className="ap-imp-secondary" disabled={busy} onClick={async () => {
                if (!confirm(`Restore the budget to how it was on ${when(r.at)}? The current version is backed up first, so you can undo this.`)) return;
                setBusy(true); const ok = await restoreBackup(r.id); setBusy(false);
                if (ok) onClose(); else setErr("Couldn't restore that backup.");
              }}>Restore</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

      padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--paper2);align-items:center;}
    .ap-txntable td{display:block;border:none;padding:0;min-width:0;}
    .ap-txntable td:nth-child(1){grid-area:date;font-size:11.5px;}
    .ap-txntable td:nth-child(2){display:none;}
    .ap-txntable td:nth-child(3){grid-area:cat;}
    .ap-txntable td:nth-child(4){grid-area:note;font-size:12.5px;overflow:hidden;}
    .ap-txntable td:nth-child(5){grid-area:bkt;}
    .ap-txntable td:nth-child(6){grid-area:amt;}
    .ap-txntable td:nth-child(7){grid-area:act;}
    .ap-txntable tr.editing{grid-template-columns:1fr;grid-template-areas:none;}
    .ap-txntable tr.editing td{grid-area:auto !important;display:block !important;}
    .ap-txntable td[colspan]{grid-column:1/-1;grid-area:auto;}
    .ap-rowbtn.del .lbl{display:inline;}
    .ap-rowbtn.del .x{display:none;}
    .ap-rowbtn{padding:6px 11px;}
  }

/* ================= AUTH ================= */
function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const submit = async () => {
    setErr("");
    if (!email || !pw) { setErr("Enter your email and password."); return; }
    if (mode==="signup" && pw.length<6) { setErr("Password must be at least 6 characters."); return; }
    setBusy(true);
    try {
      if (mode==="signup") {
        const { error } = await sb.auth.signUp({ email: email.trim(), password: pw });
        if (error) throw error;
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (error) throw error;
      }
    } catch (e) { setErr((e && e.message) || "Something went wrong."); }
    finally { setBusy(false); }
  };
  return (
    <>
      <Styles/>
      <div className="ap-auth-wrap">
        <div className="ap-auth">
          <div className="ap-auth-k">Family Budget</div>
          <h1>Ramirez Rojas <span className="ap-heart">♥</span> 💵</h1>
          <p className="sub">{mode==="signup" ? "Create your account to start budgeting together." : "Sign in to your family budget."}</p>
          {err && <div className="err">{err}</div>}
          <label>Email</label>
          <input type="email" placeholder="you@email.com" value={email} autoComplete="email"
            onChange={(e)=>setEmail(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&submit()}/>
          <label>Password</label>
          <input type="password" placeholder="••••••••" value={pw} autoComplete={mode==="signup"?"new-password":"current-password"}
            onChange={(e)=>setPw(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&submit()}/>
          <button className="go" onClick={submit} disabled={busy}>{busy ? "Please wait…" : (mode==="signup"?"Create account":"Sign in")}</button>
          <div className="toggle">
            {mode==="signup" ? "Already have an account? " : "New here? "}
            <button onClick={()=>{ setMode(mode==="signup"?"signin":"signup"); setErr(""); }}>{mode==="signup"?"Sign in":"Create one"}</button>
          </div>
        </div>
      </div>
    </>
  );
}

function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => { try { sub.subscription.unsubscribe(); } catch (e) {} };
  }, []);
  if (session === undefined) return <div className="ap-root"><Styles/><p className="ap-loading">Loading…</p></div>;
  if (!session) return <AuthScreen/>;
  const email = (session.user.email||"").toLowerCase();
  if (!ALLOWED.includes(email)) {
    return (
      <>
        <Styles/>
        <div className="ap-auth-wrap"><div className="ap-auth" style={{textAlign:"center"}}>
          <h1 style={{fontSize:24}}>Access restricted</h1>
          <p className="sub">This account isn't authorized for the Ramirez Rojas budget.</p>
          <button className="go" onClick={()=>sb.auth.signOut()}>Sign out</button>
        </div></div>
      </>
    );
  }
  return <App session={session} onSignOut={async ()=>{ await sb.auth.signOut(); setSession(null); }}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

</script>
