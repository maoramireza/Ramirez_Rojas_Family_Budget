            <input className="ap-renamein" value={draft} aria-label={`Rename ${name}`} onChange={(e) => setDraft(e.target.value)}
              onBlur={rename} onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); if (e.key === "Escape") setDraft(name); }} />
            <button className="ap-del" onClick={onRemove} title="Remove category">Remove</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---- sheet shell shared by the planning sheets ---- */
function Sheet({ title, sub, onClose, children, foot, label }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    const prev = document.body.style.overflow; document.body.style.overflow = "hidden";
    document.addEventListener("keydown", onKey);
    return () => { document.body.style.overflow = prev; document.removeEventListener("keydown", onKey); };
  }, [onClose]);
  return (
    <div className="ap-imp-overlay" role="dialog" aria-modal="true" aria-label={label || title}>
      <div className="ap-imp-sheet ap-psheet">
        <header className="ap-imp-head">
          <div><h2 className="ap-imp-title">{title}</h2>{sub && <p className="ap-imp-sub">{sub}</p>}</div>
          <div className="ap-imp-headbtns"><button className="ap-imp-close" onClick={onClose} aria-label="Close">×</button></div>
        </header>
        <div className="ap-imp-body">{children}</div>
        {foot && <div className="ap-psheet-foot">{foot}</div>}
      </div>
    </div>
  );
}

/* ---- "Plan <month> from…": fill a month from a past budget or past spending, with a preview you can adjust ---- */
function StartFromSheet({ state, period, idx, auto, applyPlan, onClose, onDone }) {
  const months = period.months, first = months[0];
  const target = months.length === 1 ? monthLabel(first) : period.label;
  const budgeted = budgetedMonths(state).filter((k) => !months.includes(k)).slice().reverse();
  const prev = addMonths(first, -1), ly = addMonths(first, -12);
  const [src, setSrc] = useState("budget");
  const [bm, setBm] = useState(budgeted.find((k) => k < first) || budgeted[0] || "");
  const [keep, setKeep] = useState(true);
  const [busy, setBusy] = useState(false);
  const spending = src !== "budget";
  const SOURCES = [
    ["budget", "A month's budget", "Copies what you planned"],
    ["spent1", `What happened in ${monthLabel(prev)}`, "Actual spending and income"],
    ["avg3", "Average of the last 3 months", "Actual spending and income"],
    ["avg6", "Average of the last 6 months", "Actual spending and income"],
    ["lastyear", `Same month last year (${monthLabel(ly)})`, "Actual spending and income"],
  ];
  const srcVal = (t, c) => src === "budget" ? (bm ? planFor(state, t, c, bm) : 0)
    : src === "spent1" ? Math.round(idx.get(t, c, prev)) : src === "avg3" ? idx.avg(t, c, first, 3) : src === "avg6" ? idx.avg(t, c, first, 6) : Math.round(idx.get(t, c, ly));
  const srcShort = src === "budget" ? (bm ? `${MLABEL[+bm.slice(5) - 1]} budget` : "") : src === "spent1" ? `${MLABEL[+prev.slice(5) - 1]} actual` : src === "avg3" ? "3-mo avg" : src === "avg6" ? "6-mo avg" : `${monthLabel(ly)} actual`;
  const current = (t, c) => { const vals = months.map((k) => planFor(state, t, c, k)); return vals.every((v) => v === vals[0]) ? vals[0] : null; };
  const groupOf = (t, c) => t === "Expenses" ? { fixed: "Bills", flex: "Everyday", nonmonthly: "Non-monthly" }[kindOf(state, c, auto)] : t;

  const rows = useMemo(() => {
    const out = [];
    TYPES.forEach((t) => state.categories[t].forEach((c) => {
      const cur = current(t, c), sv = srcVal(t, c), group = groupOf(t, c);
      const sc = scheduled(state, t, c, first);
      let proposed, why;
      if (sc) { proposed = cur != null ? cur : sc.auto; why = t === "Income" ? "from paydays" : "from its schedule"; }
      else if (spending && keep && group === "Bills" && cur > 0) { proposed = cur; why = "bill, kept"; }
      else if (spending && !(sv > 0) && cur > 0) { proposed = cur; why = "nothing recorded, kept"; }
      else { proposed = sv; why = sv > 0 ? srcShort : ""; }
      out.push({ id: t + "|" + c, t, c, group, cur, sv, proposed, why, fixedSched: !!sc, avg: idx.avg(t, c, first, 3) });
    }));
    return out;
  }, [src, bm, keep]);
  const [sel, setSel] = useState({});
  useEffect(() => { const s = {}; rows.forEach((r) => { s[r.id] = { on: r.proposed > 0, amt: r.proposed > 0 ? String(r.proposed) : "" }; }); setSel(s); }, [rows]);
  const [open, setOpen] = useState({});
  const val = (r) => { const s = sel[r.id]; if (!s || !s.on) return 0; const v = parseFloat(String(s.amt).replace(/[^0-9.]/g, "")); return v > 0 ? Math.round(v * 100) / 100 : 0; };
  const toggle = (r) => setSel((m) => { const s = m[r.id] || { on: false, amt: "" }; const on = !s.on; const sug = r.proposed || r.avg || r.cur || ""; return { ...m, [r.id]: { on, amt: on && !s.amt ? (sug ? String(sug) : "") : s.amt } }; });
  const setAmt = (r, v) => setSel((m) => ({ ...m, [r.id]: { on: true, amt: v } }));
  const changes = rows.filter((r) => sel[r.id] && (r.cur == null ? !(r.fixedSched && val(r) === r.proposed) : val(r) !== r.cur));
  const sum = (t) => rows.filter((r) => r.t === t).reduce((a, r) => a + val(r), 0);
  const left = Math.round((sum("Income") - sum("Expenses") - sum("Savings")) * 100) / 100;
  const apply = async () => {
    setBusy(true);
    await applyPlan(months, changes.map((r) => ({ type: r.t, cat: r.c, amount: val(r) })), `Before planning ${target}`);
    setBusy(false);
    onDone(`Planned ${target}: ${changes.length} ${changes.length === 1 ? "category" : "categories"} updated. A backup was saved first.`);
  };

  const GROUPS = ["Income", "Bills", "Everyday", "Non-monthly", "Savings"];
  const visible = (r) => r.cur > 0 || r.proposed > 0 || (sel[r.id] && sel[r.id].on);
  // A plain function (not a component) so typing in an amount never re-creates the input and drops focus.
  const rowEl = (r) => {
    const s = sel[r.id] || { on: false, amt: "" };
    const removed = !s.on && r.cur > 0;
    const bits = [r.cur == null ? "Now: varies" : r.cur > 0 ? `Now ${fmt(r.cur)}` : "Not budgeted now"];
    if (r.why && s.on) bits.push(r.why);
    if (spending && r.why !== srcShort && r.sv > 0) bits.push(`${srcShort} ${fmt(r.sv)}`);
    if (!spending && r.avg > 0) bits.push(`avg ${fmt(r.avg)}`);
    return (
      <div key={r.id} className={"ap-sf-row" + (s.on ? "" : " off")}>
        <label className="ap-sf-name">
          <input type="checkbox" checked={s.on} onChange={() => toggle(r)} aria-label={`Include ${r.c}`} />
          <span><b>{r.c}</b>
            <span className="ap-sf-sub">{removed ? <span className="rm">Will be removed from {target} (now {fmt(r.cur)})</span> : bits.join(" · ")}</span></span>
        </label>
        <div className="ap-amtwrap">
          <span className="cur">$</span>
          <input type="text" inputMode="decimal" onFocus={selectAll} value={s.amt} placeholder={r.avg ? String(r.avg) : "0"} aria-label={`Amount for ${r.c}`}
            onChange={(e) => setAmt(r, e.target.value)} />
        </div>
      </div>
    );
  };

  return (
    <Sheet title={`Plan ${target}`} label="Plan from" onClose={onClose}
      sub="Pick where to start. Nothing changes until you tap Apply, and a backup is saved first."
      foot={<>
        <div className="ap-sf-tot">
          <span>Income <b className="mono">{fmt(sum("Income"))}</b></span>
          <span>Expenses <b className="mono">{fmt(sum("Expenses"))}</b></span>
          <span>Savings <b className="mono">{fmt(sum("Savings"))}</b></span>
          <span className={Math.round(left) === 0 ? "ok" : left < 0 ? "neg" : ""}>To allocate <b className="mono">{fmt(left)}</b></span>
        </div>
        <div className="ap-imp-footbtns">
          <button className="ap-imp-secondary" onClick={onClose}>Cancel</button>
          <button className="ap-imp-primary" disabled={busy || !changes.length} onClick={apply}>
            {changes.length ? `Apply ${changes.length} change${changes.length === 1 ? "" : "s"}` : "No changes"}</button>
        </div>
      </>}>
      <div className="ap-sf-sources" role="radiogroup" aria-label="Start from">
        {SOURCES.map(([k, label, hint]) => (
          <label key={k} className={"ap-sf-src" + (src === k ? " on" : "")}>
            <input type="radio" name="sf-src" checked={src === k} onChange={() => setSrc(k)} />
            <span><b>{label}</b><span className="ap-sf-sub">{hint}</span>
              {k === "budget" && src === "budget" && (
                <select value={bm} onChange={(e) => setBm(e.target.value)} disabled={!budgeted.length} aria-label="Month to copy">
                  {budgeted.length ? budgeted.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>) : <option value="">No budgeted months yet</option>}
                </select>)}
            </span>
          </label>
        ))}
      </div>
      {spending && <label className="ap-sf-keep"><input type="checkbox" checked={keep} onChange={(e) => setKeep(e.target.checked)} /> Keep bills at their current amounts (a late or skipped bill would throw off past spending)</label>}
      <p className="ap-imp-fine" style={{ margin: "0 0 12px" }}>Untick a category to leave it out of {target}. Categories with nothing planned are under “Show” in each group, ready to add.</p>
      {GROUPS.map((g) => {
        const list = rows.filter((r) => r.group === g); if (!list.length) return null;
        const shown = list.filter(visible), hidden = list.filter((r) => !visible(r));
        return (
          <div key={g} className="ap-sf-group">
            <h3>{g} <span className="mono">{fmt(list.reduce((a, r) => a + val(r), 0))}</span></h3>
            {shown.map(rowEl)}
            {hidden.length > 0 && (
              <>
                <button className="ap-linkbtn ap-sf-more" onClick={() => setOpen((o) => ({ ...o, [g]: !o[g] }))}>
                  {open[g] ? "Hide" : "Show"} {hidden.length} with nothing planned</button>
                {open[g] && hidden.map(rowEl)}
              </>
            )}
          </div>
        );
      })}
    </Sheet>
  );
}

/* ---- a category's kind and schedule: bill / everyday / non-monthly, or paydays for income ---- */
function CatSheet({ state, type, cat, first, auto, setCatMeta, onClose, onDone }) {
  const meta = metaOf(state, type, cat) || {};
  const shift = incomeShiftDays(state);
  const startOpts = [0, 1, 2, 3, 4, 5, 6].map((n) => addMonths(first, n));
  const detected = useMemo(() => type === "Income" ? PlanKit.detectPay(state.entries.filter((e) => e.type === "Income" && e.category === cat), localToday()) : null, []);
  // non-monthly: which months had spending in the last 12, and the typical amount
  const history = useMemo(() => {
    if (type !== "Expenses") return null;
    const byM = {};
    state.entries.forEach((e) => { if (e.type === "Expenses" && e.category === cat && e.date) { const k = countsMonth(e, state); if (k < first && k >= addMonths(first, -12)) byM[k] = (byM[k] || 0) + e.amount; } });
    const ks = Object.keys(byM); if (!ks.length) return null;
    const amts = ks.map((k) => byM[k]).sort((a, b) => a - b);
    return { months: [...new Set(ks.map((k) => +k.slice(5)))].sort((a, b) => a - b), amount: Math.round(amts[Math.floor(amts.length / 2)]) };
  }, []);

  const [kind, setKind] = useState(meta.kind || "auto");
  const s0 = meta.sched || {};
  const [months, setMonths] = useState(s0.months || []);
  const [amount, setAmount] = useState(s0.amount ? String(s0.amount) : "");
  const [mode, setMode] = useState(s0.mode || "due");
  const p0 = meta.pay || {};
  const [freq, setFreq] = useState(p0.freq || "");
  const [anchor, setAnchor] = useState(p0.anchor || (detected && detected.anchor) || "");
  const [day, setDay] = useState(p0.day || (detected && detected.day) || 1);
  const [payAmt, setPayAmt] = useState(p0.amount ? String(p0.amount) : "");
  const [since, setSince] = useState((type === "Income" ? p0.since : s0.since) || first);
  const [err, setErr] = useState("");
  const num = (v) => { const n = parseFloat(String(v).replace(/[^0-9.]/g, "")); return n > 0 ? Math.round(n * 100) / 100 : 0; };
  const eff = kind === "auto" ? (auto[cat] || "flex") : kind;
  const pay = freq ? { freq, anchor: freq === "biweekly" ? anchor : undefined, day: freq === "monthly" ? +day : undefined, amount: num(payAmt), since } : null;
  const sched = eff === "nonmonthly" ? { months, amount: num(amount), mode, since } : null;

  const save = () => {
    setErr("");
    if (type === "Income") {
      if (pay && pay.freq === "biweekly" && !/^\d{4}-\d{2}-\d{2}$/.test(pay.anchor || "")) return setErr("Pick the date of a recent payday.");
      if (pay && !pay.amount) return setErr("Enter the amount of one paycheck.");
      const next = { ...meta }; if (pay) next.pay = pay; else delete next.pay;
      setCatMeta(type, cat, Object.keys(next).length ? next : null);
      return onDone(pay ? `${cat}: paydays set (${PAY_LABEL[pay.freq].toLowerCase()}, ${fmt2(pay.amount)} each), starting ${monthLabel(since)}.` : `${cat}: paydays removed. It uses a regular monthly amount again.`);
    }
    if (eff === "nonmonthly" && (!months.length || !num(amount))) return setErr("Pick the month(s) it's due and the amount each time.");
    const next = { ...meta };
    if (kind === "auto") delete next.kind; else next.kind = kind;
    if (eff === "nonmonthly") next.sched = sched; else delete next.sched;
    setCatMeta(type, cat, Object.keys(next).length ? next : null);
    onDone(eff === "nonmonthly" ? `${cat}: non-monthly, ${schedText(sched)}, starting ${monthLabel(since)}.` : `${cat} is now listed under ${eff === "fixed" ? "Bills" : "Everyday"}.`);
  };

  const preview = (type === "Income" && pay && (pay.freq !== "biweekly" || /^\d{4}-\d{2}-\d{2}$/.test(pay.anchor || "")))
    ? [0, 1, 2, 3, 4, 5].map((n) => addMonths(since, n)).map((k) => ({ k, days: PlanKit.paydays(pay, k, shift) })) : null;
  const nextThree = preview && pay.freq === "biweekly" ? Array.from({ length: 24 }, (_, n) => addMonths(since, n)).find((k) => PlanKit.paydays(pay, k, shift).length > 2) : null;

  return (
    <Sheet title={cat} sub={type === "Income" ? "When does this money arrive?" : "What kind of cost is this?"} onClose={onClose}
      foot={<div className="ap-imp-footbtns"><button className="ap-imp-secondary" onClick={onClose}>Cancel</button><button className="ap-imp-primary" onClick={save}>Save</button></div>}>
      {err && <div className="ap-imp-warn" style={{ marginBottom: 12 }}>{err}</div>}
      {type === "Expenses" && (<>
        <div className="ap-choice" role="radiogroup" aria-label="Kind">
          {[["auto", `Let the app decide (${KIND_LABEL[auto[cat] || "flex"]})`], ["fixed", "Bill"], ["flex", "Everyday"], ["nonmonthly", "Non-monthly"]].map(([k, l]) => (
            <button key={k} className={kind === k ? "on" : ""} onClick={() => setKind(k)} role="radio" aria-checked={kind === k}>{l}</button>))}
        </div>
        <p className="ap-imp-fine">Bills are about the same every month (mortgage, phone, subscriptions). Everyday costs change (groceries, restaurants). Non-monthly costs come a few times a year.</p>
        {eff === "nonmonthly" && (
          <div className="ap-cs-block">
            {history && <button className="ap-imp-secondary" style={{ marginBottom: 10 }} onClick={() => { setMonths(history.months); setAmount(String(history.amount)); }}>
              Use last 12 months: {monthsText(history.months)} · about {fmt(history.amount)}</button>}
            <div className="ap-cs-label">Due in</div>
            <div className="ap-monthchips">
              {MLABEL.map((l, i) => { const m = i + 1, on = months.includes(m); return (
                <button key={l} className={on ? "on" : ""} aria-pressed={on} onClick={() => setMonths(on ? months.filter((x) => x !== m) : [...months, m].sort((a, b) => a - b))}>{l}</button>); })}
            </div>
            <div className="ap-cs-row">
              <span className="ap-cs-label">Amount each time</span>
              <div className="ap-amtwrap"><span className="cur">$</span><input type="text" inputMode="decimal" onFocus={selectAll} value={amount} onChange={(e) => setAmount(e.target.value)} aria-label="Amount each time" /></div>
            </div>
            <div className="ap-cs-label">How to budget it</div>
            <label className="ap-cs-radio"><input type="radio" checked={mode === "due"} onChange={() => setMode("due")} /> In the months it's due{num(amount) && months.length ? ` (${fmt(num(amount))} in ${monthsText(months)})` : ""}</label>
            <label className="ap-cs-radio"><input type="radio" checked={mode === "spread"} onChange={() => setMode("spread")} /> Set a little aside every month{num(amount) && months.length ? ` (${fmt2(PlanKit.schedAmount({ months, amount: num(amount), mode: "spread" }, first))}/mo)` : ""}</label>
            {mode === "spread" && <p className="ap-imp-fine">The Dashboard shows how much has been set aside since the last time it was due.</p>}
            <div className="ap-cs-row"><span className="ap-cs-label">Starting</span>
              <select value={since} onChange={(e) => setSince(e.target.value)}>{startOpts.map((k) => <option key={k} value={k}>{monthLabel(k)}</option>)}</select></div>
            <p className="ap-imp-fine">Months before that keep the budget they have.</p>
          </div>
        )}
      </>)}
      {type === "Income" && (<>
        {detected && !meta.pay && (
          <div className="ap-cs-detect">
            From your deposits: <b>{PAY_LABEL[detected.freq].toLowerCase()}</b>{detected.anchor ? `, last on ${shortDay(detected.anchor)}` : ""}, about <b>{fmt2(detected.amount)}</b> ({detected.count} deposits).
            <button className="ap-linkbtn" onClick={() => { setFreq(detected.freq); if (detected.anchor) setAnchor(detected.anchor); if (detected.day) setDay(detected.day); setPayAmt(String(detected.amount)); }}>Use this</button>
          </div>
        )}
        <div className="ap-choice" role="radiogroup" aria-label="Paydays">
          {[["", "No schedule"], ["biweekly", "Every 2 weeks"], ["semimonthly", "Twice a month"], ["monthly", "Once a month"]].map(([k, l]) => (
            <button key={k || "none"} className={freq === k ? "on" : ""} onClick={() => setFreq(k)} role="radio" aria-checked={freq === k}>{l}</button>))}
        </div>
        {!freq && <p className="ap-imp-fine">Without a schedule, this category uses the monthly amount you type, like any other.</p>}
        {freq && (
          <div className="ap-cs-block">
            {freq === "biweekly" && <div className="ap-cs-row"><span className="ap-cs-label">A recent payday</span><input type="date" value={anchor} onChange={(e) => setAnchor(e.target.value)} /></div>}
            {freq === "semimonthly" && <p className="ap-imp-fine">Paid on the 15th and the last day of the month.</p>}
            {freq === "monthly" && <div className="ap-cs-row"><span className="ap-cs-label">Day of the month</span>
              <select value={day} onChange={(e) => setDay(+e.target.value)}>{Array.from({ length: 31 }, (_, i) => i + 1).map((d) => <option key={d} value={d}>{d === 31 ? "Last day" : d}</option>)}</select></div>}
            {freq !== "biweekly" && <p className="ap-imp-fine">A payday on a Saturday or Sunday is counted on the Friday before.</p>}
            <div className="ap-cs-row"><span className="ap-cs-label">Each paycheck</span>
              <div className="ap-amtwrap"><span className="cur">$</span><input type="text" inputMode="decimal" onFocus={selectAll} value={payAmt} onChange={(e) => setPayAmt(e.target.value)} aria-label="Each paycheck" /></div></div>
            <div className="ap-cs-row"><span className="ap-cs-label">Starting</span>
              <select value={since} onChange={(e) => setSince(e.target.value)}>{startOpts.map((k) => <option key={k} value={k}>{monthLabel(k)}</option>)}</select></div>
            <p className="ap-imp-fine">{shift ? `Paychecks in the last ${shift === 1 ? "day" : shift + " days"} of a month count toward the next month (setting below the Income list).` : "Every paycheck counts toward the month it arrives in."} Months before the start keep their budget.</p>
            {preview && (
              <div className="ap-cs-preview">
                {preview.map(({ k, days }) => (
                  <div key={k} className={days.length > 2 ? "three" : ""}><span>{monthLabel(k)}</span>
                    <span>{days.length} payday{days.length === 1 ? "" : "s"}{days.length ? ` · ${days.map(shortDay).join(", ")}` : ""}</span>
                    <b className="mono">{fmt(days.length * num(payAmt))}</b></div>))}
                {nextThree && <div className="three"><span>{monthLabel(nextThree)}</span><span>Next month with 3 paychecks. It's planned automatically.</span><b className="mono">{fmt(3 * num(payAmt))}</b></div>}
              </div>
            )}
          </div>
        )}
      </>)}
    </Sheet>
  );
}

function Transactions({ state, period, editEntry, deleteEntry, importTxns, setBucketForEntry, openImport }) {
  const [q, setQ] = useState("");
  const [ftype, setFtype] = useState("All");
  const [fcat, setFcat] = useState("All");
  const [fsrc, setFsrc] = useState("all");   // all | typed | imported | <account last 4>
  const [editId, setEditId] = useState(null);
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);
  const buckets = Object.keys(state.buckets || {});

  const norm = (s)=> (s==null?"":String(s)).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const catOptions = useMemo(()=>{
    const base = ftype==="All"
      ? [...state.categories.Income, ...state.categories.Expenses, ...state.categories.Savings]
      : [...(state.categories[ftype]||[])];
    const fromEntries = state.entries.filter((e)=> ftype==="All"||e.type===ftype).map((e)=>e.category);
    return [...new Set([...base, ...fromEntries])].sort((a,b)=>a.localeCompare(b));
  }, [state, ftype]);

  const nq = norm(q);
  const accounts = (state.importer && state.importer.accounts) || {};
  const acctIds = [...new Set(state.entries.map((e)=>e.src?.acct).filter(Boolean))].sort();
  const srcOk = (x) => fsrc==="all" ? true : fsrc==="typed" ? !x.importId : fsrc==="imported" ? !!x.importId : x.src?.acct===fsrc;
  const list = state.entries
    .filter((x)=> period.inRange(x.date))
    .filter(srcOk)
    .filter((x)=> ftype==="All" ? true : x.type===ftype)
    .filter((x)=> fcat==="All" ? true : x.category===fcat)
    .filter((x)=> nq==="" ? true : (norm(x.category).includes(nq) || norm(x.note).includes(nq) || norm(x.name).includes(nq)))
    .slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);

  const net = list.reduce((a,b)=> b.type==="Income"?a+b.amount:b.type==="Expenses"?a-b.amount:a, 0);
  const allCats = (t) => state.categories[t] || [];

  const exportCsv = () => {
    const rows = state.entries.slice().sort((a,b)=> a.date<b.date?1:-1)
      .map((e)=>({ Date:e.date, Type:e.type, Category:e.category, Amount:e.amount, Note:e.note||e.name||"", Bucket:e.bucket||"" }));
    const csv = Papa.unparse(rows.length?rows:[{Date:"",Type:"",Category:"",Amount:"",Note:"",Bucket:""}]);
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "budget-transactions.csv"; a.click();
  };

  const onFile = (ev) => {
    const f = ev.target.files?.[0]; if (!f) return;
    Papa.parse(f, { header:true, skipEmptyLines:true, complete:(res)=>{
      const valid = []; let skipped = 0;
      res.data.forEach((row)=>{
        const get = (k)=>{ const kk = Object.keys(row).find((x)=>x.toLowerCase().trim()===k); return kk ? String(row[kk]).trim() : ""; };
        const date = get("date"); let type = get("type"); const category = get("category");
        const amount = parseFloat(String(get("amount")).replace(/[$,]/g,"")); const note = get("note"); const bucket = get("bucket");
        type = TYPES.find((t)=>t.toLowerCase()===type.toLowerCase());
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !type || !category || !amount || (amount<0 && type!=="Savings")) { skipped++; return; }
        valid.push({ id: uid(), date, type, category, amount: Math.round(amount*100)/100, note, bucket: bucket||undefined });
      });
      if (valid.length) importTxns(valid);
      setMsg(`Imported ${valid.length} record${valid.length===1?"":"s"}${skipped?`, skipped ${skipped} invalid`:""}.`);
      setTimeout(()=>setMsg(""), 5000);
      ev.target.value = "";
    }});
  };

  const [more, setMore] = useState(false);
  const [limit, setLimit] = useState(150);
  useEffect(() => setLimit(150), [q, ftype, fcat, fsrc, period.from, period.to]);
  const sign = (x) => ((x.type === "Income") !== (x.amount < 0) ? 1 : -1);
  const days = [];
  list.slice(0, limit).forEach((x) => { const last = days[days.length - 1]; if (last && last.date === x.date) last.items.push(x); else days.push({ date: x.date, items: [x] }); });
  const dayNet = (d) => d.items.reduce((a, x) => a + (x.type === "Savings" ? 0 : sign(x) * Math.abs(x.amount)), 0);
  const money = (v) => (v < 0 ? "−" : "+") + fmt2(Math.abs(v));
  const edit = editId ? state.entries.find((x) => x.id === editId) : null;
  const filtersOn = fcat !== "All" || fsrc !== "all";

  return (
    <section className="ap-track2">
      <div className="ap-tbar">
        <input className="ap-search" type="text" placeholder="Search category or note…" value={q} onChange={(e)=>setQ(e.target.value)} aria-label="Search transactions"/>
        <button className="ap-iobtn strong" onClick={openImport}>Import</button>
        <button className={"ap-iobtn" + (more || filtersOn ? " on" : "")} onClick={() => setMore(!more)} aria-expanded={more} aria-label="More filters and tools">⋯</button>
      </div>
      <div className="ap-pills" role="radiogroup" aria-label="Type">
        {["All", ...TYPES].map((t) => <button key={t} className={ftype === t ? "on" : ""} role="radio" aria-checked={ftype === t} onClick={() => { setFtype(t); setFcat("All"); }}>{t}</button>)}
      </div>
      {more && (
        <div className="ap-tmore">
          <select value={fcat} onChange={(e)=>setFcat(e.target.value)} aria-label="Category">
            <option value="All">All categories</option>
            {catOptions.map((c)=>(<option key={c} value={c}>{c}</option>))}
          </select>
          <select value={fsrc} onChange={(e)=>setFsrc(e.target.value)} aria-label="Source">
            <option value="all">All sources</option>
            <option value="typed">Typed by hand</option>
            <option value="imported">From statements</option>
            {acctIds.map((id)=>(<option key={id} value={id}>{SI.acctLabel(id, accounts[id]?.kind, accounts[id])}</option>))}
          </select>
          <button className="ap-iobtn" onClick={exportCsv}>Export CSV</button>
          <button className="ap-iobtn" onClick={()=>fileRef.current?.click()}>Import CSV</button>
        </div>
      )}
      <input ref={fileRef} type="file" accept=".csv,text/csv" style={{display:"none"}} onChange={onFile}/>
      {msg && <div className="ap-importmsg">{msg}</div>}

      <div className="ap-dcard ap-tlist">
        {days.map((d) => { const dn = dayNet(d); return (
          <React.Fragment key={d.date}>
            <div className="ap-tday"><span>{niceDate(d.date)}</span><span>{Math.round(dn * 100) ? money(dn) : ""}</span></div>
            {d.items.map((x) => (
              <button key={x.id} className="ap-trow" onClick={() => setEditId(x.id)}>
                <span className="nm">
                  <span className="t">{x.category}{x.bucket && <em className="ap-cnt" style={{ marginLeft: 6 }}>{x.bucket}</em>}{x.date && countsMonth(x, state) !== x.date.slice(0,7) && <span className="ap-countsin">counts in {MLABEL[+countsMonth(x, state).slice(5)-1]}</span>}</span>
                  {(x.note || x.name || (x.src && x.src.raw)) && <span className="sub">{x.note || x.name || x.src.raw}</span>}
                </span>
                <span className={"amt " + x.type.toLowerCase()}>{x.type === "Savings" ? fmt2(Math.abs(x.amount)) : money(sign(x) * Math.abs(x.amount))}</span>
              </button>
            ))}
          </React.Fragment>); })}
        {list.length > limit && <button className="ap-dgroup" onClick={() => setLimit(limit + 300)}><span className="nm">Show more</span><span className="amt">{list.length - limit} more</span></button>}
        {list.length===0 && <p className="ap-empty">{state.entries.length ? `No transactions in ${period.label} match. Try All time at the top.` : "No transactions yet. Log one from Home."}</p>}
      </div>
      {list.length > 0 && <div className="ap-tfoot">{list.length} transaction{list.length === 1 ? "" : "s"} in {period.label} · net <b style={{color:net>=0?"var(--emerald)":"var(--clay)"}}>{fmt(net)}</b></div>}

      {edit && (
        <Sheet title="Edit transaction" label="Edit transaction" onClose={() => setEditId(null)}
          foot={<div className="ap-imp-footbtns">
            <button className="ap-imp-secondary ap-tdel" onClick={() => { deleteEntry(edit.id); setEditId(null); }}>Delete</button>
            <button className="ap-imp-primary ap-tdone" onClick={() => setEditId(null)}>Done</button></div>}>
          <div className="ap-tedit">
            <label>Amount<div className="ap-amtwrap"><span className="cur">$</span>
              <MoneyInput className="amt" value={Math.abs(edit.amount)} commit="blur" keepIfEmpty ariaLabel="Amount" onValue={(v)=>{ if (v > 0) editEntry(edit.id,{amount:v}); }}/></div></label>
            <label>Date<input type="date" value={edit.date} onChange={(e)=>e.target.value && editEntry(edit.id,{date:e.target.value})}/></label>
            <label>Type<select value={edit.type} onChange={(e)=>{const t=e.target.value; editEntry(edit.id,{type:t, category: allCats(t).includes(edit.category)?edit.category:(allCats(t)[0]||edit.category)});}}>
              {TYPES.map((t)=>(<option key={t}>{t}</option>))}</select></label>
            <label>Category<select value={edit.category} onChange={(e)=>editEntry(edit.id,{category:e.target.value})}>
              {[...new Set([...allCats(edit.type), edit.category])].map((c)=>(<option key={c}>{c}</option>))}</select></label>
            <label className="wide">Note<input type="text" placeholder="Note (optional)" value={edit.note||edit.name||""} onChange={(e)=>editEntry(edit.id,{note:e.target.value})}/></label>
            {buckets.length > 0 && <label>Bucket<select value={edit.bucket||""} onChange={(e)=>setBucketForEntry(edit.id, e.target.value||undefined)}>
              <option value="">No bucket</option>{buckets.map((b)=>(<option key={b} value={b}>{b}</option>))}</select></label>}
            {edit.type==="Income" && edit.date && <label className="wide">Counts toward
              <select value={edit.budgetMonth||"auto"} onChange={(e)=>editEntry(edit.id,{budgetMonth: e.target.value==="auto"?undefined:e.target.value})}>
                <option value="auto">Automatic</option>
                <option value="same">{monthLabel(edit.date.slice(0,7))}</option>
                <option value="next">{monthLabel(addMonths(edit.date.slice(0,7),1))}</option>
              </select></label>}
            {edit.src && edit.src.raw && <p className="ap-imp-fine wide">From {edit.src.photo ? "a photo" : "a statement"}: <span className="mono">{edit.src.raw}</span></p>}
          </div>
        </Sheet>
      )}
    </section>
  );
}

const niceDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); const t = new Date(y, m - 1, d);
  return t.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) + (y !== new Date().getFullYear() ? `, ${y}` : ""); };

/* ================= YEAR ================= */
function useWidth(fallback) {
  const ref = useRef(null);
  const [w, setW] = useState(fallback);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const measure = () => setW(Math.max(280, Math.round(el.getBoundingClientRect().width)));
    measure();
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(measure) : null;
    if (ro) ro.observe(el); else window.addEventListener("resize", measure);
    return () => { if (ro) ro.disconnect(); else window.removeEventListener("resize", measure); };
  }, []);
  return [ref, w];
}
/* ================= CHARTS (drawn by hand: nothing extra to load) ================= */
const C_BLUE = "#2a78d6", C_RED = "#e34948", C_GRAY = "#9b9a93", C_GRID = "#e1e0d9", C_BASE = "#c3c2b7";
function niceTicks(min, max, count) {
  const span = (max - min) || 1, raw = span / (count || 4), p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * p).find((x) => x >= raw);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 100) / 100);
  return { lo, hi: hi === lo ? lo + step : hi, t };
}
const tickMoney = (v) => (v < 0 ? "−" : "") + "$" + (Math.abs(v) >= 1000 ? (+(Math.abs(v) / 1000).toFixed(1)) + "k" : Math.round(Math.abs(v)));
const signed = (v) => (v < 0 ? "−" : "+") + fmt(Math.abs(v));
// Touch or hover a chart to read one month; the reading stays until you touch elsewhere.
function useChartPick(n, padL, gw) {
  const [act, setAct] = useState(null);
  // The touch area starts where the plot starts, so position within it maps straight to a month.
  const pick = (e) => { const r = e.currentTarget.getBoundingClientRect(); const i = Math.floor((e.clientX - r.left) / gw); setAct(i >= 0 && i < n ? i : null); };
  const leave = (e) => { if (e.pointerType === "mouse") setAct(null); };
  return [act, { onPointerMove: pick, onPointerDown: pick, onPointerLeave: leave }];
}
function ChartTip({ children }) {
  return <div className="ap-ctip" aria-live="polite">{children}</div>;
}

// By month: what was left over each month. Up and blue = came out ahead, down and red = spent more than came in,
// dashed outline = the month isn't finished (or its statements aren't all imported), so it isn't final.
function NetChart({ rows }) {
  const [box, W] = useWidth(700);
  const H = 190, padL = 46, padR = 8, padT = 12, padB = 24;
  const iw = W - padL - padR, ih = H - padT - padB, gw = iw / Math.max(1, rows.length);
  const [act, handlers] = useChartPick(rows.length, padL, gw);
  const vals = rows.map((r) => (r.has ? r.net : 0));
  const { lo, hi, t } = niceTicks(Math.min(0, ...vals), Math.max(1, ...vals), 3);
  const y = (v) => padT + ih * (1 - (v - lo) / (hi - lo));
  const bw = Math.max(4, Math.min(22, gw * 0.56)), every = Math.max(1, Math.ceil(30 / gw));
  const bar = (cx, v) => {
    const y0 = y(0), y1 = y(v), x0 = cx - bw / 2, x1 = cx + bw / 2, r = Math.min(4, bw / 2, Math.abs(y1 - y0));
    if (Math.abs(y1 - y0) < 0.5) return "";
    return v >= 0 ? `M${x0},${y0}V${y1 + r}Q${x0},${y1} ${x0 + r},${y1}H${x1 - r}Q${x1},${y1} ${x1},${y1 + r}V${y0}Z`
                  : `M${x0},${y0}V${y1 - r}Q${x0},${y1} ${x0 + r},${y1}H${x1 - r}Q${x1},${y1} ${x1},${y1 - r}V${y0}Z`;
  };
  const r = act != null ? rows[act] : null;
  return (
    <div ref={box} className="ap-chartbox">
      <ChartTip>{r && r.has ? <><b>{monthLabel(r.key)}{r.unfinished ? " so far" : ""}</b><span>left over <b>{signed(r.net)}</b></span><span>in {fmt(r.inc)} · out {fmt(r.exp)}</span></>
        : <span className="hint">Touch a month to see its numbers</span>}</ChartTip>
      <svg width={W} height={H} style={{ display: "block", maxWidth: "100%", touchAction: "pan-y" }} role="img"
        aria-label={"What was left over each month: " + rows.filter((x) => x.has).map((x) => `${x.label} ${signed(x.net)}`).join(", ")}>
        {t.map((v) => <g key={v}>
          <line x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} stroke={v === 0 ? C_BASE : C_GRID} strokeWidth={v === 0 ? 1.5 : 1} />
          <text x={padL - 7} y={y(v) + 4} textAnchor="end" fontSize="11" fill="#898781" fontFamily="Archivo">{tickMoney(v)}</text></g>)}
        {rows.map((x, i) => { const cx = padL + gw * (i + 0.5); const dim = act != null && act !== i; return (
          <g key={x.key} opacity={dim ? 0.4 : 1}>
            {x.has && <path d={bar(cx, x.net)} fill={x.unfinished ? "none" : x.net >= 0 ? C_BLUE : C_RED}
              stroke={x.unfinished ? C_GRAY : "none"} strokeWidth="1.5" strokeDasharray={x.unfinished ? "3 3" : undefined} />}
            {i % every === 0 && <text x={cx} y={H - 7} textAnchor="middle" fontSize="11" fill="#898781" fontFamily="Archivo">{x.label}</text>}
          </g>); })}
        <rect x={padL} y={0} width={iw} height={H} fill="transparent" {...handlers} />
      </svg>

    </div>
  );
}

// Trends: one category month by month. This year is the strong line; last year dashed gray; the budget a faint dotted line.
function TrendChart({ labels, cur, prev, budget, curYear, prevYear }) {
  const [box, W] = useWidth(700);
  const H = 210, padL = 46, padR = 12, padT = 12, padB = 24;
  const iw = W - padL - padR, ih = H - padT - padB, gw = iw / labels.length;
  const [act, handlers] = useChartPick(labels.length, padL, gw);
  const hasPrev = prev.some((v) => v > 0), hasBud = budget.some((v) => v > 0);
  const all = [...cur.filter((v) => v != null), ...(hasPrev ? prev : []), ...(hasBud ? budget : [])];
  const { lo, hi, t } = niceTicks(0, Math.max(1, ...all), 4);
  const x = (i) => padL + gw * (i + 0.5), y = (v) => padT + ih * (1 - (v - lo) / (hi - lo));
  const line = (arr) => { let d = "", pen = false; arr.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; }); return d; };
  const lastI = cur.reduce((a, v, i) => (v != null ? i : a), -1);
  const firstI = cur.findIndex((v) => v != null);
  const area = lastI >= 0 ? line(cur) + `L${x(lastI)},${y(0)}L${x(firstI)},${y(0)}Z` : "";
  const every = Math.max(1, Math.ceil(30 / gw));
  return (
    <div ref={box} className="ap-chartbox">
      {(() => { const i = act != null ? act : lastI; return i < 0 ? <ChartTip><span className="hint">Touch a month to see its numbers</span></ChartTip> : (
        <ChartTip><b>{labels[i]}</b><span>{curYear} <b>{cur[i] == null ? "—" : fmt(cur[i])}</b></span>
          {hasPrev && <span>{prevYear} {fmt(prev[i])}</span>}{hasBud && <span>budget {fmt(budget[i])}</span>}</ChartTip>); })()}
      <svg width={W} height={H} style={{ display: "block", maxWidth: "100%", touchAction: "pan-y" }} role="img"
        aria-label={`${curYear} by month: ` + cur.map((v, i) => (v == null ? null : `${labels[i]} ${fmt(v)}`)).filter(Boolean).join(", ")}>
        {t.map((v) => <g key={v}>
          <line x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} stroke={v === 0 ? C_BASE : C_GRID} strokeWidth="1" />
          <text x={padL - 7} y={y(v) + 4} textAnchor="end" fontSize="11" fill="#898781" fontFamily="Archivo">{tickMoney(v)}</text></g>)}
        {labels.map((l, i) => i % every === 0 && <text key={l} x={x(i)} y={H - 7} textAnchor="middle" fontSize="11" fill="#898781" fontFamily="Archivo">{l}</text>)}
        {hasBud && <path d={line(budget)} fill="none" stroke={C_GRAY} strokeWidth="1" strokeDasharray="1 3" strokeLinecap="round" />}
        {hasPrev && <path d={line(prev)} fill="none" stroke={C_GRAY} strokeWidth="1.5" strokeDasharray="5 4" strokeLinejoin="round" />}
        {area && <path d={area} fill={C_BLUE} opacity="0.1" />}
        <path d={line(cur)} fill="none" stroke={C_BLUE} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {lastI >= 0 && act == null && <circle cx={x(lastI)} cy={y(cur[lastI])} r="4.5" fill={C_BLUE} stroke="#fff" strokeWidth="2" />}
        {act != null && <g>
          <line x1={x(act)} x2={x(act)} y1={padT} y2={H - padB} stroke={C_BASE} strokeWidth="1" />
          {hasPrev && <circle cx={x(act)} cy={y(prev[act])} r="3.5" fill={C_GRAY} stroke="#fff" strokeWidth="1.5" />}
          {cur[act] != null && <circle cx={x(act)} cy={y(cur[act])} r="4.5" fill={C_BLUE} stroke="#fff" strokeWidth="2" />}
        </g>}
        <rect x={padL} y={0} width={iw} height={H} fill="transparent" {...handlers} />
      </svg>

    </div>
  );
}

function Year({ state, period, goMonth, setMonthClosed }) {
  // One month picked at the top: show the year up to that month, so there's something to compare.
  const single = period.months.length === 1;
  const ms = single ? monthsBetween(period.months[0].slice(0, 4) + "-01", period.months[0]) : period.months;
  const msKey = ms.join(",");
  const multiYear = ms[0].slice(0, 4) !== ms[ms.length - 1].slice(0, 4);
  const thisMonth = localToday().slice(0, 7);
  const inR = useMemo(() => { const set = new Set(ms); return state.entries.filter((e) => e.date && set.has(countsMonth(e, state))); }, [state, msKey]);
  const rows = useMemo(() => ms.map((key) => {
    const ent = inR.filter((e) => countsMonth(e, state) === key);
    const sum = (t) => ent.filter((e) => e.type === t).reduce((a, e) => a + e.amount, 0);
    const inc = sum("Income"), exp = sum("Expenses"), sav = sum("Savings");
    const budget = state.categories.Expenses.reduce((a, c) => a + planFor(state, "Expenses", c, key), 0);
    const gaps = statementGaps(state, key);
    const cats = {}; ent.filter((e) => e.type === "Expenses").forEach((e) => { cats[e.category] = (cats[e.category] || 0) + e.amount; });
    return { key, label: MLABEL[+key.slice(5) - 1] + (multiYear ? " ’" + key.slice(2, 4) : ""), inc, exp, sav, budget, gaps,
      unfinished: gaps.length > 0 || (key >= thisMonth && !isClosed(state, key)), closed: isClosed(state, key), net: inc - exp, has: inc > 0 || exp > 0, count: ent.length,
      top: Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 5) };
  }), [state, msKey, inR]);
  const tot = rows.reduce((a, r) => ({ inc: a.inc + r.inc, exp: a.exp + r.exp }), { inc: 0, exp: 0 });
  const net = tot.inc - tot.exp;
  const catMap = {}, bucketMap = {};
  inR.filter((e) => e.type === "Expenses").forEach((e) => { catMap[e.category] = (catMap[e.category] || 0) + e.amount; if (e.bucket) bucketMap[e.bucket] = (bucketMap[e.bucket] || 0) + e.amount; });
  const topCats = Object.entries(catMap).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const topBuckets = Object.entries(bucketMap).sort((a, b) => b[1] - a[1]);
  const [open, setOpen] = useState({});
  const tog = (k) => setOpen((o) => ({ ...o, [k]: !o[k] }));
  const list = rows.filter((r) => r.has).slice().reverse();
  const shown = open.older ? list : list.slice(0, 4);
  const title = single ? `${ms[0].slice(0, 4)} through ${MLABEL[+ms[ms.length - 1].slice(5) - 1]}` : period.label;
  const dotOf = (r) => (r.unfinished ? "dash" : r.net >= 0 ? "ahead" : "behind");
  if (!list.length) return <section className="ap-hero"><div className="ap-hero-lbl">{title}</div><p className="ap-empty" style={{ margin: "8px 0 0" }}>No transactions logged yet.</p></section>;
  return (
    <>
      <section className="ap-hero">
        <div className="ap-hero-lbl">{title} · {net >= 0 ? "came out ahead" : "spent more than came in"}</div>
        <div className={"ap-hero-val" + (net < 0 ? " neg" : "")}>{signed(net)}</div>
        <div className="ap-tiles">
          <div><span>Money in</span><b>{fmt(tot.inc)}</b></div>
          <div><span>Money out</span><b>{fmt(tot.exp)}</b></div>
        </div>
        <div className="ap-ckeys">
          <span><i style={{ background: C_BLUE }} />Came out ahead</span>
          <span><i style={{ background: C_RED }} />Spent more than came in</span>
          {rows.some((r) => r.has && r.unfinished) && <span><i className="dash" />Not finished yet</span>}
        </div>
        <NetChart rows={rows} />
      </section>

      <div className="ap-dcard">
        {shown.map((r) => (
          <div key={r.key} className={"ap-mrow" + (open["m" + r.key] ? " open" : "")}>
            <button className="ap-drow-main" onClick={() => tog("m" + r.key)} aria-expanded={!!open["m" + r.key]}>
              <i className={"ap-dot " + dotOf(r)} aria-hidden="true" />
              <span className="mlbl">{r.label}</span>
              <span className="nm ap-msub">In {fmt(r.inc)} · Out {fmt(r.exp)}</span>
              <span className={"amt" + (r.net < 0 && !r.unfinished ? " neg" : "")}>{signed(r.net)}</span>
            </button>
            {open["m" + r.key] && (
              <div className="ap-drow-more">
                <div className="ap-drow-fact">{r.budget ? <>Spent {fmt(r.exp)} of {fmt(r.budget)} budgeted · {r.budget - r.exp >= 0 ? `${fmt(r.budget - r.exp)} under` : `${fmt(r.exp - r.budget)} over`}</> : <>Spent {fmt(r.exp)}, no budget set</>}</div>
                {r.gaps.length > 0 && <div className="ap-drow-fact">Not imported yet: {r.gaps.map((g) => gapLabel(state, g)).join("; ")}</div>}
                {r.top.length > 0 && <ul className="ap-mtop">{r.top.map(([c, v]) => <li key={c}><span>{c}</span><span>{fmt(v)}</span></li>)}</ul>}
                <div className="ap-mrow-actions">
                  <button className="ap-linkbtn" onClick={() => goMonth(r.key)}>Open {monthLabel(r.key)} on Home</button>
                  {setMonthClosed && (r.closed
                    ? <button className="ap-linkbtn" onClick={() => setMonthClosed(r.key, false)}>Reopen (marked finished)</button>
                    : r.unfinished && <button className="ap-imp-secondary" onClick={() => setMonthClosed(r.key, true)}>Mark as finished</button>)}
                </div>
              </div>
            )}
          </div>
        ))}
        {list.length > 4 && <FoldRow dot="idle" label={open.older ? "Show fewer" : `${list.length - 4} earlier month${list.length - 4 === 1 ? "" : "s"}`} value="" open={!!open.older} onToggle={() => tog("older")} />}
      </div>

      <div className="ap-dcard">
        <FoldRow dot="flex" label="Top categories" value={topCats.length ? `${topCats[0][0]} ${fmt(topCats[0][1])}` : "none"} open={!!open.cats} onToggle={() => tog("cats")} />
        {open.cats && <ul className="ap-mtop ap-mtop-card">{topCats.map(([c, v]) => <li key={c}><span>{c}</span><span>{fmt(v)}</span></li>)}</ul>}
        {topBuckets.length > 0 && <>
          <FoldRow dot="idle" label="Top buckets" value={`${topBuckets.length}`} open={!!open.bk} onToggle={() => tog("bk")} />
          {open.bk && <ul className="ap-mtop ap-mtop-card">{topBuckets.map(([c, v]) => <li key={c}><span>{c}</span><span>{fmt(v)}</span></li>)}</ul>}
        </>}
      </div>
    </>
  );
}

/* ================= TRENDS ================= */
function Trends({ state, archives, period, currentYear, endYear, restoreYear }) {
  const allEntries = useMemo(() => {
    const seen = new Set(state.entries.map((e) => e.id));
    const extra = [];
    (archives || []).forEach((a) => (a.state?.entries || []).forEach((e) => { if (!seen.has(e.id)) { seen.add(e.id); extra.push(e); } }));
    return [...state.entries, ...extra];
  }, [state, archives]);
  const ALL = "All expenses";
  const cats = useMemo(() => {
    const tot = {}; allEntries.forEach((e) => { if (e.type === "Expenses" && e.category) tot[e.category] = (tot[e.category] || 0) + e.amount; });
    return [...new Set([...state.categories.Expenses, ...Object.keys(tot)])].sort((a, b) => (tot[b] || 0) - (tot[a] || 0));
  }, [allEntries, state.categories]);
  const [cat, setCat] = useState(ALL);
  const [showYears, setShowYears] = useState(false);
  const is = (e) => e.type === "Expenses" && (cat === ALL || e.category === cat);
  const yr = +period.to.slice(0, 4), prevYr = yr - 1;
  const thisMonth = localToday().slice(0, 7);
  const byMonth = useMemo(() => {
    const m = {}; allEntries.forEach((e) => { if (e.date && is(e)) { const k = countsMonth(e, state); m[k] = (m[k] || 0) + e.amount; } }); return m;
  }, [allEntries, cat, state.settings]);
  const key = (y, i) => `${y}-${String(i + 1).padStart(2, "0")}`;
  const lastI = yr < +thisMonth.slice(0, 4) ? 11 : yr > +thisMonth.slice(0, 4) ? -1 : +thisMonth.slice(5) - 1;
  const cur = MLABEL.map((_, i) => (i <= lastI ? Math.round(byMonth[key(yr, i)] || 0) : null));
  const prev = MLABEL.map((_, i) => Math.round(byMonth[key(prevYr, i)] || 0));
  const plan = (k) => (cat === ALL ? state.categories.Expenses.reduce((a, c) => a + planFor(state, "Expenses", c, k), 0) : planFor(state, "Expenses", cat, k));
  const budget = MLABEL.map((_, i) => Math.round(plan(key(yr, i))));
  // The number up top: this category over the dates picked at the top, against the same dates a year earlier.
  const inWin = (e, from, to) => { const d = countsDate(e, state); return d && d >= from && d <= to; };
  const v = allEntries.filter((e) => is(e) && inWin(e, period.from, period.to)).reduce((a, e) => a + e.amount, 0);
  const pFrom = shiftYear(period.from, -1), pTo = shiftYear(period.to, -1);
  const pv = allEntries.filter((e) => is(e) && inWin(e, pFrom, pTo)).reduce((a, e) => a + e.amount, 0);
  const delta = pv > 0 ? Math.round(((v - pv) / pv) * 100) : null;
  const ytd = cur.reduce((a, x) => a + (x || 0), 0), ytdPrev = prev.slice(0, lastI + 1).reduce((a, x) => a + x, 0);
  const ytdPct = ytdPrev > 0 ? Math.round(((ytd - ytdPrev) / ytdPrev) * 100) : null;
  const nMonths = lastI + 1, avg = nMonths > 0 ? ytd / nMonths : 0, budAvg = nMonths > 0 ? budget.slice(0, nMonths).reduce((a, x) => a + x, 0) / nMonths : 0;
  const hasPrev = prev.some((x) => x > 0), hasBud = budget.some((x) => x > 0);
  const pct = (p) => p == null ? null : <em className={p > 0 ? "worse" : "better"}>{p > 0 ? "+" : ""}{p}%</em>;
  return (
    <section className="ap-trends">
      <section className="ap-hero">
        <div className="ap-trend-top">
          <select value={cat} onChange={(e) => setCat(e.target.value)} aria-label="Category">
            <option value={ALL}>{ALL}</option>
            {cats.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
          <span className="ap-hero-lbl" style={{ letterSpacing: 0, textTransform: "none" }}>{hasPrev ? `${yr} vs ${prevYr}` : yr}</span>
        </div>
        <div className="ap-trend-hero">
          <span className="ap-hero-val">{fmt(v)}</span>
          <span className="lbl">in {period.label}</span>
          {delta != null && <span className={"chg " + (delta > 0 ? "worse" : "better")}>{delta > 0 ? "↑" : "↓"} {Math.abs(delta)}% vs {pFrom.slice(0, 4) === pTo.slice(0, 4) && isWholeMonths(period) && period.months.length === 1 ? monthLabel(pFrom.slice(0, 7)) : "a year earlier"}</span>}
        </div>
        <div className="ap-ckeys">
          <span><i className="line" />{yr}</span>
          {hasPrev && <span><i className="line prev" />{prevYr}</span>}
          {hasBud && <span><i className="line bud" />Budget</span>}
        </div>
        {lastI >= 0 ? <TrendChart labels={MLABEL} cur={cur} prev={prev} budget={budget} curYear={yr} prevYear={prevYr} />
          : <p className="ap-empty">{yr} hasn't started yet.</p>}
        <div className="ap-tiles">
          <div><span>Year so far</span><b>{fmt(ytd)}{pct(ytdPct)}</b></div>
          <div><span>Monthly average</span><b>{fmt(avg)}{hasBud && <em className="of">of {fmt(budAvg)}</em>}</b></div>
        </div>
        {!hasPrev && <p className="ap-hero-notes">Once there's spending from {prevYr}, it shows as a dashed line to compare.</p>}
      </section>

      <div className="ap-dcard">
        <FoldRow dot="idle" label="Manage years" value={archives && archives.length ? `${archives.length} archived` : ""} open={showYears} onToggle={() => setShowYears(!showYears)} />
        {showYears && <div className="ap-dhint">
          Archiving saves this year's plan and starts {currentYear + 1} fresh. Transactions are never deleted, and you can restore a year any time.
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10 }}>
            <button className="ap-archivebtn" onClick={endYear}>Archive {currentYear} and start {currentYear + 1}</button>
            {(archives || []).slice().sort((a, b) => b.year - a.year).map((a) => (
              <button key={a.year} className="ap-restorebtn" onClick={() => restoreYear(a.year)}>Restore {a.year}</button>))}
          </div>
        </div>}
      </div>
    </section>
  );
}

/* ================= SPLIT ================= */
function Split({ state, period, setSplit }) {
  const planAmt = (c) => planSum(state, "Expenses", c, period.months);
  const cats = state.categories.Expenses.filter((c)=>planAmt(c)>0).sort((a,b)=>planAmt(b)-planAmt(a));
  const split = state.split || {};
  // Mao's percent share (0-100). Backward compatible with old "mao"/"ingrid"/"split" values.
  const pctOf = (c) => { const v=split[c];
    if (v===undefined || v==="split") return 50;
    if (v==="mao") return 100; if (v==="ingrid") return 0;
    const n=Number(v); return isNaN(n)?50:Math.max(0,Math.min(100,Math.round(n))); };

  let mao = 0, ingrid = 0;
  cats.forEach((c)=>{ const a=planAmt(c); const p=pctOf(c); mao += a*p/100; ingrid += a*(100-p)/100; });
  const total = mao + ingrid;
  const half = total/2;
  const diff = mao - half;
  const maoPct = total>0 ? Math.round(mao/total*100) : 50;
  const ingridPct = 100 - maoPct;

  // Which bills show on their own line is fixed when the tab opens, so a row doesn't jump away while you adjust it.
  const snap = useRef({ key: null, set: new Set() });
  const sk = period.from + period.to + cats.length;
  if (snap.current.key !== sk) snap.current = { key: sk, set: new Set(cats.filter((c) => pctOf(c) !== 50)) };
  const special = cats.filter((c) => snap.current.set.has(c)), even = cats.filter((c) => !snap.current.set.has(c));
  const [openEven, setOpenEven] = useState(false);
  return (
    <section className="ap-split">
      <section className="ap-hero">
        <div className="ap-hero-lbl">Who covers {period.label}'s budget</div>
        <div className="ap-splithero">
          <div><span>Mao</span><b>{fmt(mao)}</b></div>
          <div className="r"><span>Ingrid</span><b>{fmt(ingrid)}</b></div>
        </div>
        {total > 0 && <div className="ap-splitbar"><div className="m" style={{ width: maoPct + "%" }} /><div className="i" style={{ width: ingridPct + "%" }} /></div>}
        <div className="ap-hero-notes">{total <= 0 ? "No budgeted expenses yet. Set budgets in Planning first."
          : Math.abs(diff) < 0.5 ? `Split evenly: ${fmt(half)} each.`
          : `${diff > 0 ? "Mao" : "Ingrid"} covers ${fmt(Math.abs(diff))} more than half (${maoPct}% / ${ingridPct}%).`}</div>
      </section>
      {total > 0 && <div className="ap-dcard">
        {special.map((c) => <SplitLine key={c} cat={c} amount={planAmt(c)} pct={pctOf(c)} onSet={(p) => setSplit(c, p)} />)}
        {even.length > 0 && <FoldRow dot="idle" label="Split evenly" value={`${even.length} · ${fmt(even.reduce((a, c) => a + planAmt(c), 0))}`} open={openEven} onToggle={() => setOpenEven(!openEven)} />}
        {openEven && even.map((c) => <SplitLine key={c} cat={c} amount={planAmt(c)} pct={pctOf(c)} onSet={(p) => setSplit(c, p)} />)}
      </div>}
      {total > 0 && <p className="ap-tfoot">Tap a bill to change who pays it, for example a 60/40 mortgage.</p>}
    </section>
  );
}
function SplitLine({ cat, amount, pct, onSet }) {
  const [open, setOpen] = useState(false);
  const label = pct === 100 ? "Mao" : pct === 0 ? "Ingrid" : pct === 50 ? "50 / 50" : `${pct} / ${100 - pct}`;
  return (
    <div className={"ap-drow" + (open ? " open" : "")}>
      <button className="ap-drow-main" onClick={() => setOpen(!open)} aria-expanded={open}>
        <span className="nm">{cat}</span><span className="amt">{fmt(amount)}</span><span className="ap-splitpill">{label}</span>
      </button>
      {open && <div className="ap-drow-more"><SplitRow cat={cat} amount={amount} pct={pct} onSet={onSet} bare /></div>}
    </div>
  );
}

function SplitRow({ cat, amount, pct, onSet, bare }) {
  const isPreset = pct===0 || pct===50 || pct===100;
  const [showCustom, setShowCustom] = useState(!isPreset);
  const maoAmt = Math.round(amount*pct/100);
  const ingridAmt = Math.round(amount) - maoAmt;
  const preset = (val, label) => (
    <button className={(!showCustom && pct===val)?"on":""} onClick={()=>{ onSet(val); setShowCustom(false); }}>{label}</button>
  );
  return (
    <div className="ap-splitrowwrap">
      <div className="ap-splitrow">
        {!bare && <div className="ap-splitcat"><span className="nm">{cat}</span><span className="mono amt">{fmt(amount)}</span></div>}
        <div className="ap-seg">
          {preset(100,"Mao")}
          {preset(50,"50/50")}
          {preset(0,"Ingrid")}
          <button className={showCustom?"on":""} onClick={()=>setShowCustom(true)}>Custom</button>
        </div>
      </div>
      {showCustom && (
        <div className="ap-customsplit">
          <input className="ap-splitrange" type="range" min="0" max="100" step="1" value={pct} onChange={(e)=>onSet(Number(e.target.value))}/>
          <div className="ap-customvals">
            <span><i style={{background:"var(--navy)"}}/>Mao <b className="mono">{fmt(maoAmt)}</b>
              <MoneyInput className="ap-pctin" value={pct} max={100} commit="blur" keepIfEmpty ariaLabel="Mao's percent" onValue={(v)=>onSet(Math.round(v))}/>%</span>
            <span><i style={{background:"var(--teal)"}}/>Ingrid <b className="mono">{fmt(ingridAmt)}</b> ({100-pct}%)</span>
          </div>
        </div>
      )}
    </div>
  );
}


/* ================= STATEMENT IMPORT ================= */
const SI = window.StmtImport;
const EMPTY_IMPORTER = { accounts: {}, rules: {}, keywords: {}, holders: [], people: {}, imports: [] };
const importerOf = (state) => ({ ...EMPTY_IMPORTER, ...(state.importer || {}) });
const shortDate = (d) => { const [, m, dd] = d.split("-"); return `${MLABEL[+m - 1]} ${+dd}`; };
const fmtRange = (a, b) => `${shortDate(a)} – ${shortDate(b)}, ${b.slice(0, 4)}`;
const centsFmt = (c) => fmt2(Math.abs(c) / 100);
const GROUP_ORDER = ["needs-account", "needs-savings", "needs-amount", "needs-category", "duplicate", "ready", "skipped"];

function ImportSheet({ state, userName, commitImport, undoImport, updateImporter, saveCat, onClose }) {
  const [view, setView] = useState("pick");          // pick | reading | error | review | done | history | rules
  const [errors, setErrors] = useState([]);
  const [stmt, setStmt] = useState(null);
  const [answers, setAnswers] = useState({ accounts: {}, people: {} });
  const [overrides, setOverrides] = useState({});
  const [extraCats, setExtraCats] = useState({ Expenses: [], Income: [], Savings: [] });
  const [result, setResult] = useState(null);
  const [photoTexts, setPhotoTexts] = useState(null);   // OCR text per photo, kept so "read as" can re-parse
  const [edits, setEdits] = useState({});               // photo rows: corrected store, date, amount, direction
  const [readingMsg, setReadingMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [showReady, setShowReady] = useState(false);
  const [showSkipped, setShowSkipped] = useState(false);
  const fileRef = useRef(null);
  const imp = importerOf(state);
  const frequent = useMemo(() => ({ Expenses: topUsed(state, "Expenses"), Income: topUsed(state, "Income") }), [state]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape" && !busy) onClose(); };
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    document.addEventListener("keydown", onKey);
    return () => { document.body.style.overflow = prev; document.removeEventListener("keydown", onKey); };
  }, [busy, onClose]);

  const reset = () => {
    setStmt(null); setErrors([]); setAnswers({ accounts: {}, people: {} }); setOverrides({}); setPhotoTexts(null); setEdits({});
    setExtraCats({ Expenses: [], Income: [], Savings: [] }); setResult(null); setShowReady(false); setShowSkipped(false);
  };

  const isPdf = (f) => /\.pdf$/i.test(f.name) || f.type === "application/pdf";
  const isImage = (f) => /^image\//.test(f.type) || /\.(png|jpe?g|heic|heif|webp)$/i.test(f.name);
  const alreadyImported = (fp) => {
    const prior = imp.imports.find((i) => i.fp === fp);
    if (!prior) return false;
    setErrors([`${prior.kind === "photo" ? "These photos were" : "This statement was"} already imported on ${prior.at.slice(0, 10)} by ${prior.by}. To import again, undo that import first under History.`]);
    setView("error"); return true;
  };
  const showPhotos = (texts, modes, types) => {
    const st = SI.parsePhotos(texts, modes, localToday(), types, imp.accounts);
    if (!st.rows.length) { setErrors(["Couldn't find any amounts in the photo. Try a sharper picture, or crop it to just the transactions."]); setView("error"); return; }
    if (alreadyImported(st.fingerprint)) return;
    setStmt(st); setView("review");
  };
  const onFile = async (ev) => {
    const files = Array.from(ev.target.files || []); ev.target.value = ""; if (!files.length) return;
    reset(); setView("reading"); setReadingMsg("Reading…");
    try {
      if (files.every(isImage)) {
        setReadingMsg("Loading the photo reader (first time only)…");
        const texts = await SI.readImageTexts(files, (i, n, p) => setReadingMsg(`Reading photo ${i + 1} of ${n}… ${Math.round(p * 100)}%`));
        setPhotoTexts(texts); showPhotos(texts, texts.map(() => "auto")); return;
      }
      if (files.length > 1 || !isPdf(files[0])) throw new Error("Choose one statement PDF, or one or more photos (screenshots or receipts). Not both at once.");
      const f = files[0];
      setReadingMsg("Reading the statement…");
      const lines = await SI.readPdfLines(f);
      const res = SI.parseStatement(lines);
      if (!res.ok) { setErrors(res.errors); setView("error"); return; }
      if (alreadyImported(res.statement.fingerprint)) return;
      setStmt(res.statement); setView("review");
    } catch (e) { setErrors([e?.message || String(e)]); setView("error"); }
  };

  // Photo rows can be corrected in review; corrections are applied before categorizing, so memory and duplicates use them.
  const stmtEff = useMemo(() => {
    if (!stmt || !stmt.photo) return stmt;
    return { ...stmt, rows: stmt.rows.map((r) => {
      const e = edits[r.id]; if (!e) return r;
      const abs = e.abs != null ? e.abs : Math.abs(r.amount);
      const dir = e.dir || (r.amount < 0 || r.needsAmount ? "out" : "in");
      const date = e.date || r.date;
      const touched = e.abs != null || e.dir != null;
      return { ...r, desc: e.desc != null ? e.desc : r.desc, date, postDate: date, amount: dir === "out" ? -abs : abs, section: dir === "out" ? "withdrawals" : "deposits",
        needsAmount: r.needsAmount && e.abs == null, amountHint: touched ? null : r.amountHint, signGuess: e.dir != null ? false : r.signGuess };
    }) };
  }, [stmt, edits]);
  const editRow = (id, patch) => setEdits((e) => ({ ...e, [id]: { ...(e[id] || {}), ...patch } }));

  /* ---- context the classifier sees: saved settings plus this session's answers ---- */
  const ctx = useMemo(() => {
    if (!stmt) return null;
    const cats = (t) => [...new Set([...(state.categories[t] || []), ...extraCats[t]])];
    const self = stmt.photo ? null : { ...(imp.accounts[stmt.last4] || {}), ...(answers.accounts[stmt.last4] || {}), kind: stmt.kind, label: stmt.label, ours: true, statements: true };
    return {
      categories: { Income: cats("Income"), Expenses: cats("Expenses"), Savings: cats("Savings") },
      entries: state.entries,
      importer: { ...imp, accounts: { ...imp.accounts, ...answers.accounts, ...(self ? { [stmt.last4]: self } : {}) }, people: { ...imp.people, ...answers.people } },
    };
  }, [stmt, state, answers, extraCats]);

  const cands = useMemo(() => {
    if (!ctx) return [];
    return SI.classify(stmtEff, ctx).map((c) => {
      const o = overrides[c.id]; if (!o) return c;
      const x = { ...c };
      if (o.userSkip) { x.userSkip = true; x.rememberSkip = !!o.rememberSkip; }
      if (o.category && (x.kind === "expense" || x.kind === "income")) { x.type = o.type; x.category = o.category; x.source = "user"; }
      if (o.dupDecision) x.dupDecision = o.dupDecision;
      if (o.savingsCat) { x.savingsCat = o.savingsCat; x.savingsSource = "user"; }
      if (o.keepRefunded) x.removeRefunded = false;
      return x;
    });
  }, [ctx, overrides, stmtEff]);

  const groups = useMemo(() => {
    const g = Object.fromEntries(GROUP_ORDER.map((k) => [k, []]));
    cands.forEach((c) => g[SI.statusOf(c, ctx)].push(c));
    return g;
  }, [cands, ctx]);

  const setOv = (id, patch) => setOverrides((o) => ({ ...o, [id]: patch === null ? undefined : { ...(o[id] || {}), ...patch } }));
  const pickFor = (c, patch) => {
    const group = [c];
    setOverrides((o) => {
      const next = { ...o, [c.id]: { ...(o[c.id] || {}), ...patch } };
      if (c.key) cands.forEach((x) => {
        const own = o[x.id];
        if (x.id !== c.id && x.key === c.key && x.dir === c.dir && (x.kind === "expense" || x.kind === "income") && !(own && (own.category || own.userSkip))) {
          next[x.id] = { ...(own || {}), ...patch }; group.push(x);
        }
      });
      return next;
    });
    // On a photo, direction is read, not reconciled. An expense category means money out; an income category, money in.
    const want = patch.type === "Expenses" ? "out" : patch.type === "Income" ? "in" : null;
    if (want) {
      const flip = group.filter((x) => x.fromPhoto && x.dir !== want).map((x) => x.id);
      if (flip.length) setEdits((e) => { const n = { ...e }; flip.forEach((id) => { n[id] = { ...(n[id] || {}), dir: want }; }); return n; });
    }
  };
  const answerAccount = (id, patch) => setAnswers((a) => ({ ...a, accounts: { ...a.accounts, [id]: { ...(imp.accounts[id] || {}), ...(a.accounts[id] || {}), ...patch } } }));
  const markBetween = (person) => setAnswers((a) => ({ ...a, people: { ...a.people, [person]: "household" } }));
  const addCategory = (type) => {
    const name = (window.prompt(`New ${type === "Income" ? "income" : "expense"} category name`) || "").trim();
    if (!name) return null;
    if (!ctx.categories[type].includes(name)) setExtraCats((e) => ({ ...e, [type]: [...e[type], name] }));
    if (saveCat) saveCat(type, name);   // saved now, even if this import is later canceled
    return name;
  };

  const pendingAccounts = useMemo(() => {
    const m = new Map();
    groups["needs-account"].forEach((c) => { const p = c.pendingAccount; m.set(p.id, { ...p, count: (m.get(p.id)?.count || 0) + 1 }); });
    return [...m.values()];
  }, [groups]);
  const savingsAccountsNeedingCat = useMemo(() => [...new Set(groups["needs-savings"].map((c) => c.savingsAcct))], [groups]);

  const ready = groups.ready;
  const totals = ready.reduce((t, c) => {
    if (c.kind === "expense") t.exp += -c.amount;
    if (c.kind === "income") t.inc += c.amount;
    if (c.savingsDelta) t.sav += c.savingsDelta;
    t.entries += (c.kind === "expense" || c.kind === "income" ? 1 : 0) + (c.savingsDelta ? 1 : 0);
    return t;
  }, { exp: 0, inc: 0, sav: 0, entries: 0 });
  const remaining = groups["needs-amount"].length + groups["needs-account"].length + groups["needs-savings"].length + groups["needs-category"].length + groups.duplicate.length;

  const doImport = async () => {
    if (remaining > 0 || busy) return;
    setBusy(true);
    try {
      const importId = uid();
      const built = SI.buildEntries(cands, stmtEff, ctx, importId, uid);
      const res = await commitImport({ stmt, importId, built, answers, extraCats, by: userName });
      if (res.aborted) { setErrors(["This statement was imported from another device while you were reviewing it. Nothing was added twice."]); setView("error"); return; }
      setResult({ importId, count: built.entries.length, removed: built.removed.length, synced: res.ok, label: stmt.photo ? stmt.label.toLowerCase() : `${stmt.label} ····${stmt.last4}`, range: fmtRange(stmt.start, stmt.end) });
      setView("done");
    } finally { setBusy(false); }
  };

  const title = view === "history" ? "Import history" : view === "rules" ? "Import rules" : "Import statements or photos";

  return (
    <div className="ap-imp-overlay" role="dialog" aria-modal="true" aria-label={title}>
      <div className="ap-imp-sheet">
        <header className="ap-imp-head">
          <div>
            <h2 className="ap-imp-title">{title}</h2>
            {view === "review" && stmt && stmt.photo && <p className="ap-imp-sub">{stmt.label} · read on this device · <span className="warn">no totals to check, so look over amounts and dates</span></p>}
            {view === "review" && stmt && !stmt.photo && <p className="ap-imp-sub">{SI.acctLabel(stmt.last4, stmt.kind, imp.accounts[stmt.last4] || { label: stmt.label })} · {fmtRange(stmt.start, stmt.end)} · <span className="ok">totals match the statement</span></p>}
          </div>
          <div className="ap-imp-headbtns">
            {(view === "pick" || view === "history" || view === "rules" || view === "done" || view === "error") && (
              <nav className="ap-imp-nav">
                <button className={view !== "history" && view !== "rules" ? "on" : ""} onClick={() => { reset(); setView("pick"); }}>Import</button>
                <button className={view === "history" ? "on" : ""} onClick={() => setView("history")}>History</button>
                <button className={view === "rules" ? "on" : ""} onClick={() => setView("rules")}>Rules</button>
              </nav>
            )}
            <button className="ap-imp-close" onClick={onClose} aria-label="Close">×</button>
          </div>
        </header>

        <input ref={fileRef} type="file" accept="application/pdf,.pdf,image/*" multiple style={{ display: "none" }} onChange={onFile} />

        {view === "pick" && (
          <div className="ap-imp-body ap-imp-pick">
            <p>Choose a Bank of America checking, savings or credit card statement PDF. It's read on this device; only the transactions you approve are saved.</p>
            <p className="ap-imp-fine">Picking a category for one transaction fills in the others from the same merchant on that statement, and it's remembered for next time.</p>
            <button className="ap-imp-primary" onClick={() => fileRef.current?.click()}>Choose PDF or photos</button>
            <p className="ap-imp-fine">Photos: bank app screenshots or paper receipts, several at once. They're read on this iPad; nothing is uploaded anywhere.</p>
            <p className="ap-imp-fine">Nothing is added until you review it. Each statement can be imported once, and any import can be undone from History.</p>
            <StatementCoverage imp={imp} updateImporter={updateImporter} />
          </div>
        )}

        {view === "reading" && <div className="ap-imp-body ap-imp-pick"><p>{readingMsg || "Reading…"}</p></div>}

        {view === "error" && (
          <div className="ap-imp-body">
            <div className="ap-imp-error">
              <b>Nothing was imported.</b>
              <ul>{errors.map((e, i) => <li key={i}>{e}</li>)}</ul>
              <p className="ap-imp-fine">If the numbers don't add up, the statement layout may have changed. Send that statement over so the reader can be updated.</p>
            </div>
            <button className="ap-imp-secondary" onClick={() => fileRef.current?.click()}>Choose another PDF</button>
          </div>
        )}

        {view === "review" && ctx && (
          <>
            {stmt.photo && photoTexts && (
              <div className="ap-imp-body ap-imp-readas">
                {photoTexts.map((_, pi) => (
                  <div key={pi} className="ap-imp-readrow">
                    <span>{photoTexts.length > 1 ? `Photo ${pi + 1}` : "This photo"} read as</span>
                    <div className="ap-seg">
                      {[["list", "Transaction list"], ["receipt", "Receipt"]].map(([m, l]) => (
                        <button key={m} className={stmt.modes[pi] === m ? "on" : ""} onClick={() => { if (stmt.modes[pi] !== m) { const modes = stmt.modes.slice(); modes[pi] = m; setEdits({}); setOverrides({}); showPhotos(photoTexts, modes, stmt.acctTypes); } }}>{l}</button>
                      ))}
                    </div>
                    {stmt.modes[pi] === "list" && (
                      <>
                        <span>from</span>
                        <div className="ap-seg">
                          {[["debit", "Debit / checking"], ["card", "Credit card"]].map(([t, l]) => (
                            <button key={t} className={stmt.acctTypes[pi] === t ? "on" : ""} onClick={() => { if (stmt.acctTypes[pi] !== t) { const types = stmt.acctTypes.slice(); types[pi] = t; setEdits({}); setOverrides({}); showPhotos(photoTexts, stmt.modes, types); } }}>{l}</button>
                          ))}
                        </div>
                      </>
                    )}
                  </div>
                ))}
              </div>
            )}
            <div className="ap-imp-body">
              {pendingAccounts.length > 0 && (
                <section className="ap-imp-group">
                  <h3>Accounts to confirm</h3>
                  <p className="ap-imp-hint">Answer once per account. The answer is remembered for future statements.</p>
                  {pendingAccounts.map((a) => <AccountPrompt key={a.id} acct={a}
                    onAnswer={(patch) => answerAccount(a.id, { kind: a.kind, label: a.id.match(/^\d{4}$/) ? undefined : a.label, ...patch })} />)}
                </section>
              )}

              {savingsAccountsNeedingCat.length > 0 && (
                <section className="ap-imp-group">
                  <h3>Savings category</h3>
                  {savingsAccountsNeedingCat.map((id) => (
                    <label key={id} className="ap-imp-savcat">
                      <span>Count money moving in and out of <b>{SI.acctLabel(id, "savings", ctx.importer.accounts[id])}</b> as</span>
                      <select value="" onChange={(e) => e.target.value && answerAccount(id, { savingsCategory: e.target.value })}>
                        <option value="">Choose…</option>
                        {ctx.categories.Savings.map((s) => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </label>
                  ))}
                  <p className="ap-imp-hint">You can still change it on individual transfers below.</p>
                </section>
              )}

              {groups["needs-amount"].length > 0 && (
                <section className="ap-imp-group">
                  <h3>Needs an amount <span className="n">{groups["needs-amount"].length}</span></h3>
                  <p className="ap-imp-hint">The amount on these couldn't be read clearly. Type it in from the screenshot.</p>
                  {groups["needs-amount"].map((c) => <ReviewRow key={c.id} c={c} ctx={ctx} frequent={frequent} editRow={editRow} setOv={setOv} pickFor={pickFor} markBetween={markBetween} addCategory={addCategory} />)}
                </section>
              )}

              {groups["needs-category"].length > 0 && (
                <section className="ap-imp-group">
                  <h3>Needs a category <span className="n">{groups["needs-category"].length}</span></h3>
                  {groups["needs-category"].map((c) => <ReviewRow key={c.id} c={c} ctx={ctx} frequent={frequent} editRow={editRow} setOv={setOv} pickFor={pickFor} markBetween={markBetween} addCategory={addCategory} />)}
                </section>
              )}

              {groups.duplicate.length > 0 && (
                <section className="ap-imp-group">
                  <h3>Possible duplicates <span className="n">{groups.duplicate.length}</span></h3>
                  <p className="ap-imp-hint">These match something already logged: same amount, within 3 days.</p>
                  {groups.duplicate.map((c) => <ReviewRow key={c.id} c={c} ctx={ctx} frequent={frequent} editRow={editRow} setOv={setOv} pickFor={pickFor} markBetween={markBetween} addCategory={addCategory} />)}
                </section>
              )}

              <section className="ap-imp-group">
                <button className="ap-imp-toggle" onClick={() => setShowReady((v) => !v)} aria-expanded={showReady}>
                  <span>Ready to import <span className="n">{ready.length}</span></span><span className="chev">{showReady ? "Hide" : "Review"}</span>
                </button>
                {showReady && ready.map((c) => <ReviewRow key={c.id} c={c} ctx={ctx} frequent={frequent} editRow={editRow} setOv={setOv} pickFor={pickFor} markBetween={markBetween} addCategory={addCategory} />)}
              </section>

              <section className="ap-imp-group">
                <button className="ap-imp-toggle" onClick={() => setShowSkipped((v) => !v)} aria-expanded={showSkipped}>
                  <span>Not imported <span className="n">{groups.skipped.length}</span></span><span className="chev">{showSkipped ? "Hide" : "Show why"}</span>
                </button>
                {showSkipped && groups.skipped.map((c) => (
                  <div key={c.id} className="ap-imp-row skipped">
                    <div className="ap-imp-rowmain">
                      <span className="d mono">{shortDate(c.date)}</span>
                      <span className="m">{c.merchant}</span>
                      <span className={"a mono " + (c.amount < 0 ? "out" : "in")}>{c.amount < 0 ? "−" : "+"}{centsFmt(c.amount)}</span>
                    </div>
                    <div className="ap-imp-why">
                      {c.userSkip ? "You removed this" : c.dupDecision === "skip" ? "Skipped as a duplicate" : c.skipReason}
                      {c.removeRefunded && c.refundOf && <> · also removes the earlier {fmt2(c.refundOf.amount)} purchase <button className="ap-imp-link" onClick={() => setOv(c.id, { keepRefunded: true })}>Keep it</button></>}
                      {(c.userSkip || c.dupDecision === "skip") && <button className="ap-imp-link" onClick={() => setOv(c.id, { userSkip: false, rememberSkip: false, dupDecision: null })}>Put it back</button>}
                    </div>
                  </div>
                ))}
              </section>
            </div>

            <footer className="ap-imp-foot">
              <div className="ap-imp-sum">
                <span>Spending <b className="mono">{fmt2(totals.exp / 100)}</b></span>
                <span>Income <b className="mono">{fmt2(totals.inc / 100)}</b></span>
                <span>Savings <b className="mono">{totals.sav < 0 ? "−" : "+"}{fmt2(Math.abs(totals.sav) / 100)}</b></span>
              </div>
              <div className="ap-imp-footbtns">
                <button className="ap-imp-secondary" onClick={() => { reset(); setView("pick"); }}>Cancel</button>
                <button className="ap-imp-primary" disabled={remaining > 0 || busy || totals.entries === 0} onClick={doImport}>
                  {busy ? "Importing…" : remaining > 0 ? `${remaining} left to review` : totals.entries === 0 ? "Nothing to import" : `Import ${totals.entries} entries`}
                </button>
              </div>
            </footer>
          </>
        )}

        {view === "done" && result && (
          <div className="ap-imp-body ap-imp-pick">
            <p><b>Imported {result.count} entries</b> from {result.label} ({result.range}).{result.removed ? ` Removed ${result.removed} earlier purchase${result.removed > 1 ? "s" : ""} that were refunded.` : ""}</p>
            {!result.synced && <p className="ap-imp-warn">Saved on this device, but syncing to your shared budget failed. The save indicator at the top of the app will retry.</p>}
            <div className="ap-imp-footbtns">
