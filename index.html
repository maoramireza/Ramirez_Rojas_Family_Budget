<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramirez Rojas · Family Budget</title>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>html,body{margin:0;padding:0;}#root{min-height:100vh;}</style>
</head>
<body>
<div id="root"></div>
<script>
/* Surface any load/runtime error instead of a blank screen */
window.addEventListener("error", function(e){
  var r = document.getElementById("root");
  if (r && !r.hasChildNodes()) {
    r.innerHTML = '<div style="font-family:system-ui;max-width:600px;margin:60px auto;padding:24px;border:1px solid #E4B9B3;background:#FBEAE8;border-radius:12px;color:#B23A2E"><b>The app hit an error while loading.</b><br><br>'+
      (e.message||e.error||"Unknown error")+'<br><br><span style="color:#5E6675;font-size:13px">If this mentions React, Babel, or Supabase, a library failed to load. Try a hard refresh. Otherwise screenshot this and send it over.</span></div>';
  }
});
</script>
<script>
/* ===== Statement importer core (plain JS, tested separately) ===== */
/* =====================================================================
   Statement importer core — pure functions, no React, no DOM.
   Pipeline: PDF → lines → parse (per bank layout) → reconcile → classify → build entries.
   Money is handled in integer cents throughout to avoid floating-point drift.
   Amount sign convention on parsed rows: negative = money left the household account, positive = money came in.
   ===================================================================== */
(function (root) {
  "use strict";

  /* ---------------- money & dates ---------------- */
  const MONEY = "-?\\$?-?\\d[\\d,]*\\.\\d{2}";
  const MONTHS = { january:1, february:2, march:3, april:4, may:5, june:6, july:7, august:8, september:9, october:10, november:11, december:12 };

  function toCents(s) {
    if (s == null) return null;
    const t = String(s).replace(/[\u2212\u2013]/g, "-").replace(/[$,\s]/g, "");
    const m = t.match(/^(-?)(\d+)\.(\d{2})$/);
    if (!m) return null;
    const v = parseInt(m[2], 10) * 100 + parseInt(m[3], 10);
    return m[1] === "-" && v !== 0 ? -v : v;
  }
  const pad2 = (n) => String(n).padStart(2, "0");
  const iso = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
  const validMD = (m, d) => m >= 1 && m <= 12 && d >= 1 && d <= 31;

  function longDate(s) { // "August 8, 2026"
    const m = String(s).trim().match(/^([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})$/);
    if (!m || !MONTHS[m[1].toLowerCase()]) return null;
    return iso(+m[3], MONTHS[m[1].toLowerCase()], +m[2]);
  }
  function addDays(isoDate, n) {
    const d = new Date(isoDate + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function dayDiff(a, b) { return Math.round((new Date(a + "T12:00:00Z") - new Date(b + "T12:00:00Z")) / 86400000); }

  // Month/day with no year: choose the year that places the date on or just before the reference date.
  function inferYear(mm, dd, refIso, slackDays) {
    let y = +refIso.slice(0, 4);
    let d = iso(y, mm, dd);
    if (dayDiff(d, refIso) > (slackDays || 10)) d = iso(y - 1, mm, dd);
    return d;
  }

  /* ---------------- PDF → positioned lines ---------------- */
  // pages: array of arrays of {str, x, y, w}; y is measured from the page bottom (PDF.js convention).
  function itemsToLines(pages) {
    const Y_TOL = 2.5, GAP = 0.8, out = [];
    pages.forEach((items, page) => {
      const sorted = items.filter((it) => it.str && it.str.trim()).slice().sort((a, b) => (b.y - a.y) || (a.x - b.x));
      const rows = [];
      for (const it of sorted) {
        const row = rows[rows.length - 1];
        if (row && Math.abs(row.y - it.y) <= Y_TOL) row.items.push(it); else rows.push({ y: it.y, items: [it] });
      }
      for (const r of rows) {
        r.items.sort((a, b) => a.x - b.x);
        let text = "", end = null;
        for (const it of r.items) {
          if (end !== null && it.x - end > GAP && !text.endsWith(" ") && !it.str.startsWith(" ")) text += " ";
          text += it.str; end = it.x + (it.w || 0);
        }
        text = text.replace(/\s+/g, " ").trim();
        if (text) out.push({ text, page, y: r.y });
      }
    });
    return out;
  }

  const PDFJS_VERSION = "3.11.174";
  const PDFJS_BASE = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/`;
  let pdfjsPromise = null;
  function loadPdfJs() {
    if (root.pdfjsLib) return Promise.resolve(root.pdfjsLib);
    if (pdfjsPromise) return pdfjsPromise;
    pdfjsPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = PDFJS_BASE + "pdf.min.js";
      s.async = true;
      const timer = setTimeout(() => { reject(new Error("The PDF reader took too long to load. Check your connection and try again.")); }, 20000);
      s.onload = () => {
        clearTimeout(timer);
        if (!root.pdfjsLib) return reject(new Error("The PDF reader loaded but didn't start."));
        root.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
        resolve(root.pdfjsLib);
      };
      s.onerror = () => { clearTimeout(timer); reject(new Error("Couldn't load the PDF reader. Check your connection and try again.")); };
      document.head.appendChild(s);
    }).catch((e) => { pdfjsPromise = null; throw e; });
    return pdfjsPromise;
  }

  async function readPdfLines(file) {
    const lib = await loadPdfJs();
    const data = new Uint8Array(await file.arrayBuffer());
    // isEvalSupported:false is the official mitigation for CVE-2024-4367 in PDF.js 3.x.
    const doc = await lib.getDocument({ data, isEvalSupported: false, disableFontFace: true }).promise;
    const pages = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      pages.push(tc.items.filter((it) => typeof it.str === "string").map((it) => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width })));
    }
    await doc.destroy();
    if (!pages.some((items) => items.some((it) => it.str.trim()))) throw new Error("This PDF has no readable text. It may be a scanned image, which the importer can't read.");
    return itemsToLines(pages);
  }

  /* ---------------- shared parsing helpers ---------------- */
  const reMoney = (prefix) => new RegExp("^" + prefix + "\\s+(" + MONEY + ")");
  function firstMatch(lines, re, pageFilter) {
    for (const l of lines) { if (pageFilter != null && l.page !== pageFilter) continue; const m = l.text.match(re); if (m) return m; }
    return null;
  }
  function last4From(s) { const d = String(s).replace(/\D/g, ""); return d.length >= 4 ? d.slice(-4) : null; }
  const PAGE_HEADER = /^(.+?)\s+\S\s+Account\s*#\s*[\d ]+\s+\S\s+/;
  const NOISE = [/^Page \d+ of \d+$/i, /continued on the next page/i, /^Date (Transaction )?description Amount$/i, /Account\s*#\s*\d{4}/i];
  const isNoise = (t) => NOISE.some((re) => re.test(t));

  function detect(lines) {
    const has = (re) => lines.some((l) => re.test(l.text));
    if (!has(/Bank of America|bankofamerica\.com/i)) return null;
    if (has(/^Account Summary\/Payment Information/i) && has(/Statement Closing Date/i)) return "bofa-card";
    if (has(/^Beginning balance on /i) && has(/^Ending balance on /i)) return "bofa-deposit";
    return null;
  }

  /* ---------------- Bank of America credit card ---------------- */
  function parseBofaCard(lines) {
    const st = { bank: "bofa", kind: "card", rows: [], errors: [], holders: [] };
    const acct = firstMatch(lines, /^Account\s*#\s*((?:\d{4}\s*){3,4})$/) || firstMatch(lines, /Account\s*#\s*((?:\d{4}\s*){3,4})/);
    st.last4 = acct ? last4From(acct[1]) : null;
    const idx = lines.findIndex((l) => /^Account\s*#\s*\d/.test(l.text));
    const prev = idx > 0 ? lines[idx - 1].text.replace(/[®™]/g, "").trim() : "";
    st.label = prev && prev.length <= 40 && !/\d{3}/.test(prev) ? prev : "Credit card";

    const per = firstMatch(lines, /^([A-Z][a-z]+)\s+(\d{1,2})(?:,\s*(\d{4}))?\s*-\s*([A-Z][a-z]+)\s+(\d{1,2}),\s*(\d{4})$/)
      || firstMatch(lines, /([A-Z][a-z]+)\s+(\d{1,2})(?:,\s*(\d{4}))?\s*-\s*([A-Z][a-z]+)\s+(\d{1,2}),\s*(\d{4})/);
    if (per && MONTHS[per[1].toLowerCase()] && MONTHS[per[4].toLowerCase()]) {
      st.end = iso(+per[6], MONTHS[per[4].toLowerCase()], +per[5]);
      const sm = MONTHS[per[1].toLowerCase()];
      const sy = per[3] ? +per[3] : (sm > MONTHS[per[4].toLowerCase()] ? +per[6] - 1 : +per[6]);
      st.start = iso(sy, sm, +per[2]);
    }
    const closing = firstMatch(lines, /Statement Closing Date\s+(\d{2})\/(\d{2})\/(\d{4})/);
    if (closing && st.end && iso(+closing[3], +closing[1], +closing[2]) !== st.end) st.errors.push("The statement period and closing date disagree.");

    const hdr = firstMatch(lines, PAGE_HEADER);
    if (hdr) st.holders.push(hdr[1].trim());

    const sum = {};
    [["prev", "Previous Balance"], ["credits", "Payments and Other Credits"], ["purchases", "Purchases and Adjustments"],
     ["fees", "Fees Charged"], ["interest", "Interest Charged"], ["newBal", "New Balance Total"]]
      .forEach(([k, label]) => { const m = firstMatch(lines, reMoney(label)); sum[k] = m ? toCents(m[1]) : null; });
    st.summary = sum;

    const SECTION = { "payments and other credits": "credits", "purchases and adjustments": "purchases", "fees": "fees", "interest charged": "interest" };
    const FULL = /^(\d{2})\/(\d{2})\s+(\d{2})\/(\d{2})\s+(.+?)\s+(\d{4})\s+(\d{4})\s+(-?[\d,]+\.\d{2})$/;
    const NOREF = /^(\d{2})\/(\d{2})\s+(\d{2})\/(\d{2})\s+(.+?)\s+(-?[\d,]+\.\d{2})$/;
    const STARTONLY = /^(\d{2})\/(\d{2})\s+(\d{2})\/(\d{2})\s+(.+)$/;
    const TAIL = /^(.*?)\s*(\d{4})\s+(\d{4})\s+(-?[\d,]+\.\d{2})$/;
    const FX = /^([\d,]+\.\d{2})\s+([A-Z]{3})$/;
    const totals = {};
    let inTx = false, section = null, pending = null, lastRow = null;

    const pushRow = (r) => {
      const printed = toCents(r.amt);
      const row = { section, desc: r.desc.trim(), ref: r.ref || null, printed, amount: -printed,
        postDate: inferYear(+r.pm, +r.pd, st.end, 10), date: inferYear(+r.tm, +r.td, st.end, 10), page: r.page, y: r.y };
      if (!validMD(+r.tm, +r.td)) st.errors.push(`Bad date on line: ${r.desc}`);
      st.rows.push(row); lastRow = row;
    };

    for (const l of lines) {
      const t = l.text;
      if (!inTx) { if (/^Transactions$/i.test(t)) inTx = true; continue; }
      if (/Totals Year-to-Date|^Interest Charge Calculation/i.test(t)) break;
      const secKey = SECTION[t.toLowerCase().replace(/\s*-\s*continued$/i, "")];
      if (secKey) { if (pending) st.errors.push(`Couldn't finish reading: ${pending.desc}`); pending = null; section = secKey; lastRow = null; continue; }
      const tot = t.match(new RegExp("^TOTAL (.+?) FOR THIS PERIOD\\s+(" + MONEY + ")$", "i"));
      if (tot) { if (section) totals[section] = toCents(tot[2]); section = null; pending = null; lastRow = null; continue; }
      if (!section) continue;

      let m;
      if (pending) {
        if ((m = t.match(TAIL))) { pushRow({ ...pending, desc: pending.desc + (m[1] ? " " + m[1] : ""), ref: m[2], amt: m[4] }); pending = null; continue; }
        if (FX.test(t)) { pending.fx = t; continue; }
      }
      if ((m = t.match(FULL))) { pushRow({ tm: m[1], td: m[2], pm: m[3], pd: m[4], desc: m[5], ref: m[6], amt: m[8], page: l.page, y: l.y }); continue; }
      if ((m = t.match(NOREF))) { pushRow({ tm: m[1], td: m[2], pm: m[3], pd: m[4], desc: m[5], amt: m[6], page: l.page, y: l.y }); continue; }
      if ((m = t.match(FX)) && lastRow && lastRow.page === l.page) { lastRow.fx = `${m[1]} ${m[2]}`; continue; }
      if ((m = t.match(STARTONLY))) { pending = { tm: m[1], td: m[2], pm: m[3], pd: m[4], desc: m[5], page: l.page, y: l.y }; continue; }
      // anything else inside a section (column headers, page chrome) is ignored; the math check catches real misses
    }
    if (pending) st.errors.push(`Couldn't finish reading: ${pending.desc}`);
    st.sectionTotals = totals;
    return st;
  }

  function reconcileCard(st) {
    const errs = [];
    const s = st.summary;
    ["prev", "credits", "purchases", "fees", "interest", "newBal"].forEach((k) => { if (s[k] == null) errs.push(`Couldn't find "${k}" in the account summary.`); });
    if (errs.length) return errs;
    const sumOf = (sec) => st.rows.filter((r) => r.section === sec).reduce((a, r) => a + r.printed, 0);
    const expect = { credits: s.credits, purchases: s.purchases, fees: s.fees, interest: s.interest };
    const names = { credits: "Payments and credits", purchases: "Purchases", fees: "Fees", interest: "Interest" };
    Object.keys(expect).forEach((sec) => {
      const got = sumOf(sec);
      if (got !== expect[sec]) errs.push(`${names[sec]} add up to ${fmtC(got)} but the statement says ${fmtC(expect[sec])}.`);
      if (st.sectionTotals[sec] != null && st.sectionTotals[sec] !== got) errs.push(`${names[sec]} don't match their printed total.`);
    });
    const bal = s.prev + s.credits + s.purchases + s.fees + s.interest;
    if (bal !== s.newBal) errs.push(`Balance check failed: ${fmtC(bal)} computed vs ${fmtC(s.newBal)} on the statement.`);
    return errs;
  }

  /* ---------------- Bank of America checking & savings ---------------- */
  function parseBofaDeposit(lines) {
    const st = { bank: "bofa", rows: [], errors: [], holders: [] };
    const title = firstMatch(lines, /^Your (.+)$/, 0);
    st.label = title ? title[1].replace(/^Bank of America\s+/i, "").trim() : "Bank account";
    st.kind = title && /savings/i.test(title[1]) ? "savings" : "checking";

    const perIdx = lines.findIndex((l) => l.page === 0 && /^for [A-Z][a-z]+ \d{1,2}, \d{4} to [A-Z][a-z]+ \d{1,2}, \d{4}/.test(l.text));
    if (perIdx >= 0) {
      const m = lines[perIdx].text.match(/^for ([A-Z][a-z]+ \d{1,2}, \d{4}) to ([A-Z][a-z]+ \d{1,2}, \d{4})(?:\s+Account number:\s*([\d ]+))?/);
      st.start = longDate(m[1]); st.end = longDate(m[2]); st.last4 = m[3] ? last4From(m[3]) : null;
      const next = lines[perIdx + 1];
      if (next && next.page === 0 && /^[A-Z][A-Z .'-]{3,}$/.test(next.text)) st.holders.push(next.text);
    }
    if (!st.last4) { const a = firstMatch(lines, /Account\s*(?:number:|#)\s*((?:\d{4}\s*){2,4})/); st.last4 = a ? last4From(a[1]) : null; }
    const hdr = firstMatch(lines, PAGE_HEADER);
    if (hdr && !st.holders.length) st.holders.push(hdr[1].trim());

    const sum = {};
    [["begin", "Beginning balance on [A-Za-z]+ \\d{1,2}, \\d{4}"], ["deposits", "Deposits and other additions"],
     ["withdrawals", "Withdrawals and other subtractions"], ["atm", "ATM and debit card subtractions"],
     ["other", "Other subtractions"], ["checks", "Checks"], ["fees", "Service fees"], ["end", "Ending balance on [A-Za-z]+ \\d{1,2}, \\d{4}"]]
      .forEach(([k, label]) => { const m = firstMatch(lines, new RegExp("^" + label + "\\s+(" + MONEY + ")$"), 0); sum[k] = m ? toCents(m[1]) : null; });
    st.summary = sum;

    const SECTION = { "deposits and other additions": "deposits", "withdrawals and other subtractions": "withdrawals",
      "atm and debit card subtractions": "withdrawals", "other subtractions": "withdrawals", "checks": "checks", "service fees": "fees" };
    const TOTAL = new RegExp("^Total (deposits and other additions|withdrawals and other subtractions|other subtractions|atm and debit card subtractions|checks|service fees)\\s+(" + MONEY + ")$", "i");
    const ROW = /^(\d{2})\/(\d{2})\/(\d{2})\s+(.+?)(?:\s+(-?[\d,]+\.\d{2}))?$/;
    const totals = {};
    let section = null, cur = null, lastY = null;

    const flush = () => {
      if (!cur) return;
      if (cur.amt == null) st.errors.push(`No amount found for: ${cur.desc}`);
      else {
        const printed = toCents(cur.amt);
        const postDate = iso(2000 + +cur.yy, +cur.mm, +cur.dd);
        const row = { section, desc: cur.desc.replace(/\s+/g, " ").trim(), printed, amount: printed, postDate, date: postDate, page: cur.page };
        const emb = row.desc.match(/^(?:MOBILE PURCHASE|PURCHASE REFUND|PURCHASE|CHECKCARD|PMNT SENT|ATM WITHDRAWAL)\s+(\d{2})(\d{2})\b/i)
          || row.desc.match(/\b(\d{2})\/(\d{2})\s+#\d+\s+(?:MOBILE\s+)?PURCHASE\b/i);
        if (emb && validMD(+emb[1], +emb[2])) {
          const d = inferYear(+emb[1], +emb[2], postDate, 0);
          if (dayDiff(postDate, d) >= 0 && dayDiff(postDate, d) <= 20) row.date = d;
        }
        if ((section === "deposits" && printed < 0) || (section !== "deposits" && printed > 0)) st.errors.push(`Unexpected sign on: ${row.desc}`);
        st.rows.push(row);
      }
      cur = null;
    };

    for (const l of lines) {
      const t = l.text;
      const secKey = SECTION[t.toLowerCase().replace(/\s*-\s*continued$/i, "")];
      if (secKey && l.page > 0) { flush(); section = secKey; lastY = null; continue; }
      const tot = t.match(TOTAL);
      if (tot && l.page > 0) { flush(); totals[tot[1].toLowerCase()] = toCents(tot[2]); section = null; continue; }
      if (/continued on the next page/i.test(t)) { flush(); section = null; continue; }
      if (!section) continue;
      const m = t.match(ROW);
      if (m && validMD(+m[1], +m[2])) { flush(); cur = { mm: m[1], dd: m[2], yy: m[3], desc: m[4], amt: m[5] || null, page: l.page }; lastY = l.y; continue; }
      if (isNoise(t)) continue;
      // continuation of a wrapped description: same page and tightly spaced under the previous line
      if (cur && l.page === cur.page && lastY != null && lastY - l.y > 0 && lastY - l.y <= 14) {
        const am = cur.amt == null ? t.match(/^(.*?)\s*(-?[\d,]+\.\d{2})$/) : null;
        if (am) { if (am[1]) cur.desc += " " + am[1]; cur.amt = am[2]; } else cur.desc += " " + t;
        lastY = l.y; continue;
      }
    }
    flush();
    st.sectionTotals = totals;
    return st;
  }

  function reconcileDeposit(st) {
    const errs = [];
    const s = st.summary;
    if (s.begin == null || s.end == null || s.deposits == null) return ["Couldn't read the account summary (beginning balance, deposits, ending balance)."];
    const sumOf = (sec) => st.rows.filter((r) => r.section === sec).reduce((a, r) => a + r.printed, 0);
    const dep = sumOf("deposits"), wd = sumOf("withdrawals"), ck = sumOf("checks"), fe = sumOf("fees");
    const wdExpected = s.withdrawals != null ? s.withdrawals : (s.atm || 0) + (s.other || 0);
    if (s.withdrawals == null && s.atm == null && s.other == null) errs.push("Couldn't find withdrawals in the account summary.");
    if (dep !== s.deposits) errs.push(`Deposits add up to ${fmtC(dep)} but the statement says ${fmtC(s.deposits)}.`);
    if (wd !== wdExpected) errs.push(`Withdrawals add up to ${fmtC(wd)} but the statement says ${fmtC(wdExpected)}.`);
    if (ck !== (s.checks || 0)) errs.push(`Checks add up to ${fmtC(ck)} but the statement says ${fmtC(s.checks || 0)}. Checks aren't supported yet.`);
    if (fe !== (s.fees || 0)) errs.push(`Service fees add up to ${fmtC(fe)} but the statement says ${fmtC(s.fees || 0)}.`);
    const t = st.sectionTotals;
    if (t["deposits and other additions"] != null && t["deposits and other additions"] !== dep) errs.push("Deposits don't match their printed total.");
    if (t["service fees"] != null && t["service fees"] !== fe) errs.push("Service fees don't match their printed total.");
    const bal = s.begin + dep + wd + ck + fe;
    if (bal !== s.end) errs.push(`Balance check failed: ${fmtC(bal)} computed vs ${fmtC(s.end)} on the statement.`);
    return errs;
  }

  function fmtC(c) { const neg = c < 0; const v = Math.abs(c); return (neg ? "-" : "") + "$" + Math.floor(v / 100).toLocaleString("en-US") + "." + pad2(v % 100); }

  /* ---------------- parse entry point ---------------- */
  function parseStatement(lines) {
    const type = detect(lines);
    if (!type) return { ok: false, errors: ["This doesn't look like a Bank of America statement. Only Bank of America checking, savings and credit card statements are supported right now."] };
    const st = type === "bofa-card" ? parseBofaCard(lines) : parseBofaDeposit(lines);
    const missing = [];
    if (!st.last4) missing.push("account number");
    if (!st.start || !st.end) missing.push("statement period");
    const errors = [...st.errors, ...(missing.length ? [`Couldn't find the ${missing.join(" and ")}.`] : [])];
    if (!missing.length) errors.push(...(type === "bofa-card" ? reconcileCard(st) : reconcileDeposit(st)));
    st.fingerprint = `${st.bank}:${st.kind}:${st.last4}:${st.start}:${st.end}`;
    st.rows.forEach((r, i) => { r.id = "r" + i; });
    return { ok: errors.length === 0, errors, statement: st };
  }

  /* ---------------- merchant keys (for memory) ---------------- */
  const STATES = new Set("AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY ON QC BC AB MB NS NB NL PE SK".split(" "));
  function cleanTokens(s) {
    let t = " " + s.toUpperCase() + " ";
    t = t.replace(/\b(?:TST|SQ|FSP|PY|DD)\s?\*\s*/g, " ")            // payment-processor prefixes
      .replace(/\b\d{3}-\d{3}-\d{4}\b|\b\d{3}-\d{7}\b/g, " ")         // phone numbers

      .replace(/\*/g, " ")
      .replace(/\bRECURRING\b/g, " ");

      .filter((w) => /[A-Z0-9]/.test(w))                                // stray punctuation like a lone "#"
      .filter((w) => !/^\d+$/.test(w))                                 // bare numbers
      .filter((w) => !(/\d/.test(w) && /[A-Z]/.test(w) && w.length >= 6)); // order ids like 5H96A99Y2
    if (toks.length > 1 && STATES.has(toks[toks.length - 1])) toks.pop();

  }
  function merchantInfo(desc) {
    const u = desc.toUpperCase();
    let m;
    if ((m = u.match(/^PAYPAL\s+DES:\s*(.+?)\s+ID:\s*(.+?)\s+INDN:/))) {

    }

      const who = m[2].trim().replace(/\s+/g, " ");
      return { key: `ZELLE ${who.toUpperCase()}`, name: `Zelle ${m[1].toLowerCase()} ${titleCase(who)}`, memo: m[3] || null, person: who.toUpperCase() };
    }
    if ((m = u.match(/^(.+?)\s+DES:\s*(.+?)\s+ID:/))) {
      const key = cleanTokens(m[1] + " " + m[2]).join(" ");
      return { key, name: titleCase(cleanTokens(m[1]).join(" ")) };
    }
    // "ALDI 71046 07/05 #000913500 MOBILE PURCHASE 608 QUINCE ORCHAR ..." — the store name is the part before the date;
    // what follows "PURCHASE" is sometimes the store's street address.
    const pre = u.match(/^(.+?)\s+\d{2}\/\d{2}\s+#\d+\s+(?:MOBILE\s+)?PURCHASE\b/);
    if (pre) { const pt = cleanTokens(pre[1]); if (pt.length) return { key: pt.join(" "), name: titleCase(pt.slice(0, 4).join(" ")) }; }
    let body = u;
    const mp = u.match(/MOBILE PURCHASE\s+(?!\d{4}\b)(.+)$/);                // "BEST BUY #293 08/08 #0007 MOBILE PURCHASE BEST BUY #293 ..."

    const toks = cleanTokens(body);

  }
  function titleCase(s) { return String(s).toLowerCase().replace(/\b([a-z])/g, (c) => c.toUpperCase()); }

  function findRule(rules, key) {
    if (!key || !rules) return null;
    if (rules[key]) return rules[key];
    const kt = key.split(" ");
    let best = null, bestLen = 0;
    for (const rk of Object.keys(rules)) {
      const rt = rk.split(" ");
      const n = Math.min(rt.length, kt.length);
      if (n < 2) continue;
      let ok = true; for (let i = 0; i < n; i++) if (rt[i] !== kt[i]) { ok = false; break; }
      if (ok && n > bestLen) { best = rules[rk]; bestLen = n; }
    }

  }

  /* ---------------- keyword matching ---------------- */
  const STOP = new Set(["and", "the", "for", "monthly", "subscription", "casa", "house", "mao", "ingrid", "luca", "celular", "other", "otros"]);
  const words = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").split(/[^a-z0-9]+/).filter(Boolean);
  function keywordCategory(desc, categories, keywords, type) {
    const dw = new Set(words(desc));
    const hits = [];
    for (const cat of categories[type] || []) {
      const extra = (keywords && keywords[type + "::" + cat]) || [];
      const sig = words(cat).filter((w) => w.length >= 4 && !STOP.has(w));
      const nameHit = sig.length > 0 && sig.every((w) => dw.has(w));
      const kwHit = extra.some((k) => { const kw = words(k); return kw.length > 0 && kw.every((w) => dw.has(w)); });
      if (nameHit || kwHit) hits.push(cat);
    }

  }

  /* ---------------- counterparties ---------------- */
  const KIND_CODE = { CHK: "checking", SAV: "savings", CRD: "card" };
  const ISSUERS = /^(CAPITAL ONE|CHASE CREDIT CRD|DISCOVER|AMEX|AMERICAN EXPRESS|CITI(?: CARD)?|SYNCHRONY|BARCLAYCARD|WELLS FARGO CARD)\b.*DES:\s*(?:MOBILE PMT|CRCARDPMT|E-?PAYMENT|EPAY|AUTOPAY|PAYMENT|ONLINE PMT|WEB PMT)/i;
  function counterpartyOf(desc) {
    let m;
    if ((m = desc.match(/\b(?:transfer|payment)\s+(?:to|from)\s+(CHK|SAV|CRD)\s*(\d{4})\b/i))) return { id: m[2], kind: KIND_CODE[m[1].toUpperCase()] };
    if ((m = desc.match(/\bPAYMENT FROM (CHK|SAV)\s*(\d{4})\b/i))) return { id: m[2], kind: KIND_CODE[m[1].toUpperCase()] };
    if ((m = desc.match(ISSUERS))) { const name = titleCase(m[1]); return { id: name.toLowerCase().replace(/[^a-z]+/g, "-"), kind: "card", name: name + " card" }; }
    return null;
  }
  function acctLabel(id, kind, reg) {
    if (reg && reg.nickname) return reg.nickname + (/^\d{4}$/.test(id) ? ` ····${id}` : "");
    if (reg && reg.label) return reg.label + (/^\d{4}$/.test(id) ? ` ····${id}` : "");
    const k = kind === "card" ? "Card" : kind === "savings" ? "Savings" : "Checking";
    return /^\d{4}$/.test(id) ? `${k} ····${id}` : titleCase(id.replace(/-/g, " "));
  }
  function isHouseholdPerson(name, holders, people) {

    if (people && people[n]) return people[n] === "household";
    const nt = words(n);

  }

  /* ---------------- classification ---------------- */
  const RX = {
    ktc: /KEEP\s?THE\s?CHANGE/i,
    cashback: /CASH\s?BACK|CASHREWARD|CASH REWARD|REWARDS? REDEMPTION/i,
    interestEarned: /^INTEREST EARNED\b|\bINTEREST PAID\b/i,
    payroll: /DES:\s*PAYROLL\b|\bPAYROLL\b|DES:\s*DIR DEP\b|\bDIRECT DEP/i,
    refund: /\bREFUND\b|\bRETURN\b|CREDIT VOUCHER/i,
    cardFxFee: /^FOREIGN TRANSACTION FEE$/i,
    depFxFee: /\s+\d{10,}\s+INTERNATIONAL TRANSACTION FEE$/i,
  };

  // ctx: { categories, importer:{accounts,rules,keywords,people,holders}, entries }
  function classify(st, ctx) {
    const imp = ctx.importer || {};
    const accounts = imp.accounts || {};
    const holders = [...(imp.holders || []), ...(st.holders || [])];
    const rows = st.rows.map((r) => ({ ...r }));

    // 1) merge foreign/international fees into their purchase
    const merged = new Set();
    rows.forEach((r) => {
      if (st.kind === "card" && r.section === "fees" && RX.cardFxFee.test(r.desc) && r.ref) {
        const p = rows.find((x) => x.section === "purchases" && x.ref === r.ref && !merged.has(x.id));
        if (p) { p.amount += r.amount; p.feeMerged = (p.feeMerged || 0) - r.amount; merged.add(r.id); }
      }
      if (st.kind !== "card" && r.section === "fees" && RX.depFxFee.test(r.desc)) {
        const base = r.desc.replace(RX.depFxFee, "").trim();

    const tokCount = {};
    rows.forEach((r) => new Set(r.desc.toUpperCase().match(TOK) || []).forEach((t) => { tokCount[t] = (tokCount[t] || 0) + 1; }));
    const orderToks = (desc) => [...new Set(desc.toUpperCase().match(TOK) || [])].filter((t) => tokCount[t] <= 2);

    const cands = rows.filter((r) => !merged.has(r.id) && r.amount !== 0).map((r) => {
      const mi = merchantInfo(r.desc);
      const c = { id: r.id, date: r.date, desc: r.desc, amount: r.amount, dir: r.amount < 0 ? "out" : "in",
        merchant: mi.name, key: mi.ambiguous ? null : mi.key, memo: mi.memo || null, person: mi.person || null, fx: r.fx || null, feeMerged: r.feeMerged || 0,

    });

    pairRefunds(cands, ctx.entries || []);

  function decide(c, mi, st, accounts, holders, people) {
    const A = st.kind, isIn = c.amount > 0;

    if (A === "card" && c.section === "credits") { c.kind = "refund"; return; }

  // Money moving between two household accounts. The savings statement is the single source of truth for savings.
  function resolveInternal(c, A, selfId, B, reg, label) {

      c.savingsDelta = c.amount; c.savingsAcct = selfId;

    }

      if (reg.statements) return setSkip(c, `Recorded on the ${label} statement`);

      c.key = `SAVINGS ${isIn ? "TO" : "FROM"} ${selfId}`.toUpperCase(); return;
    }
    if (A === "card") return setSkip(c, "Card payment");
    if (B.kind === "card") {
      if (reg.statements) return setSkip(c, `Card payment (purchases come from the ${label} statement)`);
      if (!isIn) { c.kind = "expense"; c.merchant = `Payment to ${label}`; c.key = `CARD PAYMENT ${B.id}`.toUpperCase(); return; }
    }

  }

  function pairRefunds(cands, entries) {
    cands.filter((c) => c.kind === "refund").forEach((r) => {

    if (c.kind === "savings-only") {

    }

    const a = ((ctx.importer || {}).accounts || {})[acctId];

      const noteParts = [c.merchant];
      if (c.memo) noteParts.push(`"${c.memo}"`);
      if (c.fx) noteParts.push(c.fx);
      if (c.feeMerged) noteParts.push(`incl. ${fmtC(c.feeMerged)} foreign fee`);
      const note = noteParts.filter(Boolean).join(" · ");
      const src = { acct: st.last4, key: c.key || undefined, tok: c.orderTok.length ? c.orderTok : undefined, raw: c.desc };

        const sNote = c.kind === "savings-only" ? (withdrawal ? `Moved out of savings · ${c.merchant}` : `Moved into savings · ${c.merchant}`)

        entries.push({ id: makeId(), date: c.date, type: "Savings", category: rowSavingsCategory(c, ctx), amount: c.savingsDelta / 100, note: sNote, importId, src: { acct: st.last4 } });

const TYPES = ["Income", "Expenses", "Savings"];
const APP_VERSION = "2026-09-23 (backups)";
const MLABEL = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = (n) => String(n).padStart(2, "0");

function App({ session, onSignOut }) {
  const [state, setState] = useState(null);
  const [loaded, setLoaded] = useState(false);

  const firstSave = useRef(true);

  const warningShownRef = useRef(false);
  const INACTIVITY_TIMEOUT = 30 * 60 * 1000;
  const WARNING_TIME = 2 * 60 * 1000;

  /* ---- load from Supabase ---- */
  useEffect(() => {
    (async () => {
      let init = null;
      try {
        const { data, error } = await sb.from("budgets").select("state").eq("id", "family").maybeSingle();
        if (!error && data && data.state) init = data.state;
      } catch (e) {}
      const initial = init || { ...structuredClone(BASELINE), entries: [] };
      lastSavedRef.current = JSON.stringify(initial);
      setState(initial);
      setLoaded(true);
      try { const a = await window.loadArchives(); setArchives(a || []); } catch (e) {}
    })();
  }, []);

  /* ---- save (robust, with visible status + flush on hide) ---- */
  useEffect(() => { stateRef.current = state; }, [state]);

  const doSave = async (st) => {
    if (!st) return;
    const json = JSON.stringify(st);
    if (json === lastSavedRef.current) return;
    setSaveStatus("saving");
    try {
      const { error } = await sb.from("budgets").upsert(
        { id: "family", state: st, updated_at: new Date().toISOString(), updated_by: session?.user?.id },
        { onConflict: "id" }
      );
      if (error) throw error;
      lastSavedRef.current = json;
      setSaveStatus("saved");
      setTimeout(() => setSaveStatus((s) => s === "saved" ? "idle" : s), 1600);
    } catch (e) {
      setSaveStatus("error");
    }
  };

  useEffect(() => {
    if (!loaded || !state) return;
    if (firstSave.current) { firstSave.current = false; return; }
    if (JSON.stringify(state) === lastSavedRef.current) return;
    const t = setTimeout(() => doSave(state), 600);
    return () => clearTimeout(t);
  }, [state, loaded]);

  useEffect(() => {
    const flush = () => { const st = stateRef.current; if (st && JSON.stringify(st) !== lastSavedRef.current) doSave(st); };
    const onVis = () => { if (document.visibilityState === "hidden") flush(); };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("pagehide", flush);
    return () => { document.removeEventListener("visibilitychange", onVis); window.removeEventListener("pagehide", flush); };
  }, []);

  /* ---- realtime ---- */
  useEffect(() => {
    if (!loaded) return;
    const ch = sb.channel("budgets-changes")
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "budgets", filter: "id=eq.family" },
        (payload) => { if (payload.new?.state) { lastSavedRef.current = JSON.stringify(payload.new.state); setState(payload.new.state); } })
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, [loaded]);

  /* ---- live presence (who's here) ---- */
  useEffect(() => {
    if (!loaded) return;
    const myEmail = (session?.user?.email || "").toLowerCase();

    ch.on("presence", { event: "sync" }, () => { setOnline(Object.keys(ch.presenceState())); });
    ch.subscribe(async (status) => { if (status === "SUBSCRIBED") await ch.track({ email: myEmail, at: new Date().toISOString() }); });
    return () => { sb.removeChannel(ch); };
  }, [loaded]);

  /* ---- inactivity timeout ---- */
  const resetActivity = () => { lastActivityRef.current = Date.now(); warningShownRef.current = false; setShowLogoutWarning(false); };
  const handleLogout = () => { if (onSignOut) onSignOut(); };
  useEffect(() => {
    if (!loaded) return;
    const handleActivity = () => resetActivity();
    const events = ["mousedown", "keydown", "scroll", "touchstart"];
    events.forEach((e) => document.addEventListener(e, handleActivity));
    const interval = setInterval(() => {
      const elapsed = Date.now() - lastActivityRef.current;
      const remaining = INACTIVITY_TIMEOUT - elapsed;
      if (remaining <= 0) { clearInterval(interval); events.forEach((e)=>document.removeEventListener(e, handleActivity)); handleLogout(); }
      else if (remaining <= WARNING_TIME) { if (!warningShownRef.current) { warningShownRef.current = true; setShowLogoutWarning(true); } setSecondsLeft(Math.ceil(remaining/1000)); }
    }, 1000);
    return () => { clearInterval(interval); events.forEach((e)=>document.removeEventListener(e, handleActivity)); };
  }, [loaded]);

  const update = (fn) => setState((prev) => { const next = structuredClone(prev); fn(next); return next; });

  // One month: the change repeats into later months. Several months: only those months change.
  const setPlanAmt = (type, cat, months, amt) => update((s) => {
    const v = amt && amt > 0 ? Math.round(amt*100)/100 : 0;
    if (months.length > 1) ownMonth(s, addMonths(months[months.length-1], 1));
    months.forEach((k) => {
      ownMonth(s, k);
      s.plan[type] = s.plan[type] || {}; s.plan[type][cat] = s.plan[type][cat] || {};
      if (v) s.plan[type][cat][k] = v; else delete s.plan[type][cat][k];
    });
  });
  const addCat = (type, name) => update((s) => {
    name = (name||"").trim(); if (!name || s.categories[type].includes(name)) return;
    s.categories[type].push(name); s.plan[type] = s.plan[type]||{}; s.plan[type][name] = {};
  });
  const removeCat = (type, cat) => update((s) => {
    s.categories[type] = s.categories[type].filter((c)=>c!==cat);
    if (s.plan[type]) delete s.plan[type][cat];
  });
  const renameCat = (type, oldN, newN) => update((s) => {
    newN = (newN||"").trim(); if (!newN || oldN===newN || s.categories[type].includes(newN)) return;
    s.categories[type] = s.categories[type].map((c)=>c===oldN?newN:c);
    if (s.plan[type]?.[oldN]) { s.plan[type][newN] = {...s.plan[type][oldN]}; delete s.plan[type][oldN]; }
    s.entries = s.entries.map((e)=> e.type===type&&e.category===oldN ? {...e, category:newN} : e);
  });
  const copyBudget = (srcKey, targets) => {
    const base = stateRef.current || state;
    if (!srcKey) return { ok: false, text: "Pick a month to copy from." };
    const values = [];
    TYPES.forEach((t) => base.categories[t].forEach((c) => { const v = planFor(base, t, c, srcKey); if (v) values.push([t, c, v]); }));
    if (!values.length) return { ok: false, text: `${monthLabel(srcKey)} has no budget amounts to copy. Pick another month.` };
    const own = budgetedMonths(base);
    const filled = targets.filter((k) => own.includes(k) && TYPES.some((t) => base.categories[t].some((c) => base.plan[t]?.[c]?.[k])));
    if (filled.length && !confirm(`${filled.map(monthLabel).join(", ")} already ${filled.length > 1 ? "have budgets" : "has a budget"}. Replace with ${monthLabel(srcKey)}'s amounts?`))
      return { ok: false, text: "Nothing was copied." };
    backupBefore(`Before copying ${monthLabel(srcKey)}`);
    update((s) => {
      if (targets.length > 1) ownMonth(s, addMonths(targets[targets.length - 1], 1));
      targets.forEach((k) => {
        ownMonth(s, k);
        TYPES.forEach((t) => (s.categories[t] || []).forEach((c) => { if (s.plan[t]?.[c]) delete s.plan[t][c][k]; }));
        values.forEach(([t, c, v]) => { s.plan[t] = s.plan[t] || {}; s.plan[t][c] = s.plan[t][c] || {}; s.plan[t][c][k] = v; });
      });
    });
    return { ok: true, text: `Copied ${values.length} amounts from ${monthLabel(srcKey)} into ${targets.length > 1 ? targets.length + " months" : monthLabel(targets[0])}.` };
  };
  const resetPlan = () => { if (!confirm("Reset all categories and budget amounts to the original plan? Your logged transactions are kept.")) return; backupBefore("Before resetting the plan");
    update((s)=>{ s.categories = structuredClone(BASELINE.categories); s.plan = structuredClone(BASELINE.plan); s.planMonths = []; }); };
  const addEntry = (e) => update((s)=> s.entries.unshift(e));
  const editEntry = (id, patch) => update((s)=> { s.entries = s.entries.map((x)=>x.id===id?{...x,...patch}:x); });
  const deleteEntry = (id) => update((s)=> { s.entries = s.entries.filter((x)=>x.id!==id); });
  const importTxns = (rows) => update((s)=> {
    rows.forEach((r)=>{ if (!s.categories[r.type].includes(r.category)) s.categories[r.type].push(r.category); s.entries.unshift(r); });
  });

  /* ---- statement import: applied to the latest state and saved immediately, not on the debounce ---- */
  const commit = async (fn) => {
    const base = stateRef.current; if (!base) return { ok: false };
    const next = structuredClone(base);
    if (fn(next) === false) return { ok: false, aborted: true };
    stateRef.current = next; setState(next);
    await doSave(next);
    return { ok: JSON.stringify(next) === lastSavedRef.current };
  };
  const commitImport = async (args) => { await backupBefore(`Before importing ${args.stmt.label} ····${args.stmt.last4}`); return commitImportNow(args); };
  const commitImportNow = ({ stmt, importId, built, answers, extraCats, by }) => commit((s) => {
    const imp = { ...EMPTY_IMPORTER, ...(s.importer || {}) };
    if (imp.imports.some((i) => i.fp === stmt.fingerprint)) return false;
    TYPES.forEach((t) => (extraCats[t] || []).forEach((name) => {
      if (!s.categories[t].includes(name)) { s.categories[t].push(name); s.plan[t] = s.plan[t] || {}; s.plan[t][name] = s.plan[t][name] || {}; }
    }));
    imp.accounts = { ...imp.accounts, ...answers.accounts,
      [stmt.last4]: { ...(imp.accounts[stmt.last4] || {}), ...(answers.accounts[stmt.last4] || {}), kind: stmt.kind, label: stmt.label, ours: true, statements: true } };
    imp.people = { ...imp.people, ...answers.people };
    imp.holders = [...new Set([...imp.holders, ...stmt.holders])];
    imp.rules = { ...imp.rules, ...built.rules };
    const removedIds = new Set(built.removed.map((e) => e.id));
    const removed = s.entries.filter((e) => removedIds.has(e.id));
    s.entries = [...built.entries, ...s.entries.filter((e) => !removedIds.has(e.id))];
    imp.imports = [{ id: importId, fp: stmt.fingerprint, acct: stmt.last4, kind: stmt.kind, label: stmt.label, start: stmt.start, end: stmt.end,
      at: new Date().toISOString(), by, count: built.entries.length, removed }, ...imp.imports];
    s.importer = imp;
  });
  const undoImport = async (id) => { await backupBefore("Before undoing an import"); return undoImportNow(id); };
  const undoImportNow = (id) => commit((s) => {
    const imp = { ...EMPTY_IMPORTER, ...(s.importer || {}) };
    const rec = imp.imports.find((i) => i.id === id); if (!rec) return false;
    const have = new Set(s.entries.map((e) => e.id));
    s.entries = [...s.entries.filter((e) => e.importId !== id), ...(rec.removed || []).filter((e) => !have.has(e.id))];
    imp.imports = imp.imports.filter((i) => i.id !== id);
    s.importer = imp;
  });
  const setSetting = (k, v) => update((s) => { s.settings = { ...(s.settings || {}), [k]: v }; });
  /* ---- backups: full copies stored as extra rows beside the live budget; live sync only watches id "family" ---- */
  const myName = NAMES[(session?.user?.email||"").toLowerCase()] || session?.user?.email || "someone";
  const writeBackup = async (st, id, label) => {
    const snap = { ...st, __backup: { label, at: new Date().toISOString(), by: myName, entries: (st.entries||[]).length } };
    const { error } = await sb.from("budgets").upsert({ id, state: snap, updated_at: new Date().toISOString(), updated_by: session?.user?.id }, { onConflict: "id" });
    if (error) throw error;
  };
  // Rolling slots: one per day of the month (about a month of daily copies) plus 10 "before a change" copies.
  const backupBefore = async (label) => {
    const st = stateRef.current; if (!st) return;

      const { data } = await sb.from("budgets").select("id,updated_at").like("id", "backup-op-%");
      const used = new Map((data || []).map((r) => [r.id, r.updated_at || ""]));
      let id = null;
      for (let k = 0; k < 10; k++) if (!used.has(`backup-op-${k}`)) { id = `backup-op-${k}`; break; }
      if (!id) id = [...used.entries()].sort((a, b) => a[1].localeCompare(b[1]))[0][0];
      await writeBackup(st, id, label);
    } catch (e) { console.warn("Backup failed", e); }
  };
  const backupDaily = async (st) => {
    const d = localToday(), id = `backup-day-${d.slice(8)}`;
    try {
      const { data } = await sb.from("budgets").select("state").eq("id", id).maybeSingle();
      const at = data && data.state && data.state.__backup && data.state.__backup.at;
      if (at && new Date(at).toDateString() === new Date().toDateString()) return;

    } catch (e) { console.warn("Daily backup failed", e); }
  };
  const listBackups = async () => {
    const { data, error } = await sb.from("budgets").select("id,updated_at,meta:state->__backup").like("id", "backup-%");
    if (error) throw error;
    return (data || []).map((r) => ({ id: r.id, at: (r.meta && r.meta.at) || r.updated_at, label: (r.meta && r.meta.label) || "Copy",
      by: r.meta && r.meta.by, entries: r.meta && r.meta.entries })).sort((a, b) => String(b.at).localeCompare(String(a.at)));
  };
  const restoreBackup = async (id) => {
    const { data, error } = await sb.from("budgets").select("state").eq("id", id).maybeSingle();
    if (error || !data || !data.state) return false;
    await backupBefore("Before restoring a backup");
    const { __backup, ...snap } = data.state;
    stateRef.current = snap; setState(snap);
    await doSave(snap);
    return JSON.stringify(snap) === lastSavedRef.current;
  };
  const downloadCopy = () => {
    const blob = new Blob([JSON.stringify(stateRef.current, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `ramirez-rojas-budget-${localToday()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const dailyDone = useRef(false);
  useEffect(() => { if (loaded && state && !dailyDone.current) { dailyDone.current = true; backupDaily(state); } }, [loaded]);

  const updateImporter = (fn) => update((s) => { s.importer = { ...EMPTY_IMPORTER, ...(s.importer || {}) }; fn(s.importer); });

  /* ---- buckets ---- */
  const addBucket = (name) => update((s)=>{ if(!s.buckets) s.buckets={}; if(s.buckets[name]) return; s.buckets[name]={name}; });
  const renameBucket = (oldN,newN) => update((s)=>{ if(!s.buckets||!s.buckets[oldN]||newN===oldN) return; s.buckets[newN]={name:newN}; delete s.buckets[oldN]; s.entries.forEach((e)=>{ if(e.bucket===oldN) e.bucket=newN; }); });
  const deleteBucket = (name) => update((s)=>{ if(!s.buckets||!s.buckets[name]) return; delete s.buckets[name]; s.entries.forEach((e)=>{ if(e.bucket===name) e.bucket=undefined; }); });
  const setBucketForEntry = (id, b) => update((s)=>{ const e=s.entries.find((x)=>x.id===id); if(e) e.bucket=b||undefined; });

  /* ---- expense split between partners (stores Mao's % share; 50 = even default) ---- */
  const setSplit = (cat, pct) => update((s)=>{ if(!s.split) s.split={}; if(pct===50) delete s.split[cat]; else s.split[cat]=pct; });

  /* ---- end year archive ---- */
  const endYear = async () => {
    const yr = year;
    if (!confirm(`Archive the ${yr} budget and start ${yr+1} fresh?\n\nThis is reversible — you can Restore ${yr} anytime from this same section. Your logged transactions are never deleted.`)) return;
    await backupBefore("Before archiving the year");
    try {
      await window.saveArchive(yr, state);
      update((s)=>{ TYPES.forEach((type)=>{ s.plan[type]={}; s.categories[type].forEach((c)=>{ s.plan[type][c]={}; }); }); });
      openMonth(`${yr+1}-01`);
      const a = await window.loadArchives(); setArchives(a||[]);
      alert(`✓ ${yr} archived. You're now budgeting ${yr+1}. You can Restore ${yr} anytime.`);
    } catch (e) { alert("Error archiving: " + e.message); }
  };

  const restoreYear = async (yr) => {
    const a = archives.find((x)=>x.year===yr);
    if (!a || !a.state) { alert("No archived data found for " + yr); return; }

    await backupBefore(`Before restoring ${yr}`);
    update((s)=>{

/* ================= PERIOD: one date range drives every tab ================= */
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthStart = (key) => key + "-01";
const monthEnd = (key) => { const [y, m] = key.split("-").map(Number); return `${key}-${pad(new Date(y, m, 0).getDate())}`; };
const addMonths = (key, n) => { const [y, m] = key.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return mk(d.getFullYear(), d.getMonth() + 1); };
const monthsBetween = (a, b) => { const out = []; for (let k = a; k <= b && out.length < 600; k = addMonths(k, 1)) out.push(k); return out; };
const addDaysISO = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); const t = new Date(y, m - 1, d + n); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
const monthLabel = (key) => `${MLABEL[+key.slice(5) - 1]} ${key.slice(0, 4)}`;
const shiftYear = (iso, n) => { const y = +iso.slice(0, 4) + n; let d = iso.slice(5); if (d === "02-29" && !(y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0))) d = "02-28"; return `${y}-${d}`; };
const isWholeMonths = (r) => r.from === monthStart(r.from.slice(0, 7)) && r.to === monthEnd(r.to.slice(0, 7));

const PRESETS = {
  month: () => { const k = localToday().slice(0, 7); return { from: monthStart(k), to: monthEnd(k) }; },
  last: () => { const k = addMonths(localToday().slice(0, 7), -1); return { from: monthStart(k), to: monthEnd(k) }; },
  year: () => { const y = localToday().slice(0, 4); return { from: `${y}-01-01`, to: `${y}-12-31` }; },
};
function allTimeRange(state) {
  const today = localToday();
  const dates = state.entries.map((e) => e.date).filter(Boolean).sort();
  const bm = budgetedMonths(state);
  const first = [dates[0], bm[0] && monthStart(bm[0]), today].filter(Boolean).sort()[0];
  const last = [dates[dates.length - 1], today].filter(Boolean).sort().pop();
  return { from: monthStart(first.slice(0, 7)), to: monthEnd(last.slice(0, 7)) };
}
function describeRange(r) {
  const fk = r.from.slice(0, 7), tk = r.to.slice(0, 7);
  const ml = (k) => MLABEL[+k.slice(5) - 1];
  if (isWholeMonths(r)) {
    if (fk === tk) return monthLabel(fk);
    if (fk.slice(5) === "01" && tk.slice(5) === "12" && fk.slice(0, 4) === tk.slice(0, 4)) return fk.slice(0, 4);
    return fk.slice(0, 4) === tk.slice(0, 4) ? `${ml(fk)} – ${ml(tk)} ${tk.slice(0, 4)}` : `${monthLabel(fk)} – ${monthLabel(tk)}`;
  }
  const d = (iso) => `${ml(iso.slice(0, 7))} ${+iso.slice(8)}`;
  return r.from.slice(0, 4) === r.to.slice(0, 4) ? `${d(r.from)} – ${d(r.to)}, ${r.to.slice(0, 4)}` : `${d(r.from)}, ${r.from.slice(0, 4)} – ${d(r.to)}, ${r.to.slice(0, 4)}`;
}
function shiftRange(r, dir) {
  if (isWholeMonths(r)) {
    const fk = r.from.slice(0, 7), tk = r.to.slice(0, 7), n = monthsBetween(fk, tk).length * dir;
    return { from: monthStart(addMonths(fk, n)), to: monthEnd(addMonths(tk, n)) };
  }
  const len = daysBetween(r.from, r.to) + 1;
  return { from: addDaysISO(r.from, len * dir), to: addDaysISO(r.to, len * dir) };
}
function makePeriod(r) {
  const months = monthsBetween(r.from.slice(0, 7), r.to.slice(0, 7));
  const inRange = (d) => !!d && d >= r.from && d <= r.to;
  const today = localToday();
  return { ...r, months, inRange, label: describeRange(r), defaultDate: inRange(today) ? today : r.from };
}

/* ================= PAYCHECKS AT MONTH-END =================
   A paycheck landing in the last few days of a month pays next month's bills, so it counts toward next month.
   The entry keeps its real date; only budgeting uses the shifted one. A single entry can override: "same" or "next". */
const incomeShiftDays = (state) => { const n = state.settings && state.settings.incomeShiftDays; return Number.isInteger(n) ? n : 3; };
function countsDate(e, state) {
  if (!e.date) return e.date;
  const key = e.date.slice(0, 7);
  if (e.budgetMonth === "same") return e.date;
  if (e.budgetMonth === "next") return monthStart(addMonths(key, 1));
  if (e.type !== "Income") return e.date;
  const n = incomeShiftDays(state);
  if (!n) return e.date;
  return +e.date.slice(8) > +monthEnd(key).slice(8) - n ? monthStart(addMonths(key, 1)) : e.date;
}
const countsMonth = (e, state) => (countsDate(e, state) || "").slice(0, 7);

/* ================= DATA COMPLETENESS =================
   Once an account's statements are being imported, a month is complete only when that account's statements
   cover every day of it (up to today). Months before an account's first statement aren't judged. */
function statementGaps(state, key) {
  const imp = state.importer;
  if (!imp || !imp.imports || !imp.imports.length) return [];
  const today = localToday();
  const ms = monthStart(key);
  if (ms > today) return [];
  const me = monthEnd(key) < today ? monthEnd(key) : today;
  const byAcct = {};
  imp.imports.forEach((i) => { (byAcct[i.acct] = byAcct[i.acct] || []).push(i); });
  const gaps = [];
  Object.entries(byAcct).forEach(([acct, raw]) => {
    const list = raw.slice().sort((a, b) => a.start.localeCompare(b.start));
    let cursor = ms > list[0].start ? ms : list[0].start;
    if (cursor > me) return;
    for (const i of list) {
      if (i.end < cursor) continue;
      if (i.start > me) break;
      if (i.start > cursor) gaps.push({ acct, from: cursor, to: addDaysISO(i.start, -1) });
      cursor = addDaysISO(i.end, 1);
      if (cursor > me) break;
    }
    if (cursor <= me) gaps.push({ acct, from: cursor, to: me });
  });
  return gaps;
}
function gapLabel(state, g) {
  const reg = (state.importer && state.importer.accounts && state.importer.accounts[g.acct]) || {};
  const name = SI.acctLabel(g.acct, reg.kind, reg);
  return `${name}: ${g.from === g.to ? shortDate(g.from) : `${shortDate(g.from)} – ${shortDate(g.to)}`}`;
}


/* ================= BUDGETS REPEAT =================
   A month is "budgeted" once it has its own amounts (or was edited/copied into).
   A month without its own budget uses the most recent budgeted month before it.
   Budgeted months never change unless you edit them, so past plans stay exactly as they were. */
const monthCache = new WeakMap();
function budgetedMonths(state, fresh) {
  const plan = state.plan || {}, extra = state.planMonths || [];
  if (!fresh) { const hit = monthCache.get(plan); if (hit && hit.extra === extra) return hit.keys; }
  const set = new Set(extra);
  TYPES.forEach((t) => Object.values(plan[t] || {}).forEach((byMonth) => Object.entries(byMonth || {}).forEach(([k, v]) => { if (v) set.add(k); })));
  const keys = [...set].sort();
  if (!fresh) monthCache.set(plan, { extra, keys });
  return keys;
}
function budgetSource(state, key, fresh) {
  const keys = budgetedMonths(state, fresh);
  let lo = 0, hi = keys.length - 1, ans = null;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (keys[mid] <= key) { ans = keys[mid]; lo = mid + 1; } else hi = mid - 1; }
  return ans;
}
function planFor(state, type, cat, key, fresh) { const src = budgetSource(state, key, fresh); return src ? (state.plan[type]?.[cat]?.[src] || 0) : 0; }
function planSum(state, type, cat, months) { return months.reduce((a, k) => a + planFor(state, type, cat, k), 0); }
// Give `key` its own copy of the budget it currently repeats, so editing it can't change other months.
function ownMonth(s, key) {
  const own = budgetedMonths(s, true);
  if (!own.includes(key)) {
    const src = budgetSource(s, key, true);
    if (src) TYPES.forEach((t) => (s.categories[t] || []).forEach((c) => {
      const v = s.plan[t]?.[c]?.[src];
      if (v) { s.plan[t] = s.plan[t] || {}; s.plan[t][c] = s.plan[t][c] || {}; s.plan[t][c][key] = v; }
    }));
  }
  if (!(s.planMonths || []).includes(key)) s.planMonths = [...(s.planMonths || []), key].sort();
}

/* ================= HEADER FILTER ================= */
function PeriodBar({ range, setRange, state }) {
  const presets = [["month", "This month", PRESETS.month], ["last", "Last month", PRESETS.last], ["year", "This year", PRESETS.year], ["all", "All time", () => allTimeRange(state)]];
  const same = (r) => r.from === range.from && r.to === range.to;
  const setFrom = (v) => { if (!v) return; setRange(v <= range.to ? { from: v, to: range.to } : { from: v, to: v }); };
  const setTo = (v) => { if (!v) return; setRange(v >= range.from ? { from: range.from, to: v } : { from: v, to: v }); };
  return (
    <div className="ap-periodctl">
      <div className="ap-period">
        <button className="ap-arrow" onClick={() => setRange(shiftRange(range, -1))} aria-label="Previous period">‹</button>
        <input className="ap-date" type="date" value={range.from} onChange={(e) => setFrom(e.target.value)} aria-label="From date" />
        <span className="ap-dash">to</span>
        <input className="ap-date" type="date" value={range.to} onChange={(e) => setTo(e.target.value)} aria-label="To date" />
        <button className="ap-arrow" onClick={() => setRange(shiftRange(range, 1))} aria-label="Next period">›</button>
      </div>
      <div className="ap-presets">
        {presets.map(([k, l, f]) => { const r = f(); return <button key={k} className={same(r) ? "on" : ""} onClick={() => setRange(r)}>{l}</button>; })}
      </div>
    </div>
  );
}

/* ================= DASHBOARD ================= */
function Dashboard({ state, period, addEntry, deleteEntry }) {
  const [q, setQ] = useState("");
  const buckets = Object.keys(state.buckets || {});
  const planAmt = (type, cat) => planSum(state, type, cat, period.months);
  const monthEntries = state.entries.filter((e) => period.inRange(countsDate(e, state)));
  const spentBy = (type) => { const o = {}; monthEntries.filter((e) => e.type === type).forEach((e) => o[e.category] = (o[e.category] || 0) + e.amount); return o; };

  const expSpent = spentBy("Expenses");
  const envelopes = useMemo(() => {
    const cats = [...new Set([...state.categories.Expenses, ...Object.keys(expSpent)])];
    return cats.map((c) => ({ c, budget: planAmt("Expenses", c), spent: expSpent[c] || 0 }))
      .filter((e) => e.budget > 0 || e.spent > 0)
      .map((e) => ({ ...e, remaining: e.budget - e.spent }))
      .sort((a, b) => b.budget - a.budget || b.spent - a.spent);
  }, [state, period]);

  const incBudget = state.categories.Income.reduce((a, c) => a + planAmt("Income", c), 0);
  const expBudget = state.categories.Expenses.reduce((a, c) => a + planAmt("Expenses", c), 0);
  const savBudget = state.categories.Savings.reduce((a, c) => a + planAmt("Savings", c), 0);
  const spentTotal = monthEntries.filter((e) => e.type === "Expenses").reduce((a, e) => a + e.amount, 0);
  const usedPct = expBudget > 0 ? (spentTotal / expBudget) * 100 : (spentTotal > 0 ? 120 : 0);
  const remaining = expBudget - spentTotal;
  const n = period.months.length;
  const monthGaps = period.months.flatMap((k) => statementGaps(state, k));
  // spending pace: how much of the period has passed (only while today is inside it)
  const today = localToday();
  const elapsed = period.inRange(today) ? (daysBetween(period.from, today) + 1) / (daysBetween(period.from, period.to) + 1) : null;
  // "everyday" categories have frequent transactions; one-off bills like the mortgage would give false alarms
  const variableCats = useMemo(() => {
    const since = monthStart(addMonths(period.from.slice(0, 7), -3)), cnt = {};
    state.entries.forEach((e) => { if (e.type === "Expenses" && e.date >= since && e.date < period.from) cnt[e.category] = (cnt[e.category] || 0) + 1; });
    monthEntries.forEach((e) => { if (e.type === "Expenses") cnt[e.category] = (cnt[e.category] || 0) + 0.5; });
    return new Set(Object.keys(cnt).filter((c) => cnt[c] >= 6));
  }, [state, period]);
  const everyday = envelopes.filter((e) => variableCats.has(e.c) && e.budget > 0);
  const evBudget = everyday.reduce((a, e) => a + e.budget, 0), evSpent = everyday.reduce((a, e) => a + e.spent, 0);

  return (
    <>
      <section className="ap-summary">
        <Stat label="Planned income" val={incBudget} color="var(--emerald)" />
        <Stat label="Budgeted" val={expBudget} />
        <Stat label="Spent" val={spentTotal} color="var(--clay)" />
        <Stat label="Left to spend" val={remaining} color={remaining < 0 ? "var(--clay)" : "var(--ink)"} hero />
      </section>
      {(n > 1 || !isWholeMonths(period)) && (
        <p className="ap-rangenote">Showing <b>{period.label}</b>. Budgets count whole months ({n === 1 ? monthLabel(period.months[0]) : `${n} months, ${monthLabel(period.months[0])} to ${monthLabel(period.months[n - 1])}`}); spending counts only the dates in the range.</p>
      )}

      {monthGaps.length > 0 && (
        <div className="ap-partialnote">
          <b>{period.label} isn't complete yet.</b> Not imported: {monthGaps.slice(0, 3).map((g) => gapLabel(state, g)).join("; ")}{monthGaps.length > 3 ? `; and ${monthGaps.length - 3} more` : ""}. Income and spending from those dates aren't counted yet.
        </div>
      )}

      <div className="ap-overall">
        <div className="ap-overall-top">
          <span>{usedPct.toFixed(0)}% of budget used</span>
          <span className="mono">{fmt(spentTotal)} / {fmt(expBudget)}</span>
        </div>
        <div className="ap-track ap-track-lg">
          <div className="ap-fill" style={{ width: Math.min(usedPct, 100) + "%",
            background: usedPct > 100 ? "var(--clay)" : usedPct > 85 ? "var(--navy)" : "var(--emerald)" }} />
        </div>
        {elapsed !== null && evBudget > 0 && (() => {
          const used = evSpent / evBudget, ahead = used > elapsed + 0.08;
          return <div className={"ap-note ap-pacenote" + (ahead ? " warn" : "")}>Everyday spending ({everyday.length === 1 ? everyday[0].c : `${everyday.length} categories`}): <b>{Math.round(used * 100)}%</b> spent with <b>{Math.round(elapsed * 100)}%</b> of {period.label} gone. {ahead ? "Spending is running ahead of the calendar." : "On pace."}</div>;
        })()}
        {savBudget > 0 && <div className="ap-note">Plan sets aside <b>{fmt(savBudget)}</b> to savings · unallocated {fmt(incBudget - expBudget - savBudget)}</div>}
      </div>

      <AddBar state={state} defDate={period.defaultDate} addEntry={addEntry} />

      <div className="ap-envsearch">
        <input type="text" placeholder="Search expense categories…" value={q} onChange={(e) => setQ(e.target.value)} />
        {q && <button onClick={() => setQ("")}>×</button>}
      </div>

      <section className="ap-env-grid">
        {envelopes.filter((e) => !q || e.c.toLowerCase().includes(q.toLowerCase())).map((e) => (
          <Envelope key={e.c} env={e}
            items={monthEntries.filter((x) => x.type === "Expenses" && x.category === e.c)}
            defDate={period.defaultDate} addEntry={addEntry}
            onDelete={deleteEntry} buckets={buckets} elapsed={elapsed} everyday={variableCats.has(e.c)} periodLabel={period.label} />
        ))}
        {envelopes.length === 0 && <p className="ap-loading">No expense budget or spending for {period.label}. Set one in Planning.</p>}
        {envelopes.length > 0 && envelopes.filter((e) => !q || e.c.toLowerCase().includes(q.toLowerCase())).length === 0 && <p className="ap-loading">No expense category matches "{q}".</p>}
      </section>

      <MiniPanel title="Savings" rows={state.categories.Savings} planAmt={(c) => planAmt("Savings", c)} spent={spentBy("Savings")} accent="teal" verb="saved" />
      <MiniPanel title="Income received" rows={state.categories.Income} planAmt={(c) => planAmt("Income", c)} spent={spentBy("Income")} accent="emerald" verb="received" />
    </>
  );
}


function Stat({ label, val, color, hero }) {
  return (
    <div className={"ap-stat"+(hero?" hero":"")}>
      <span className="lbl">{label}</span>
      <span className="val" style={color&&!hero?{color}:undefined}>{fmt(val)}</span>
    </div>
  );
}

function Envelope({ env, items, defDate, addEntry, onDelete, buckets, elapsed, everyday, periodLabel }) {
  const [open, setOpen] = useState(false);
  const [adding, setAdding] = useState(false);
  const [amt, setAmt] = useState("");
  const [note, setNote] = useState("");
  const [bucket, setBucket] = useState("");
  const pct = env.budget>0 ? (env.spent/env.budget)*100 : (env.spent>0?120:0);
  const over = env.budget>0 && Math.round(env.spent) > Math.round(env.budget);
  const color = over ? "var(--clay)" : pct>85 ? "var(--navy)" : "var(--emerald)";
  const submit = () => {
    const a = parseFloat(amt); if (!a || a<=0) return;
    addEntry({ id: uid(), date: defDate, type:"Expenses", category: env.c, amount: Math.round(a*100)/100, note: note.trim(), bucket: bucket||undefined });
    setAmt(""); setNote(""); setBucket(""); setAdding(false);
  };
  return (
    <div className={"ap-env"+(over?" over":"")}>
      <div className="ap-env-top">
        <span className="ap-env-name" onClick={()=>items.length&&setOpen(!open)} style={{cursor:items.length?"pointer":"default"}}>
          {env.c}{items.length>0 && <em className="ap-cnt">{items.length}</em>}</span>
        <span className="ap-env-rem" style={{color: over?"var(--clay)":"var(--ink-soft)"}}>
          {env.budget>0 ? (over?fmt(Math.abs(env.remaining))+" over":fmt(env.remaining)+" left") : "unbudgeted"}
        </span>
      </div>
      <div className="ap-track ap-paced"><div className="ap-fill" style={{width:Math.min(pct,100)+"%",background:color}}/>
        {elapsed!==null && elapsed!==undefined && env.budget>0 && <i className="ap-today" style={{left:(elapsed*100)+"%"}} title="Today"/>}</div>
      {everyday && elapsed && env.budget>0 && !over && env.spent/env.budget > elapsed+0.1 && env.spent/elapsed > env.budget && (
        <div className="ap-pace">At this pace about {fmt(env.spent/elapsed)} by the end of {periodLabel}, {fmt(env.spent/elapsed-env.budget)} over.</div>
      )}
      <div className="ap-env-foot">
        <span className="mono">{fmt(env.spent)} <span className="dim">{env.budget>0?"of "+fmt(env.budget):"no budget"}</span></span>
        <button className="ap-envadd" onClick={()=>setAdding(!adding)}>{adding?"Cancel":"+ Add"}</button>
      </div>
      {adding && (
        <div className="ap-envform">
          <span className="cur">$</span>
          <input className="amt" type="number" autoFocus placeholder="0.00" value={amt}
            onChange={(e)=>setAmt(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&submit()}/>
          <input className="note" type="text" placeholder="note (optional)" value={note}
            onChange={(e)=>setNote(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&submit()}/>
          {buckets && buckets.length>0 && (
            <select className="bkt" value={bucket} onChange={(e)=>setBucket(e.target.value)}>
              <option value="">No bucket</option>
              {buckets.map((b)=>(<option key={b} value={b}>{b}</option>))}
            </select>
          )}
          <button className="ap-envgo" onClick={submit}>Log</button>
        </div>
      )}
      {open && (
        <ul className="ap-env-items">
          {items.map((x)=>(
            <li key={x.id}><span className="d">{x.date.slice(8)}</span>
              <span className="n">{x.note||x.name||"—"}{x.bucket && <em className="ap-cnt" style={{marginLeft:6}}>{x.bucket}</em>}</span>
              <span className="a mono">{fmt2(x.amount)}</span>
              <button className="x" onClick={()=>onDelete(x.id)} title="Delete">×</button></li>
          ))}
        </ul>
      )}
    </div>
  );
}

function MiniPanel({ title, rows, planAmt, spent, accent, verb }) {
  const list = [...new Set([...rows, ...Object.keys(spent)])].filter((c)=> planAmt(c)>0 || (spent[c]||0)>0);
  if (list.length===0) return null;
  return (
    <section className="ap-mini">
      <h3 className="ap-mini-t">{title}</h3>
      <div className="ap-mini-rows">
        {list.map((c)=>{
          const target = planAmt(c), got = spent[c]||0;
          const pct = target>0 ? Math.min((got/target)*100,100) : (got>0?100:0);
          return (<div key={c} className="ap-mini-row">
            <span className="nm">{c}</span>
            <div className="ap-track ap-track-sm"><div className="ap-fill" style={{width:pct+"%",background:`var(--${accent})`}}/></div>
            <span className="mono vl">{fmt(got)} <span className="dim">{target>0?"/ "+fmt(target):verb}</span></span>
          </div>);
        })}
      </div>

}

const topUsed = (state, type, n = 6) => {
  const cnt = {};
  state.entries.forEach((e) => { if (e.type === type && e.category) cnt[e.category] = (cnt[e.category] || 0) + 1; });
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, n).map(([c]) => c);
};
function Combo({ value, onChange, options, placeholder, top }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const lead = !q && top ? top.filter((o) => options.includes(o)) : [];
  const filtered = options.filter((o) => o.toLowerCase().includes(q.toLowerCase()) && !lead.includes(o));
  return (
    <div className="ap-combo">
      <input type="text" value={open ? q : value} placeholder={placeholder}
        onFocus={()=>{ setOpen(true); setQ(""); }}
        onChange={(e)=>{ setQ(e.target.value); setOpen(true); }}
        onBlur={()=>setTimeout(()=>setOpen(false), 150)}
        onKeyDown={(e)=>{ if(e.key==="Enter" && filtered[0]){ onChange(filtered[0]); setOpen(false); e.target.blur(); } if(e.key==="Escape"){ setOpen(false); e.target.blur(); } }}/>
      {open && (
        <ul className="ap-combo-list">
          {lead.length>0 && <li className="hd">Most used</li>}
          {lead.map((o)=>(<li key={"top-"+o} onMouseDown={(e)=>{ e.preventDefault(); onChange(o); setOpen(false); }}>{o}</li>))}
          {lead.length>0 && filtered.length>0 && <li className="hd">All categories</li>}
          {filtered.map((o)=>(<li key={o} onMouseDown={(e)=>{ e.preventDefault(); onChange(o); setOpen(false); }}>{o}</li>))}
          {filtered.length===0 && lead.length===0 && <li className="none">No match</li>}
        </ul>
      )}
    </div>
  );
}

function AddBar({ state, defDate, addEntry }) {
  const [type, setType] = useState("Expenses");
  const [category, setCategory] = useState(state.categories.Expenses[0] || "");
  const dflt = () => defDate;
  const [date, setDate] = useState(dflt());
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const [bucket, setBucket] = useState("");
  useEffect(()=>{ setDate(dflt()); }, [defDate]);
  const cats = state.categories[type] || [];
  const buckets = Object.keys(state.buckets || {});
  useEffect(()=>{ if (!cats.includes(category)) setCategory(cats[0]||""); }, [type]);

  const add = () => {
    const amt = parseFloat(amount); if (!amt || amt<=0 || !category) return;
    addEntry({ id: uid(), date, type, category, amount: Math.round(amt*100)/100, note: note.trim(), bucket: (type==="Expenses"&&bucket&&bucket!=="No bucket")?bucket:undefined });
    setAmount(""); setNote(""); setBucket("");
  };
  return (
    <div className="ap-addbar">
      <span className="ap-add-lbl">Log</span>
      <select value={type} onChange={(e)=>setType(e.target.value)}>
        {TYPES.map((t)=>(<option key={t}>{t}</option>))}
      </select>
      <div className="wide"><Combo value={category} onChange={setCategory} options={cats} top={topUsed(state, type)} placeholder="Search category…"/></div>
      {type==="Expenses" && buckets.length>0 && (
        <div className="bktwrap"><Combo value={bucket} onChange={(v)=>setBucket(v==="No bucket"?"":v)} options={["No bucket", ...buckets]} placeholder="Bucket…"/></div>
      )}
      <input type="date" value={date} onChange={(e)=>setDate(e.target.value)}/>
      <input className="amt" type="number" placeholder="0.00" value={amount}
        onChange={(e)=>setAmount(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&add()}/>
      <input className="note" type="text" placeholder="note (optional)" value={note}
        onChange={(e)=>setNote(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&add()}/>
      <button className="ap-addbtn" onClick={add}>Add</button>
    </div>
  );
}

function Planning({ state, period, setSetting, setPlanAmt, addCat, removeCat, renameCat, copyBudget, resetPlan, addBucket, renameBucket, deleteBucket }) {
  const months = period.months;
  const single = months.length === 1;
  const first = months[0], last = months[months.length - 1];
  const perMonth = (type, c) => { const vals = months.map((k) => planFor(state, type, c, k)); return vals.every((v) => v === vals[0]) ? vals[0] : null; };
  const total = (type) => state.categories[type].reduce((a, c) => a + planSum(state, type, c, months), 0);
  const toAllocate = total("Income") - total("Expenses") - total("Savings");
  const prevKey = addMonths(first, -1);
  const prevEntries = state.entries.filter((e) => e.date && countsMonth(e, state) === prevKey);
  const actual = (type, c) => prevEntries.filter((e) => e.type === type && e.category === c).reduce((a, e) => a + e.amount, 0);
  // suggestions: average of the last 3 months that have data and whose statements are fully imported
  const avgMonths = useMemo(() => [1, 2, 3].map((n) => addMonths(first, -n))
    .filter((k) => statementGaps(state, k).length === 0 && state.entries.some((e) => e.date && countsMonth(e, state) === k)), [state, first]);
  const avgFor = (type, c) => {
    if (!avgMonths.length) return null;
    const tot = state.entries.filter((e) => e.type === type && e.category === c && avgMonths.includes(countsMonth(e, state))).reduce((a, e) => a + e.amount, 0);
    return tot > 0 ? Math.round(tot / avgMonths.length) : null;
  };
  const fillFromAverages = () => {
    let n = 0;
    TYPES.forEach((t) => state.categories[t].forEach((c) => { const v = avgFor(t, c); if (v && !perMonth(t, c)) { setPlanAmt(t, c, months, v); n++; } }));
    setMsg(n ? { ok: true, text: `Filled ${n} empty budgets with their ${avgMonths.length}-month averages.` } : { ok: false, text: "No empty budgets with spending history to fill." });
  };
  const src = single ? budgetSource(state, first) : null;
  const inherited = !!(single && src && src !== first);
  const sources = budgetedMonths(state).slice().reverse().filter((k) => !months.includes(k));
  const [srcKey, setSrcKey] = useState("");
  const [msg, setMsg] = useState(null);
  const sourcesSig = sources.join(",");
  useEffect(() => { setMsg(null); setSrcKey(sources.find((k) => k < first) || sources[0] || ""); }, [first, last, sourcesSig]);

  return (
    <section className="ap-plan">
      <div className="ap-plan-bar">
        <div className={"ap-alloc" + (toAllocate === 0 ? " ok" : toAllocate < 0 ? " neg" : "")}>
          <span>{single ? "To allocate" : `To allocate, ${months.length} months`}</span><b>{fmt(toAllocate)}</b>
        </div>
        <div className="ap-plan-actions">
          <div className="ap-copyfrom">
            <span>Copy from</span>
            <select value={srcKey} onChange={(e) => setSrcKey(e.target.value)} disabled={!sources.length} aria-label="Month to copy from">
              {sources.length ? sources.map((k) => <option key={k} value={k}>{monthLabel(k)}</option>) : <option value="">No budgeted months yet</option>}
            </select>
            <button onClick={() => setMsg(copyBudget(srcKey, months))} disabled={!srcKey}>Copy</button>
          </div>
          <button className="ghost" onClick={fillFromAverages} disabled={!avgMonths.length} title="Uses the last 3 complete months">Fill empty from averages</button>
          <button className="ghost" onClick={resetPlan}>Reset to original</button>
        </div>
      </div>
      {msg && <div className={"ap-planmsg" + (msg.ok ? "" : " err")}>{msg.text}</div>}

      <p className="ap-plan-hint">
        {single
          ? <>Editing the budget for <b>{monthLabel(first)}</b>. Amounts repeat into later months until you change them.</>
          : <>Editing <b>{period.label}</b>. An amount you type applies to each of these {months.length} months only; {monthLabel(addMonths(last, 1))} keeps its own budget. Rows marked "varies" differ between these months.</>}
        {" "}Aim to bring "To allocate" to $0.
      </p>
      <label className="ap-paysetting">
        Paychecks in the last
        <select value={incomeShiftDays(state)} onChange={(e) => setSetting("incomeShiftDays", +e.target.value)} aria-label="Days before month-end">
          {[0, 1, 2, 3, 4, 5].map((n) => <option key={n} value={n}>{n === 0 ? "0 days (off)" : n === 1 ? "1 day" : n + " days"}</option>)}
        </select>
        of a month count toward the next month's budget.
      </label>
      {inherited && <p className="ap-inherit-note">{monthLabel(first)} doesn't have its own budget yet, so it's repeating <b>{monthLabel(src)}</b>. Change any amount and {MLABEL[+first.slice(5) - 1]} gets its own budget; later months follow it.</p>}

      <BucketManager state={state} addBucket={addBucket} renameBucket={renameBucket} deleteBucket={deleteBucket} />

      {TYPES.map((type) => (
        <PlanSection key={type} type={type} cats={state.categories[type]} planAmt={(c) => perMonth(type, c)}
          total={total(type)} setPlanAmt={(c, v) => setPlanAmt(type, c, months, v)}
          actual={(c) => actual(type, c)} avg={(c) => avgFor(type, c)} actualLabel={MLABEL[+prevKey.slice(5) - 1]} inherited={inherited} perMonthLabel={single ? "Budget" : "Per month"}
          addCat={(n) => addCat(type, n)} removeCat={(c) => removeCat(type, c)} renameCat={(o, n) => renameCat(type, o, n)} />
      ))}
    </section>
  );
}

function BucketManager({ state, addBucket, renameBucket, deleteBucket }) {
  const [newB, setNewB] = useState("");
  const buckets = Object.keys(state.buckets || {});
  const count = (b) => (state.entries||[]).filter((e)=>e.bucket===b).length;
  const add = () => { const v=newB.trim(); if(v && !state.buckets?.[v]){ addBucket(v); setNewB(""); } };
  return (
    <div className="ap-plansec">
      <div className="ap-plansec-head">
        <h3 style={{color:"var(--navy)"}}>Buckets</h3>
        <span className="mono total">{buckets.length}</span>
      </div>
      <p className="ap-plan-hint" style={{margin:"2px 0 10px"}}>Optional groups for transactions (e.g. "Subscriptions" for Netflix, Disney+…). Assign them in Tracking.</p>
      <div className="ap-planrows">
        {buckets.map((b)=>(
          <div key={b} className="ap-planrow">
            <BucketName name={b} onRename={(n)=>renameBucket(b,n)}/>
            <span className="mono dim" style={{fontSize:12}}>{count(b)} items</span>
            <button className="ap-del" onClick={()=>{ if(confirm(`Delete bucket "${b}"? Transactions stay, they just lose this tag.`)) deleteBucket(b); }} title="Remove bucket">×</button>
          </div>
        ))}
        {buckets.length===0 && <p className="ap-empty">No buckets yet.</p>}
      </div>
      <div className="ap-addcat">
        <input type="text" placeholder="+ add bucket" value={newB}
          onChange={(e)=>setNewB(e.target.value)} onKeyDown={(e)=>{ if(e.key==="Enter") add(); }}/>
        <button onClick={add}>Add</button>
      </div>
    </div>
  );
}

function BucketName({ name, onRename }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(name);
  useEffect(()=>setDraft(name),[name]);
  return editing ? (
    <input className="ap-renamein" value={draft} autoFocus
      onChange={(e)=>setDraft(e.target.value)}
      onBlur={()=>{ onRename(draft); setEditing(false); }}
      onKeyDown={(e)=>{ if(e.key==="Enter"){ onRename(draft); setEditing(false);} if(e.key==="Escape"){ setDraft(name); setEditing(false);} }}/>
  ) : (
    <span className="ap-planrow-name" onClick={()=>setEditing(true)} title="Click to rename">{name}</span>
  );
}

function PlanSection({ type, cats, planAmt, total, setPlanAmt, actual, avg, actualLabel, inherited, perMonthLabel, addCat, removeCat, renameCat }) {
  const [newCat, setNewCat] = useState("");
  const tone = type === "Income" ? "emerald" : type === "Savings" ? "teal" : "clay";
  return (
    <div className="ap-plansec">
      <div className="ap-plansec-head">
        <h3 style={{ color: `var(--${tone})` }}>{type}</h3>
        <span className="mono total">{fmt(total)}</span>
      </div>
      {cats.length > 0 && <div className="ap-planlegend"><span>{actualLabel} actual · avg</span><span>{perMonthLabel}</span></div>}
      <div className="ap-planrows">
        {cats.map((c) => (
          <PlanRow key={c} name={c} amount={planAmt(c)} actual={actual(c)} avg={avg(c)} actualLabel={actualLabel} inherited={inherited}
            onAmount={(v) => setPlanAmt(c, v)} onRename={(n) => renameCat(c, n)} onRemove={() => removeCat(c)} />
        ))}
        {cats.length === 0 && <p className="ap-empty">No categories yet.</p>}
      </div>
      <div className="ap-addcat">
        <input type="text" placeholder={"+ add " + type.toLowerCase().replace(/s$/, "") + " category"} value={newCat}
          onChange={(e) => setNewCat(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") { addCat(newCat); setNewCat(""); } }} />
        <button onClick={() => { addCat(newCat); setNewCat(""); }}>Add</button>
      </div>
